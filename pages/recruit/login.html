<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>达人入驻登记 - 注册 / 登录</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body {
      background: linear-gradient(160deg, #eef0ff 0%, #f5f7fb 55%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .login-shell {
      width: 400px;
      max-width: 92vw;
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
    }
    .login-brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .login-brand .icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #7c6cf5);
      display: flex; align-items: center; justify-content: center;
    }
    .login-brand span { font-size: 16px; font-weight: 700; color: var(--text); }
    .login-title { font-size: 22px; font-weight: 700; color: var(--text); margin: 24px 0 6px; }
    .login-sub { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }
    .login-tabs { display: flex; gap: 6px; background: #f1f3f9; border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .login-tab {
      flex: 1; padding: 9px 0; text-align: center; font-size: 14px; font-weight: 600;
      color: var(--text-secondary); border: none; background: transparent; border-radius: 9px;
      cursor: pointer; transition: all .18s; font-family: inherit;
    }
    .login-tab.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(15,23,42,.08); }
    .login-form { display: none; }
    .login-form.active { display: block; }
    .login-field { margin-bottom: 18px; }
    .login-field label { display:block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .login-input-row { display: flex; gap: 10px; }
    .login-input {
      flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; outline: none; transition: border-color .18s; box-sizing: border-box;
    }
    .login-input:focus { border-color: var(--primary); }
    .code-btn {
      flex-shrink: 0; padding: 0 16px; border-radius: 10px; border: 1px solid var(--primary);
      background: #fff; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all .18s; white-space: nowrap;
    }
    .code-btn:hover { background: var(--primary-light); }
    .code-btn:disabled { border-color: var(--border); color: var(--text-disabled); cursor: not-allowed; background: #fff; }
    .login-submit {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #7c6cf5); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
      box-shadow: 0 8px 20px rgba(91,108,245,.28); transition: all .18s;
    }
    .login-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(91,108,245,.35); }
    .login-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 18px; line-height: 1.7; text-align: center; }
    .field-error-text { font-size: 12px; color: #dc2626; margin-top: 6px; display: none; }
    @media (max-width: 640px) {
      .login-shell {
        width: 100%;
        max-width: none;
        margin: 0 20px;
        padding: 32px 20px;
      }
      .login-input {
        height: 48px;
        font-size: 15px;
        padding: 0 14px;
      }
      .login-input-row {
        gap: 8px;
      }
      .code-btn {
        min-width: 96px;
        height: 48px;
        font-size: 13px;
        padding: 0 10px;
      }
      .login-submit {
        height: 48px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
<div class="login-shell">
  <div class="login-brand">
    <div class="icon">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16.3 4.2c.7 2.1 1.9 3.6 3.7 4.4v3.8a8.8 8.8 0 0 1-3.5-.9v4.9a6.2 6.2 0 1 1-6.2-6.2c.4 0 .8 0 1.2.1v3.9c-.4-.2-.8-.3-1.2-.3a2.4 2.4 0 1 0 2.4 2.4V4.2h3.6Z" fill="#fff"/></svg>
    </div>
    <span>内容电商 · 分销枢纽</span>
  </div>
  <div class="login-title">达人入驻登记</div>
  <div class="login-sub">仅限达人客户使用 · 注册后即可提交入驻申请</div>

  <div class="login-tabs">
    <button class="login-tab active" id="tabLogin" onclick="switchMode('login')">登录</button>
    <button class="login-tab" id="tabRegister" onclick="switchMode('register')">注册</button>
  </div>

  <!-- 登录表单：手机号 + 验证码（无需姓名） -->
  <div class="login-form active" id="loginForm">
    <div class="login-field">
      <label>手机号</label>
      <input type="tel" class="login-input" id="loginPhone" maxlength="11" placeholder="请输入已注册的手机号">
      <div class="field-error-text" id="loginPhoneError">请输入正确的11位手机号</div>
    </div>
    <div class="login-field">
      <label>验证码</label>
      <div class="login-input-row">
        <input type="text" class="login-input" id="loginCode" maxlength="6" placeholder="请输入验证码">
        <button class="code-btn" id="loginCodeBtn" onclick="sendCode('login')">获取验证码</button>
      </div>
      <div class="field-error-text" id="loginCodeError">验证码错误，请重新输入</div>
    </div>
    <button class="login-submit" onclick="doLogin()">登录</button>
    <div class="login-hint">还没有账号？<a href="javascript:void(0)" onclick="switchMode('register')" style="color:var(--primary);font-weight:600;text-decoration:underline;">立即注册</a><br><a href="javascript:void(0)" onclick="quickDemo()" style="color:var(--primary);font-weight:600;text-decoration:underline;">演示快捷登录（跳过验证）</a></div>
  </div>

  <!-- 注册表单：手机号 + 姓名 + 验证码 -->
  <div class="login-form" id="registerForm">
    <div class="login-field">
      <label>手机号</label>
      <input type="tel" class="login-input" id="regPhone" maxlength="11" placeholder="请输入手机号">
      <div class="field-error-text" id="regPhoneError">请输入正确的11位手机号</div>
    </div>
    <div class="login-field">
      <label>姓名</label>
      <input type="text" class="login-input" id="regName" placeholder="请输入姓名">
      <div class="field-error-text" id="regNameError">请输入姓名</div>
    </div>
    <div class="login-field">
      <label>验证码</label>
      <div class="login-input-row">
        <input type="text" class="login-input" id="regCode" maxlength="6" placeholder="请输入验证码">
        <button class="code-btn" id="regCodeBtn" onclick="sendCode('reg')">获取验证码</button>
      </div>
      <div class="field-error-text" id="regCodeError">验证码错误，请重新输入</div>
    </div>
    <button class="login-submit" onclick="doRegister()">注册</button>
    <div class="login-hint">已有账号？<a href="javascript:void(0)" onclick="switchMode('login')" style="color:var(--primary);font-weight:600;text-decoration:underline;">去登录</a><br>注册即代表同意平台入驻协议</div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script src="../../js/auth.js"></script>
<script>
var MOCK_CODE = '1234';
var countdownTimers = {};

// 写入达人登录态（客户端仅支持达人身份）
function setTalentSession(phone, name) {
  Auth.setCurrentUser({ role: 'talent', phone: phone, name: name, permissions: Auth.getRolePermissions('talent') });
  localStorage.setItem('recruit_current_phone', phone);
}

// 切换登录/注册表单
function switchMode(mode) {
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('loginForm').classList.toggle('active', mode === 'login');
  document.getElementById('registerForm').classList.toggle('active', mode === 'register');
}

function sendCode(mode) {
  var phoneId = mode === 'login' ? 'loginPhone' : 'regPhone';
  var btnId = mode === 'login' ? 'loginCodeBtn' : 'regCodeBtn';
  var errId = mode === 'login' ? 'loginPhoneError' : 'regPhoneError';
  var phone = document.getElementById(phoneId).value.trim();
  if (!/^1\d{10}$/.test(phone)) {
    document.getElementById(errId).style.display = 'block';
    return;
  }
  document.getElementById(errId).style.display = 'none';
  showToast('验证码已发送（模拟：' + MOCK_CODE + '）', 'success');
  var btn = document.getElementById(btnId);
  var sec = 60;
  btn.disabled = true;
  btn.textContent = sec + 's后重试';
  countdownTimers[mode] = setInterval(function() {
    sec--;
    if (sec <= 0) {
      clearInterval(countdownTimers[mode]);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    } else {
      btn.textContent = sec + 's后重试';
    }
  }, 1000);
}

// 登录：仅需手机号 + 验证码，手机号必须已注册
function doLogin() {
  var phone = document.getElementById('loginPhone').value.trim();
  var code = document.getElementById('loginCode').value.trim();
  document.getElementById('loginPhoneError').style.display = 'none';
  document.getElementById('loginCodeError').style.display = 'none';

  if (!/^1\d{10}$/.test(phone)) {
    document.getElementById('loginPhoneError').style.display = 'block';
    return;
  }
  if (code !== MOCK_CODE) {
    document.getElementById('loginCodeError').style.display = 'block';
    return;
  }

  var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
  if (!talents[phone]) {
    showToast('该手机号尚未注册，请先注册', 'error');
    document.getElementById('regPhone').value = phone;
    switchMode('register');
    return;
  }
  setTalentSession(phone, talents[phone].name);
  showToast('登录成功', 'success');
  setTimeout(function() { location.href = 'mine.html'; }, 400);
}

// 注册：手机号 + 姓名 + 验证码，注册成功后自动登录
function doRegister() {
  var phone = document.getElementById('regPhone').value.trim();
  var name = document.getElementById('regName').value.trim();
  var code = document.getElementById('regCode').value.trim();
  document.getElementById('regPhoneError').style.display = 'none';
  document.getElementById('regNameError').style.display = 'none';
  document.getElementById('regCodeError').style.display = 'none';

  if (!/^1\d{10}$/.test(phone)) {
    document.getElementById('regPhoneError').style.display = 'block';
    return;
  }
  if (!name) {
    document.getElementById('regNameError').style.display = 'block';
    return;
  }
  if (code !== MOCK_CODE) {
    document.getElementById('regCodeError').style.display = 'block';
    return;
  }

  var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
  if (talents[phone]) {
    showToast('该手机号已注册，请直接登录', 'error');
    document.getElementById('loginPhone').value = phone;
    switchMode('login');
    return;
  }
  talents[phone] = { phone: phone, name: name, talent_id: 'T' + Date.now(), created_at: nowStr() };
  localStorage.setItem('recruit_talents', JSON.stringify(talents));
  setTalentSession(phone, name);
  showToast('注册成功，已自动登录', 'success');
  setTimeout(function() { location.href = 'mine.html'; }, 400);
}

function quickDemo() {
  var demoPhone = '138****2231';
  var demoName = '李潮';
  var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
  if (!talents[demoPhone]) {
    talents[demoPhone] = { phone: demoPhone, name: demoName, talent_id: 'T_DEMO_001', created_at: nowStr() };
    localStorage.setItem('recruit_talents', JSON.stringify(talents));
  }
  setTalentSession(demoPhone, demoName);
  showToast('演示账号已登录（' + demoName + '）', 'success');
  setTimeout(function() { location.href = 'mine.html'; }, 400);
}

function nowStr(){ return new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-'); }

// URL 带 ?mode=register 时默认打开注册表单
if (new URLSearchParams(location.search).get('mode') === 'register') {
  switchMode('register');
}

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}
</script>
<!-- 设备效果预览切换器：电脑 / 手机 -->
<script>
(function() {
  if (self !== top) return;
  function inject(doc) {
    if (!doc || !doc.body) return;
    var bar = doc.createElement('div');
    bar.id = 'deviceSwitcher';
    bar.innerHTML = '<button type="button" id="dsBtnPc" class="ds-active">💻 电脑</button><button type="button" id="dsBtnPhone">📱 手机预览</button>';
    doc.body.appendChild(bar);
    var st = doc.createElement('style');
    st.textContent = '#deviceSwitcher{position:fixed;top:16px;right:16px;z-index:99999;display:flex;gap:2px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:4px;box-shadow:0 6px 20px rgba(15,23,42,.18)}' +
      '#deviceSwitcher button{border:none;background:transparent;padding:7px 14px;border-radius:18px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;line-height:1.4;font-family:inherit}' +
      '#deviceSwitcher button.ds-active{background:#5b6cf5;color:#fff}';
    doc.body.appendChild(st);
    var btnPc = doc.getElementById('dsBtnPc');
    var btnPhone = doc.getElementById('dsBtnPhone');
    function enterPhone() {
      if (doc.getElementById('devicePhone')) return;
      var wrap = doc.createElement('div');
      wrap.id = 'devicePhone';
      wrap.innerHTML = '<div class="dp-frame"><div class="dp-notch"></div><iframe id="dpFrame" title="手机效果预览"></iframe></div>' +
        '<div class="dp-hint">📱 手机效果预览（390px 视口）· 预览内操作同样生效 · 点右上角「电脑」返回</div>';
      var st2 = doc.createElement('style');
      st2.id = 'dpStyle';
      st2.textContent = 'html.dp-phone,html.dp-phone body{height:100%;margin:0}' +
        'html.dp-phone body{background:#0f172a !important;display:flex !important;align-items:center;justify-content:center !important;overflow:hidden !important}' +
        'html.dp-phone > body > *:not(#devicePhone):not(#deviceSwitcher){display:none !important}' +
        '#devicePhone{display:flex;flex-direction:column;align-items:center;gap:14px}' +
        '#devicePhone .dp-frame{width:390px;height:min(800px,88vh);background:#fff;border:10px solid #1e293b;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;position:relative}' +
        '#devicePhone .dp-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:24px;background:#1e293b;border-radius:0 0 16px 16px;z-index:3}' +
        '#devicePhone #dpFrame{width:100%;height:100%;border:none;display:block;background:#fff}' +
        '#devicePhone .dp-hint{color:#94a3b8;font-size:12px;text-align:center}';
      doc.body.appendChild(st2);
      doc.body.appendChild(wrap);
      doc.documentElement.classList.add('dp-phone');
      doc.getElementById('dpFrame').src = location.href;
      btnPc.classList.remove('ds-active');
      btnPhone.classList.add('ds-active');
    }
    function exitPhone() {
      var w = doc.getElementById('devicePhone');
      if (w) w.parentNode.removeChild(w);
      var s = doc.getElementById('dpStyle');
      if (s) s.parentNode.removeChild(s);
      doc.documentElement.classList.remove('dp-phone');
      btnPc.classList.add('ds-active');
      btnPhone.classList.remove('ds-active');
    }
    btnPhone.addEventListener('click', enterPhone);
    btnPc.addEventListener('click', exitPhone);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { inject(document); });
  } else {
    inject(document);
  }
})();
</script>
</body>
</html>
