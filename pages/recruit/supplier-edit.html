<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应商申请入驻编辑</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .page-container { min-height: 100vh; background: #f5f7fb; padding: 24px 28px; }
    .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .page-title { font-size: 18px; font-weight: 700; color: var(--text); flex: 1; }
    .form-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
    .form-card-title { font-size: 15px; font-weight: 700; color: var(--text, #0f172a); margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light); }
    .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 24px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.span-2 { grid-column: span 2; }
    .form-group.span-4 { grid-column: span 4; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .form-label .required { color: #ef4444; margin-left: 2px; }
    .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; font: inherit; font-size: 13px; outline: none; background: #fafbfd; box-sizing: border-box; transition: border-color .18s; }
    .form-input:focus, .form-select:focus { border-color: var(--primary); background: #fff; }
    .field-error { display: none; color: #dc2626; font-size: 12px; margin-top: 5px; }
    .has-error .form-input, .has-error .form-select { border-color: #ef4444; background: #fef2f2; }
    .has-error .field-error { display: block; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 0; }
    @media (max-width: 640px) {
      .page-container { padding: 16px; }
      .form-card { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; gap: 14px; }
      .form-group.span-2, .form-group.span-4 { grid-column: span 1; }
    }
  </style>
</head>
<body>
<div class="page-container">
  <div id="toastContainer" class="toast-container"></div>

  <div class="page-header">
    <button class="btn" onclick="goBack()" style="display:flex;align-items:center;gap:4px;padding:6px 12px;height:auto;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      返回
    </button>
    <div class="page-title" id="pageTitle">编辑供应商申请入驻</div>
  </div>

  <form id="mainForm">
    <!-- 供应商信息 -->
    <div class="form-card">
      <h3 class="form-card-title">供应商信息</h3>
      <div class="form-grid">
        <div class="form-group span-2">
          <label class="form-label">供应商全称/银行账户持有人 <span class="required">*</span></label>
          <input type="text" class="form-input" id="supplierFullName" placeholder="请输入供应商全称" maxlength="100">
          <div class="field-error">供应商全称为必填项</div>
        </div>
        <div class="form-group span-2">
          <label class="form-label">注册地址 <span class="required">*</span></label>
          <input type="text" class="form-input" id="streetAddress" placeholder="请输入注册地址" maxlength="200">
          <div class="field-error">注册地址为必填项</div>
        </div>
        <div class="form-group">
          <label class="form-label">税务登记号 <span class="required">*</span></label>
          <input type="text" class="form-input" id="taxRegNo" placeholder="请输入税务登记号" maxlength="50">
          <div class="field-error">税务登记号为必填项</div>
        </div>
        <div class="form-group">
          <label class="form-label">纳税人类别 <span class="required">*</span></label>
          <select class="form-select" id="taxpayerType">
            <option value="">请选择纳税人类别</option>
            <option value="一般纳税人">一般纳税人</option>
            <option value="小规模纳税人">小规模纳税人</option>
            <option value="其他">其他</option>
          </select>
          <div class="field-error">纳税人类别为必填项</div>
        </div>
      </div>
    </div>

    <!-- 银行账户信息 -->
    <div class="form-card">
      <h3 class="form-card-title">银行账户信息</h3>
      <div class="form-grid">
        <div class="form-group span-2">
          <label class="form-label">银行账户持有人 <span class="required">*</span></label>
          <input type="text" class="form-input" id="accountHolder" placeholder="请输入银行账户持有人" maxlength="100">
          <div class="field-error">银行账户持有人为必填项</div>
        </div>
        <div class="form-group span-2">
          <label class="form-label">收款账号 <span class="required">*</span></label>
          <input type="text" class="form-input" id="payeeAccount" placeholder="请输入收款账号" maxlength="50">
          <div class="field-error">收款账号为必填项</div>
        </div>
        <div class="form-group">
          <label class="form-label">银行名称 <span class="required">*</span></label>
          <input type="text" class="form-input" id="bankName" placeholder="请输入银行名称" maxlength="100">
          <div class="field-error">银行名称为必填项</div>
        </div>
        <div class="form-group">
          <label class="form-label">银行代码 <span class="required">*</span></label>
          <input type="text" class="form-input" id="bankCode" placeholder="请输入银行代码" maxlength="20">
          <div class="field-error">银行代码为必填项</div>
        </div>
        <div class="form-group span-2">
          <label class="form-label">开户行 <span class="required">*</span></label>
          <input type="text" class="form-input" id="bankBranch" placeholder="请输入开户行" maxlength="100">
          <div class="field-error">开户行为必填项</div>
        </div>
        <div class="form-group">
          <label class="form-label">银行联行号</label>
          <input type="text" class="form-input" id="bankCnapsNo" placeholder="请输入银行联行号" maxlength="20">
          <div class="field-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">开户省 <span class="required">*</span></label>
          <input type="text" class="form-input" id="bankProvince" placeholder="请输入开户省" maxlength="50">
          <div class="field-error">开户省为必填项</div>
        </div>
        <div class="form-group">
          <label class="form-label">开户市 <span class="required">*</span></label>
          <input type="text" class="form-input" id="bankCity" placeholder="请输入开户市" maxlength="50">
          <div class="field-error">开户市为必填项</div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn" type="button" onclick="goBack()">取消</button>
      <button class="btn btn-primary" type="submit">保存</button>
    </div>
  </form>
</div>

<script src="../../js/auth.js"></script>
<script>
if (!Auth.requireAuth()) {}

var STORAGE_KEY = 'recruit_supplier_applications';

if (window.parent) {
  window.parent.postMessage({type:'breadcrumb', text:'分销枢纽 <span>/</span> 入驻意向审核 <span>/</span> 供应商申请入驻 <span>/</span> 编辑'}, '*');
}

function g(name) { var r = location.search.match(new RegExp('[?&]' + name + '=([^&]*)')); return r ? decodeURIComponent(r[1]) : ''; }
var recordId = parseInt(g('id')) || 0;
var isEdit = recordId > 0;

function initForm() {
  if (!isEdit) return;
  var list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  var record = list.find(function(r) { return r.id === recordId; });
  if (!record) { showToast('未找到该供应商申请', 'error'); return; }

  document.getElementById('supplierFullName').value = record.supplier_full_name || '';
  document.getElementById('streetAddress').value = record.street_address || '';
  document.getElementById('taxRegNo').value = record.tax_reg_no || '';
  document.getElementById('taxpayerType').value = record.taxpayer_type || '';
  document.getElementById('accountHolder').value = record.account_holder || '';
  document.getElementById('payeeAccount').value = record.payee_account || '';
  document.getElementById('bankName').value = record.bank_name || '';
  document.getElementById('bankCode').value = record.bank_code || '';
  document.getElementById('bankBranch').value = record.bank_branch || '';
  document.getElementById('bankCnapsNo').value = record.bank_cnaps_no || '';
  document.getElementById('bankProvince').value = record.bank_province || '';
  document.getElementById('bankCity').value = record.bank_city || '';
}

document.getElementById('mainForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  // 简单验证
  var required = ['supplierFullName', 'streetAddress', 'taxRegNo', 'taxpayerType', 'accountHolder', 'payeeAccount', 'bankName', 'bankCode', 'bankBranch', 'bankProvince', 'bankCity'];
  var valid = true;
  required.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el.value.trim()) {
      el.parentElement.classList.add('has-error');
      valid = false;
    } else {
      el.parentElement.classList.remove('has-error');
    }
  });

  if (!valid) { showToast('请填写所有必填项', 'error'); return; }

  var list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  var data = {
    supplier_full_name: document.getElementById('supplierFullName').value.trim(),
    street_address: document.getElementById('streetAddress').value.trim(),
    tax_reg_no: document.getElementById('taxRegNo').value.trim(),
    taxpayer_type: document.getElementById('taxpayerType').value,
    account_holder: document.getElementById('accountHolder').value.trim(),
    payee_account: document.getElementById('payeeAccount').value.trim(),
    bank_name: document.getElementById('bankName').value.trim(),
    bank_code: document.getElementById('bankCode').value.trim(),
    bank_branch: document.getElementById('bankBranch').value.trim(),
    bank_cnaps_no: document.getElementById('bankCnapsNo').value.trim(),
    bank_province: document.getElementById('bankProvince').value.trim(),
    bank_city: document.getElementById('bankCity').value.trim()
  };

  if (isEdit) {
    var idx = list.findIndex(function(r) { return r.id === recordId; });
    if (idx >= 0) {
      Object.assign(list[idx], data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      showToast('保存成功', 'success');
      setTimeout(function() { location.href = 'supplier-detail.html?id=' + recordId; }, 1000);
    }
  }
});

function goBack() { 
  if (isEdit) {
    location.href = 'supplier-detail.html?id=' + recordId; 
  } else {
    location.href = 'supplier.html';
  }
}

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}

initForm();
</script>
</body>
</html>
