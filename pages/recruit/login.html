<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>达人入驻登记 - 登录</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body {
      background: linear-gradient(160deg, #eef0ff 0%, #f5f7fb 55%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .login-shell {
      width: 400px;
      max-width: 92vw;
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
    }
    .login-brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .login-brand .icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #7c6cf5);
      display: flex; align-items: center; justify-content: center;
    }
    .login-brand span { font-size: 16px; font-weight: 700; color: var(--text); }
    .login-title { font-size: 22px; font-weight: 700; color: var(--text); margin: 24px 0 6px; }
    .login-sub { font-size: 13px; color: var(--text-tertiary); margin-bottom: 28px; }
    .login-field { margin-bottom: 18px; }
    .login-field label { display:block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .login-input-row { display: flex; gap: 10px; }
    .login-input {
      flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; outline: none; transition: border-color .18s; box-sizing: border-box;
    }
    .login-input:focus { border-color: var(--primary); }
    .code-btn {
      flex-shrink: 0; padding: 0 16px; border-radius: 10px; border: 1px solid var(--primary);
      background: #fff; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all .18s; white-space: nowrap;
    }
    .code-btn:hover { background: var(--primary-light); }
    .code-btn:disabled { border-color: var(--border); color: var(--text-disabled); cursor: not-allowed; background: #fff; }
    .login-submit {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #7c6cf5); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
      box-shadow: 0 8px 20px rgba(91,108,245,.28); transition: all .18s;
    }
    .login-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(91,108,245,.35); }
    .login-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 18px; line-height: 1.7; text-align: center; }
    .field-error-text { font-size: 12px; color: #dc2626; margin-top: 6px; display: none; }
    @media (max-width: 640px) {
      .login-shell {
        width: 100%;
        max-width: none;
        margin: 0 20px;
        padding: 32px 20px;
      }
      .login-input {
        height: 48px;
        font-size: 15px;
        padding: 0 14px;
      }
      .login-input-row {
        gap: 8px;
      }
      .code-btn {
        min-width: 96px;
        height: 48px;
        font-size: 13px;
        padding: 0 10px;
      }
      .login-submit {
        height: 48px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
<div class="login-shell">
  <div class="login-brand">
    <div class="icon">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16.3 4.2c.7 2.1 1.9 3.6 3.7 4.4v3.8a8.8 8.8 0 0 1-3.5-.9v4.9a6.2 6.2 0 1 1-6.2-6.2c.4 0 .8 0 1.2.1v3.9c-.4-.2-.8-.3-1.2-.3a2.4 2.4 0 1 0 2.4 2.4V4.2h3.6Z" fill="#fff"/></svg>
    </div>
    <span>内容电商 · 分销枢纽</span>
  </div>
  <div class="login-title">达人入驻登记</div>
  <div class="login-sub">手机号验证后即完成登录，首次验证自动创建达人身份</div>

  <div class="login-field">
    <label>手机号</label>
    <input type="tel" class="login-input" id="phone" maxlength="11" placeholder="请输入手机号">
    <div class="field-error-text" id="phoneError">请输入正确的11位手机号</div>
  </div>

  <div class="login-field">
    <label>姓名</label>
    <input type="text" class="login-input" id="name" placeholder="请输入姓名（首次登录需填写）">
    <div class="field-error-text" id="nameError">请输入姓名</div>
  </div>

  <div class="login-field">
    <label>验证码</label>
    <div class="login-input-row">
      <input type="text" class="login-input" id="code" maxlength="6" placeholder="请输入验证码">
      <button class="code-btn" id="codeBtn" onclick="sendCode()">获取验证码</button>
    </div>
    <div class="field-error-text" id="codeError">验证码错误，请重新输入</div>
  </div>

  <button class="login-submit" onclick="doLogin()">登录 / 注册</button>

  <div class="login-hint">未注册的手机号验证通过后将自动创建达人身份<br>登录即代表同意平台入驻协议</div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
var MOCK_CODE = '1234';
var countdownTimer = null;

function sendCode() {
  var phone = document.getElementById('phone').value.trim();
  if (!/^1\d{10}$/.test(phone)) {
    document.getElementById('phoneError').style.display = 'block';
    return;
  }
  document.getElementById('phoneError').style.display = 'none';
  showToast('验证码已发送（模拟：' + MOCK_CODE + '）', 'success');
  var btn = document.getElementById('codeBtn');
  var sec = 60;
  btn.disabled = true;
  btn.textContent = sec + 's后重试';
  countdownTimer = setInterval(function() {
    sec--;
    if (sec <= 0) {
      clearInterval(countdownTimer);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    } else {
      btn.textContent = sec + 's后重试';
    }
  }, 1000);
}

function doLogin() {
  var phone = document.getElementById('phone').value.trim();
  var name = document.getElementById('name').value.trim();
  var code = document.getElementById('code').value.trim();
  document.getElementById('phoneError').style.display = 'none';
  document.getElementById('nameError').style.display = 'none';
  document.getElementById('codeError').style.display = 'none';

  if (!/^1\d{10}$/.test(phone)) {
    document.getElementById('phoneError').style.display = 'block';
    return;
  }
  if (code !== MOCK_CODE) {
    document.getElementById('codeError').style.display = 'block';
    return;
  }

  var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
  if (!talents[phone]) {
    if (!name) {
      document.getElementById('nameError').style.display = 'block';
      return;
    }
    talents[phone] = { phone: phone, name: name, talent_id: 'T' + Date.now(), created_at: nowStr() };
    localStorage.setItem('recruit_talents', JSON.stringify(talents));
  }
  localStorage.setItem('recruit_current_phone', phone);
  showToast('登录成功', 'success');
  setTimeout(function() { location.href = 'mine.html'; }, 400);
}

function nowStr(){ return new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-'); }

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}
</script>
</body>
</html>
