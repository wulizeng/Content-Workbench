<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直播账号管理 - 列表</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .link-action-icon { display: inline-flex; align-items: center; gap: 4px; }
    .link-action-icon svg { flex-shrink: 0; }
    #dataTable th, #dataTable td { white-space: nowrap; }
    #dataTable thead th:last-child,
    #dataTable td.col-actions { position: sticky; right: 0; z-index: 2; }
    #dataTable td.col-actions {
      background: #fff;
      box-shadow: inset 1px 0 0 var(--border-light);
    }
    #dataTable tbody tr:hover td.col-actions { background: var(--primary-50); }
    .type-tag {
      display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 10px;
      background: #f1f5f9; color: var(--text-secondary); font-size: 12px; font-weight: 600;
      line-height: 1.6; white-space: nowrap;
    }
    .card-list { display: none; }
    @media (max-width: 1023px) {
      .table-area .table-scroll, .table-area .pagination { display: none; }
      .card-list { display: block; }
      .la-card {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 12px;
      }
      .la-card-head {
        display: flex; justify-content: space-between; align-items: center;
        gap: 10px; margin-bottom: 10px;
      }
      .la-card-head .name { font-size: 15px; font-weight: 700; color: var(--text); }
      .la-card-body { font-size: 13px; color: var(--text-secondary); line-height: 1.9; }
      .la-card-foot {
        display: flex; justify-content: flex-end; gap: 8px;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light);
      }
    }
  </style>
</head>
<body>
<div class="page-container">

  <div id="toastContainer" class="toast-container"></div>

  <script src="../../js/auth.js"></script>
  <script>
    if (!Auth.requireAuth()) {}
    var currentUser = Auth.getCurrentUser();
    if (window.parent) {
      window.parent.postMessage({type:'breadcrumb', text:'分销枢纽 <span>/</span> 直播账号管理'}, '*');
    }
  </script>

  <div class="page-title" style="display:flex;align-items:center;gap:12px;">
    <span>直播账号管理列表</span>
    <a class="btn btn-primary" style="margin-left:auto;padding:6px 16px;font-size:13px;" href="live-account-edit.html?mode=add">新增</a>
  </div>

  <div class="search-area">
    <div class="search-row">
      <div class="search-item">
        <label>账号昵称：</label>
        <input type="text" id="sNickname" placeholder="请输入账号昵称">
      </div>
      <div class="search-item">
        <label>账号所属平台：</label>
        <select id="sPlatform">
          <option value="">全部</option>
          <option value="抖音">抖音</option>
          <option value="快手">快手</option>
          <option value="小红书">小红书</option>
        </select>
      </div>
      <div class="search-item">
        <label>申请类型：</label>
        <select id="sApplyType">
          <option value="">全部</option>
          <option value="新增">新增</option>
          <option value="修改">修改</option>
          <option value="停用">停用</option>
          <option value="启用">启用</option>
        </select>
      </div>
      <div class="search-item">
        <label>主销品牌：</label>
        <select id="sBrand">
          <option value="">全部</option>
          <option value="品牌A">品牌A</option>
          <option value="品牌B">品牌B</option>
          <option value="品牌C">品牌C</option>
        </select>
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>
    <div class="search-active-tags" id="searchTags" style="display:none;"></div>
  </div>

  <div class="card-list" id="cardList"></div>

  <div class="table-area">
    <div class="table-toolbar">
      <button class="btn btn-primary" onclick="addNew()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新增
      </button>
      <button class="btn" onclick="importData()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        导入
      </button>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead>
          <tr>
            <th>序号</th>
            <th>申请类型</th>
            <th>账号所属平台</th>
            <th>账号昵称</th>
            <th>账号UID</th>
            <th>账号类型</th>
            <th>账号运营模式</th>
            <th>账号负责人</th>
            <th>主销品牌</th>
            <th>账号属性</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pagination">
      <span class="page-info">共 <strong id="totalCount">0</strong> 条</span>
      <span class="page-btn disabled">&laquo;</span>
      <span class="page-btn active">1</span>
      <span class="page-btn">&raquo;</span>
    </div>
  </div>

</div>

<script>
var STORAGE_KEY = 'recruit_live_accounts';

var mockData = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || [
  { id:1, apply_type:'新增', platform:'抖音', nickname:'@潮流小美', operation_mode:'自播', uid:'UID_100234', platform_id:'Z142_001', account_type:'蓝V', owner:'运营-李婷', project_group:'项目组A', is_internal:'是', bindphone:'138****2231', brand:'品牌A', account_attr:'主账号', positioning:'潮流女装直播带货', annual_frame:'是', contact_name:'李潮', contact_phone:'138****2231', register_entity:'杭州星辰供应链管理有限公司', need_yuntu:'是', doc_types:['法人身份证','营业执照','开户许可证'], need_seal:'是', creator:'运营-李婷', created_at:'2026-07-20 10:12:00' },
  { id:2, apply_type:'修改', platform:'快手', nickname:'@数码老王', operation_mode:'达人播', uid:'UID_200456', platform_id:'Z143_002', account_type:'个人号', owner:'运营-王强', project_group:'项目组B', is_internal:'否', bindphone:'159****8820', brand:'品牌B', account_attr:'非主账号', positioning:'数码产品测评种草', annual_frame:'否', contact_name:'王强', contact_phone:'159****8820', register_entity:'广州锦华日用品有限公司', need_yuntu:'否', doc_types:['法人身份证','营业执照'], need_seal:'否', creator:'运营-王强', created_at:'2026-07-21 14:05:00' },
  { id:3, apply_type:'新增', platform:'小红书', nickname:'@家居好物研究所', operation_mode:'自播', uid:'UID_300789', platform_id:'Z128_003', account_type:'蓝V', owner:'运营-陈静', project_group:'项目组A', is_internal:'是', bindphone:'186****0093', brand:'品牌C', account_attr:'主账号', positioning:'家居收纳好物分享', annual_frame:'是', contact_name:'陈静', contact_phone:'186****0093', register_entity:'杭州星辰供应链管理有限公司', need_yuntu:'是', doc_types:['法人身份证','营业执照','开户许可证','商标注册证','开票资料'], need_seal:'是', creator:'运营-陈静', created_at:'2026-07-22 09:30:00' }
];

if (!localStorage.getItem(STORAGE_KEY)) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(mockData));
}

function esc(s) {
  if (s === null || s === undefined || s === '') return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="11" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">暂无符合条件的直播账号</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      html += '<tr>';
      html += '<td>' + (index + 1) + '</td>';
      html += '<td><span class="type-tag">' + esc(row.apply_type) + '</span></td>';
      html += '<td>' + esc(row.platform) + '</td>';
      html += '<td>' + esc(row.nickname) + '</td>';
      html += '<td>' + esc(row.uid) + '</td>';
      html += '<td>' + esc(row.account_type) + '</td>';
      html += '<td>' + esc(row.operation_mode) + '</td>';
      html += '<td>' + esc(row.owner) + '</td>';
      html += '<td>' + esc(row.brand) + '</td>';
      html += '<td>' + esc(row.account_attr) + '</td>';
      html += '<td class="col-actions">';
      html += '<a class="link-action link-action-icon" title="编辑" href="live-account-edit.html?mode=edit&id=' + row.id + '"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>编辑</a>';
      html += '<a class="link-action link-action-icon" title="查看详情" href="live-account-detail.html?id=' + row.id + '" style="margin-left:8px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>查看</a>';
      html += '</td></tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
}

function renderCards(data) {
  var list = document.getElementById('cardList');
  var html = '';
  if (data.length === 0) {
    html = '<div class="la-card"><div class="la-card-body">暂无符合条件的直播账号</div></div>';
  } else {
    data.forEach(function(row) {
      html += '<div class="la-card">';
      html += '<div class="la-card-head"><span class="name">' + esc(row.nickname) + '</span><span class="type-tag">' + esc(row.apply_type) + '</span></div>';
      html += '<div class="la-card-body">';
      html += '<div>平台：' + esc(row.platform) + ' | UID：' + esc(row.uid) + '</div>';
      html += '<div>运营模式：' + esc(row.operation_mode) + ' | 负责人：' + esc(row.owner) + '</div>';
      html += '<div>主销品牌：' + esc(row.brand) + '</div>';
      html += '</div>';
      html += '<div class="la-card-foot">';
      html += '<a class="btn" style="height:48px;line-height:48px;padding:0 16px;" href="live-account-edit.html?mode=edit&id=' + row.id + '">编辑</a>';
      html += '<a class="btn btn-primary" style="height:48px;line-height:48px;padding:0 16px;" href="live-account-detail.html?id=' + row.id + '">查看详情</a>';
      html += '</div></div>';
    });
  }
  list.innerHTML = html;
}

var currentFiltered = mockData.slice();

function isMobileView() { return window.matchMedia('(max-width: 1023px)').matches; }

function renderView(data) {
  currentFiltered = data;
  if (isMobileView()) renderCards(data); else renderTable(data);
}

function filterData() {
  var nick = document.getElementById('sNickname').value.trim();
  var plat = document.getElementById('sPlatform').value;
  var at = document.getElementById('sApplyType').value;
  var br = document.getElementById('sBrand').value;
  return mockData.filter(function(x) {
    if (nick && (x.nickname || '').indexOf(nick) < 0) return false;
    if (plat && x.platform !== plat) return false;
    if (at && x.apply_type !== at) return false;
    if (br && x.brand !== br) return false;
    return true;
  });
}

function doSearch() { renderView(filterData()); showSearchTags(); }

function resetSearch() {
  ['sNickname','sPlatform','sApplyType','sBrand'].forEach(function(id) { document.getElementById(id).value = ''; });
  renderView(mockData);
  showSearchTags();
}

function showSearchTags() {
  var map = { sNickname:'账号昵称', sPlatform:'账号所属平台', sApplyType:'申请类型', sBrand:'主销品牌' };
  var tags = [];
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (el && el.value) tags.push({ name: map[id], value: el.value, id: id });
  });
  var container = document.getElementById('searchTags');
  if (!container) return;
  if (tags.length === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }
  var html = '';
  tags.forEach(function(t) {
    html += '<span class="search-active-tag">' + t.name + '：' + esc(t.value) + '<span class="tag-remove" onclick="clearSearchTag(\'' + t.id + '\')">&times;</span></span>';
  });
  container.style.display = '';
  container.innerHTML = html;
}

function clearSearchTag(id) { document.getElementById(id).value = ''; doSearch(); }

function addNew() {
  location.href = 'live-account-edit.html';
}

function importData() {
  showToast('导入功能开发中', 'info');
}

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}

window.addEventListener('resize', function() { renderView(currentFiltered); });
window.addEventListener('pageshow', function() {
  mockData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  renderView(mockData);
});

renderView(mockData);
</script>
</body>
</html>
