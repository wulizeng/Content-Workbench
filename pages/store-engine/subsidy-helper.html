<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>过补助手</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
  .data-table thead th,
  .data-table tbody td {
    text-align: center;
    white-space: nowrap;
  }
  .data-table .col-actions { text-align: center; }
  </style>
</head>
<body>
<div class="page-container">
  <div id="toastContainer" class="toast-container"></div>
  <script>
    if (window.parent) {
      window.parent.postMessage({type:'breadcrumb', text:'活动运营 <span>/</span> 过补助手'}, '*');
    }
  </script>

  <div class="page-title">过补助手</div>

  <!-- 搜索区域 -->
  <div class="search-area">
    <div class="search-row">
      <div class="search-item">
        <label>活动名称：</label>
        <input type="text" id="searchActivityName" placeholder="请输入活动名称">
      </div>
      <div class="search-item">
        <label>平台名称：</label>
        <select id="searchPlatform">
          <option value="">全部</option>
          <option value="抖音">抖音</option>
          <option value="快手">快手</option>
          <option value="小红书">小红书</option>
          <option value="淘宝">淘宝</option>
          <option value="京东">京东</option>
        </select>
      </div>
      <div class="search-item">
        <label>补助状态：</label>
        <select id="searchSubsidyStatus">
          <option value="">全部</option>
          <option value="待发放">待发放</option>
          <option value="已发放">已发放</option>
          <option value="已过期">已过期</option>
        </select>
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>
    <div class="search-active-tags" id="searchTags" style="display:none;"></div>
  </div>

  <!-- 表格区域 -->
  <div class="table-area">
    <div class="table-toolbar">
      <button class="btn btn-primary" onclick="goAdd()">+ 新增补助</button>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
            <th style="width:50px;">序号</th>
            <th style="width:100px;">补助编号</th>
            <th style="width:150px;">活动名称</th>
            <th style="width:90px;">平台名称</th>
            <th style="width:100px;">店铺名称</th>
            <th style="width:100px;">商品款号</th>
            <th style="width:80px;">补助金额</th>
            <th style="width:80px;">补助状态</th>
            <th style="width:130px;">发放时间</th>
            <th style="width:130px;">过期时间</th>
            <th style="width:100px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination">
      <span class="page-info">共 <strong id="totalCount">0</strong> 条</span>
      <span class="page-btn disabled">&laquo;</span>
      <span class="page-btn active">1</span>
      <span class="page-btn">2</span>
      <span class="page-btn">&raquo;</span>
    </div>
  </div>
</div>

<script>
var mockData = [
  { id:1, subsidyNo:'BZ-2026-001', activityName:'618年中大促', platformName:'抖音', shopName:'潮流男装旗舰店', itemNo:'KN-2026-A01', subsidyAmount:'500.00', subsidyStatus:'已发放', issueTime:'2026-06-01 10:00:00', expireTime:'2026-09-01 00:00:00' },
  { id:2, subsidyNo:'BZ-2026-002', activityName:'夏季清仓特卖', platformName:'快手', shopName:'时尚女装专营店', itemNo:'DR-2026-B03', subsidyAmount:'300.00', subsidyStatus:'待发放', issueTime:'', expireTime:'2026-08-31 00:00:00' },
  { id:3, subsidyNo:'BZ-2026-003', activityName:'新品首发活动', platformName:'小红书', shopName:'童装优选店', itemNo:'TS-2026-C02', subsidyAmount:'200.00', subsidyStatus:'已发放', issueTime:'2026-07-20 14:00:00', expireTime:'2026-10-20 00:00:00' },
  { id:4, subsidyNo:'BZ-2026-004', activityName:'双11预售活动', platformName:'淘宝', shopName:'运动户外专营店', itemNo:'JK-2026-D01', subsidyAmount:'800.00', subsidyStatus:'已过期', issueTime:'2026-05-01 08:00:00', expireTime:'2026-07-31 00:00:00' },
  { id:5, subsidyNo:'BZ-2026-005', activityName:'818粉丝节', platformName:'抖音', shopName:'潮流男装旗舰店', itemNo:'SH-2026-F02', subsidyAmount:'400.00', subsidyStatus:'待发放', issueTime:'', expireTime:'2026-10-01 00:00:00' }
];

function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="12" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">点击「+ 新增补助」创建记录</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      html += '<tr>';
      html += '<td><input type="checkbox" class="row-check" value="' + row.id + '" onclick="toggleRow(this)"></td>';
      html += '<td>' + (index + 1) + '</td>';
      html += '<td>' + escapeHtml(row.subsidyNo) + '</td>';
      html += '<td>' + escapeHtml(row.activityName) + '</td>';
      html += '<td>' + escapeHtml(row.platformName) + '</td>';
      html += '<td>' + escapeHtml(row.shopName) + '</td>';
      html += '<td>' + escapeHtml(row.itemNo) + '</td>';
      html += '<td>' + escapeHtml(row.subsidyAmount) + '</td>';
      html += '<td>' + getStatusTag(row.subsidyStatus) + '</td>';
      html += '<td>' + escapeHtml(row.issueTime || '-') + '</td>';
      html += '<td>' + escapeHtml(row.expireTime) + '</td>';
      html += '<td class="col-actions"><a class="link-action" href="javascript:void(0)">编辑</a><a class="link-action" href="javascript:void(0)">查看</a></td>';
      html += '</tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
  document.getElementById('checkAll').checked = false;
}

function toggleAll(el) {
  document.querySelectorAll('.row-check').forEach(function(c) {
    c.checked = el.checked;
    var tr = c.closest('tr');
    if (tr) tr.classList.toggle('row-selected', el.checked);
  });
}
function toggleRow(el) {
  var tr = el.closest('tr');
  if (tr) tr.classList.toggle('row-selected', el.checked);
  var all = document.querySelectorAll('.row-check');
  var checked = document.querySelectorAll('.row-check:checked');
  document.getElementById('checkAll').checked = all.length > 0 && all.length === checked.length;
}

function getStatusTag(status) {
  var cls = '';
  switch(status) {
    case '已发放': cls = 'submitted'; break;
    case '已过期': cls = 'cancelled'; break;
    default: cls = 'initial';
  }
  return '<span class="status-tag ' + cls + '">' + escapeHtml(status) + '</span>';
}
function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div'); div.textContent = str; return div.innerHTML;
}

function doSearch() {
  var name = document.getElementById('searchActivityName').value.trim();
  var platform = document.getElementById('searchPlatform').value;
  var subsidyStatus = document.getElementById('searchSubsidyStatus').value;
  var filtered = mockData.filter(function(r) {
    if (name && r.activityName.indexOf(name) === -1) return false;
    if (platform && r.platformName !== platform) return false;
    if (subsidyStatus && r.subsidyStatus !== subsidyStatus) return false;
    return true;
  });
  renderTable(filtered);
}
function resetSearch() {
  document.getElementById('searchActivityName').value = '';
  document.getElementById('searchPlatform').value = '';
  document.getElementById('searchSubsidyStatus').value = '';
  renderTable(mockData);
}
function goAdd() { showToast('新增补助功能开发中', 'info'); }
function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div'); t.className = 'toast toast-' + (type||'info'); t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('toast-hide'); }, 2500);
  setTimeout(function(){ t.remove(); }, 3000);
}
renderTable(mockData);
</script>
</body>
</html>
