<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>渠道品管理</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
  .data-table thead th,
  .data-table tbody td {
    text-align: center;
    white-space: nowrap;
  }
  .data-table .col-actions { text-align: center; }
  </style>
</head>
<body>
<div class="page-container">
  <div id="toastContainer" class="toast-container"></div>
  <script>
    if (window.parent) {
      window.parent.postMessage({type:'breadcrumb', text:'基础运营 <span>/</span> 渠道品管理'}, '*');
    }
  </script>

  <div class="page-title">渠道品管理</div>

  <!-- 搜索区域 -->
  <div class="search-area">
    <div class="search-row">
      <div class="search-item">
        <label>渠道品名称：</label>
        <input type="text" id="searchChannelName" placeholder="请输入渠道品名称">
      </div>
      <div class="search-item">
        <label>渠道类型：</label>
        <select id="searchChannelType">
          <option value="">全部</option>
          <option value="抖音">抖音</option>
          <option value="快手">快手</option>
          <option value="小红书">小红书</option>
          <option value="淘宝">淘宝</option>
          <option value="京东">京东</option>
        </select>
      </div>
      <div class="search-item">
        <label>状态：</label>
        <select id="searchStatus">
          <option value="">全部</option>
          <option value="启用">启用</option>
          <option value="停用">停用</option>
        </select>
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>
    <div class="search-active-tags" id="searchTags" style="display:none;"></div>
  </div>

  <!-- 表格区域 -->
  <div class="table-area">
    <div class="table-toolbar">
      <button class="btn btn-primary" onclick="goAdd()">+ 新增渠道品</button>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
            <th style="width:50px;">序号</th>
            <th style="width:100px;">渠道品编码</th>
            <th style="width:140px;">渠道品名称</th>
            <th style="width:90px;">渠道类型</th>
            <th style="width:100px;">关联商品款号</th>
            <th style="width:80px;">供货价</th>
            <th style="width:80px;">状态</th>
            <th style="width:130px;">创建时间</th>
            <th style="width:130px;">更新时间</th>
            <th style="width:100px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination">
      <span class="page-info">共 <strong id="totalCount">0</strong> 条</span>
      <span class="page-btn disabled">&laquo;</span>
      <span class="page-btn active">1</span>
      <span class="page-btn">2</span>
      <span class="page-btn">&raquo;</span>
    </div>
  </div>
</div>

<script>
var mockData = [
  { id:1, channelCode:'CH-DY-001', channelName:'抖音专属渠道品A', channelType:'抖音', relatedItemNo:'KN-2026-A01', supplyPrice:'150.00', status:'启用', createTime:'2026-03-20 10:00:00', updateTime:'2026-07-15 14:00:00' },
  { id:2, channelCode:'CH-KS-002', channelName:'快手特供渠道品B', channelType:'快手', relatedItemNo:'DR-2026-B03', supplyPrice:'220.00', status:'启用', createTime:'2026-04-10 09:30:00', updateTime:'2026-07-10 11:00:00' },
  { id:3, channelCode:'CH-XHS-003', channelName:'小红书限定渠道品C', channelType:'小红书', relatedItemNo:'TS-2026-C02', supplyPrice:'95.00', status:'停用', createTime:'2026-05-15 14:00:00', updateTime:'2026-06-20 16:30:00' },
  { id:4, channelCode:'CH-TB-004', channelName:'淘宝渠道专供品D', channelType:'淘宝', relatedItemNo:'JK-2026-D01', supplyPrice:'350.00', status:'启用', createTime:'2026-06-05 08:00:00', updateTime:'2026-07-25 09:15:00' }
];

function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="11" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">点击「+ 新增渠道品」创建记录</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      html += '<tr>';
      html += '<td><input type="checkbox" class="row-check" value="' + row.id + '" onclick="toggleRow(this)"></td>';
      html += '<td>' + (index + 1) + '</td>';
      html += '<td>' + escapeHtml(row.channelCode) + '</td>';
      html += '<td>' + escapeHtml(row.channelName) + '</td>';
      html += '<td>' + escapeHtml(row.channelType) + '</td>';
      html += '<td>' + escapeHtml(row.relatedItemNo) + '</td>';
      html += '<td>' + escapeHtml(row.supplyPrice) + '</td>';
      html += '<td>' + getStatusTag(row.status) + '</td>';
      html += '<td>' + escapeHtml(row.createTime) + '</td>';
      html += '<td>' + escapeHtml(row.updateTime) + '</td>';
      html += '<td class="col-actions"><a class="link-action" href="javascript:void(0)">编辑</a><a class="link-action" href="javascript:void(0)">查看</a></td>';
      html += '</tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
  document.getElementById('checkAll').checked = false;
}

function toggleAll(el) {
  document.querySelectorAll('.row-check').forEach(function(c) {
    c.checked = el.checked;
    var tr = c.closest('tr');
    if (tr) tr.classList.toggle('row-selected', el.checked);
  });
}
function toggleRow(el) {
  var tr = el.closest('tr');
  if (tr) tr.classList.toggle('row-selected', el.checked);
  var all = document.querySelectorAll('.row-check');
  var checked = document.querySelectorAll('.row-check:checked');
  document.getElementById('checkAll').checked = all.length > 0 && all.length === checked.length;
}

function getStatusTag(status) {
  var cls = status === '启用' ? 'submitted' : 'cancelled';
  return '<span class="status-tag ' + cls + '">' + escapeHtml(status) + '</span>';
}
function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div'); div.textContent = str; return div.innerHTML;
}

function doSearch() {
  var name = document.getElementById('searchChannelName').value.trim();
  var type = document.getElementById('searchChannelType').value;
  var status = document.getElementById('searchStatus').value;
  var filtered = mockData.filter(function(r) {
    if (name && r.channelName.indexOf(name) === -1) return false;
    if (type && r.channelType !== type) return false;
    if (status && r.status !== status) return false;
    return true;
  });
  renderTable(filtered);
}
function resetSearch() {
  document.getElementById('searchChannelName').value = '';
  document.getElementById('searchChannelType').value = '';
  document.getElementById('searchStatus').value = '';
  renderTable(mockData);
}
function goAdd() { showToast('新增渠道品功能开发中', 'info'); }
function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div'); t.className = 'toast toast-' + (type||'info'); t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('toast-hide'); }, 2500);
  setTimeout(function(){ t.remove(); }, 3000);
}
renderTable(mockData);
</script>
</body>
</html>
