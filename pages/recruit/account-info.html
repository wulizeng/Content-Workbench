<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>录入账号信息</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fb; }
    .page-wrap { width: 100%; padding: 24px 28px 48px; box-sizing: border-box; }
    .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-head h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; color: var(--text); }
    .ph-back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--primary); cursor: pointer; border: none; background: none; font-weight: 600; padding: 0; margin-bottom: 6px; }
    .ph-back:hover { opacity: 0.7; }
    .ph-sub { font-size: 12.5px; color: var(--text-tertiary); }
    .form-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
    .form-card h3 { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 24px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-item { display: flex; flex-direction: column; gap: 6px; }
    .form-item label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
    .form-item label .req { color: #ef4444; margin-left: 2px; }
    .form-item input, .form-item select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: #fff; outline: none; transition: border-color .15s; }
    .form-item input:focus, .form-item select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,108,245,.08); }
    .form-actions { display: flex; justify-content: flex-end; gap: 12px; padding-top: 8px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 22px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text-secondary); transition: all .15s; }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(91,108,245,.25); }
    .btn-primary:hover { background: #4a5ae4; }
    .tip-box { padding: 12px 16px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; font-size: 12.5px; color: #92400e; line-height: 1.6; margin-bottom: 18px; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="page-wrap">
  <div id="toastContainer" class="toast-container"></div>
  <script src="../../js/auth.js"></script>
  <script>
    if (!Auth.requireAuth()) {}
    if (window.parent) { window.parent.postMessage({type:'breadcrumb', text:'分销枢纽 <span>/</span> 客户视角 <span>/</span> 客户合作签约 <span>/</span> 录入账号信息'}, '*'); }
  </script>

  <div class="page-head">
    <div>
      <button class="ph-back" onclick="goBack()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回签约总览</button>
      <h1>录入账号信息</h1>
      <div class="ph-sub">填写直播账号、结算账号等基础信息</div>
    </div>
  </div>

  <div class="form-card">
    <h3>直播账号信息</h3>
    <div class="tip-box">请确保填写的账号信息真实有效，提交后将用于平台账号绑定与权限配置。</div>
    <div class="form-grid">
      <div class="form-item">
        <label>直播平台<span class="req">*</span></label>
        <select id="livePlatform">
          <option value="">请选择</option>
          <option value="抖音">抖音</option>
          <option value="快手">快手</option>
          <option value="淘宝直播">淘宝直播</option>
          <option value="视频号">视频号</option>
        </select>
      </div>
      <div class="form-item">
        <label>直播账号ID<span class="req">*</span></label>
        <input type="text" id="liveAccountId" placeholder="请输入直播账号ID">
      </div>
      <div class="form-item">
        <label>账号昵称<span class="req">*</span></label>
        <input type="text" id="liveAccountName" placeholder="请输入账号昵称">
      </div>
      <div class="form-item">
        <label>粉丝量级</label>
        <select id="fanLevel">
          <option value="">请选择</option>
          <option value="1万以下">1万以下</option>
          <option value="1-10万">1-10万</option>
          <option value="10-50万">10-50万</option>
          <option value="50万以上">50万以上</option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-card">
    <h3>结算账号信息</h3>
    <div class="form-grid">
      <div class="form-item">
        <label>开户银行<span class="req">*</span></label>
        <input type="text" id="bankName" placeholder="请输入开户银行">
      </div>
      <div class="form-item">
        <label>银行账号<span class="req">*</span></label>
        <input type="text" id="bankAccount" placeholder="请输入银行账号">
      </div>
      <div class="form-item">
        <label>开户人姓名<span class="req">*</span></label>
        <input type="text" id="bankHolder" placeholder="请输入开户人姓名">
      </div>
      <div class="form-item">
        <label>联系手机号<span class="req">*</span></label>
        <input type="text" id="contactPhone" placeholder="请输入联系手机号">
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn" onclick="saveDraft()">保存草稿</button>
    <button class="btn btn-primary" onclick="submitNode()">提交并进入下一步 <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<script>
  var LIST_KEY = 'recruit_cooperation_list';
  var CURRENT_KEY = 'recruit_cooperation_current';
  var NODE_KEY = 'account_info';
  function getList() { return JSON.parse(localStorage.getItem(LIST_KEY) || '[]'); }
  function getSignData() {
    var list = getList(); var id = localStorage.getItem(CURRENT_KEY) || '';
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return list.length > 0 ? list[0] : null;
  }
  function saveSignData(data) {
    var list = getList();
    for (var i = 0; i < list.length; i++) { if (list[i].id === data.id) { list[i] = data; break; } }
    localStorage.setItem(LIST_KEY, JSON.stringify(list));
  }

  function saveDraft() {
    var data = getSignData(); if (!data) return;
    data.nodes[NODE_KEY] = 'pending';
    saveSignData(data);
    showToast('草稿已保存', 'success');
  }

  function submitNode() {
    var platform = document.getElementById('livePlatform').value;
    var accId = document.getElementById('liveAccountId').value.trim();
    var accName = document.getElementById('liveAccountName').value.trim();
    var bank = document.getElementById('bankName').value.trim();
    var bankAcc = document.getElementById('bankAccount').value.trim();
    var holder = document.getElementById('bankHolder').value.trim();
    var phone = document.getElementById('contactPhone').value.trim();
    if (!platform) { showToast('请选择直播平台', 'warning'); return; }
    if (!accId || !accName) { showToast('请填写直播账号信息', 'warning'); return; }
    if (!bank || !bankAcc || !holder || !phone) { showToast('请填写结算账号信息', 'warning'); return; }
    var data = getSignData(); if (!data) return;
    data.nodes[NODE_KEY] = 'completed';
    data.live_platform = platform;
    saveSignData(data);
    showToast('账号信息已提交', 'success');
    setTimeout(function() { goBack(); }, 1200);
  }

  function goBack() {
    if (window.parent) { window.parent.postMessage({ type: 'openTab', page: 'pages/recruit/cooperation-sign.html', title: '客户合作签约' }, '*'); }
  }

  function showToast(msg, type) {
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast toast-' + (type || 'info');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function() { t.classList.add('show'); }, 10);
    setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 2500);
  }
</script>
</body>
</html>
