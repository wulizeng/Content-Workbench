<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>达人入驻登记 - 申请表单</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body { background: #f5f7fb; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .apply-shell { max-width: 640px; margin: 0 auto; padding: 24px 20px 80px; }
    .apply-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .apply-header .title { font-size: 20px; font-weight: 700; color: var(--text); }
    .back-link {
      display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-secondary);
      cursor: pointer;
    }

    .form-card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 22px 20px; margin-bottom: 16px;
    }
    .form-card-title {
      font-size: 14px; font-weight: 700; color: var(--text); margin: 0 0 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .form-card-title svg { color: var(--primary); }
    .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .form-label .required { color: #ef4444; margin-left: 2px; }
    .form-input, .form-select {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 9px;
      font: inherit; font-size: 13px; outline: none; background: #fafbfd; box-sizing: border-box;
      transition: border-color .18s;
    }
    .form-input:focus, .form-select:focus { border-color: var(--primary); background: #fff; }
    .field-error { display: none; color: #dc2626; font-size: 12px; margin-top: 5px; }
    .has-error .form-input, .has-error .form-select { border-color: #ef4444; background: #fef2f2; }
    .has-error .field-error { display: block; }

    .platform-account-card {
      border: 1px solid var(--border-light); border-radius: 10px; padding: 16px;
      background: #fafbfd; margin-bottom: 12px; position: relative;
    }
    .platform-account-card .pa-head {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .pa-head .pa-index { font-size: 12px; font-weight: 700; color: var(--primary); }
    .pa-remove {
      font-size: 12px; color: #dc2626; cursor: pointer; background: none; border: none;
    }
    .pa-remove:disabled { color: var(--text-disabled); cursor: not-allowed; }
    .add-platform-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 11px; border-radius: 9px; border: 1.5px dashed var(--primary);
      background: var(--primary-light); color: var(--primary); font-size: 13px; font-weight: 600;
      cursor: pointer;
    }

    .upload-zone {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 24px; border: 2px dashed #cbd5e1; border-radius: 12px; cursor: pointer;
      transition: all .18s; background: #fafbfd;
    }
    .upload-zone:hover { border-color: var(--primary); background: var(--primary-50); }
    .upload-zone svg { width: 28px; height: 28px; color: var(--primary); }
    .upload-zone .title { font-size: 13px; font-weight: 600; color: #475569; }
    .upload-zone .hint { font-size: 12px; color: var(--text-tertiary); }
    .shot-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .shot-chip {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #ecfdf5;
      border-radius: 8px; font-size: 12px; color: #059669;
    }
    .shot-chip .rm { cursor: pointer; color: #dc2626; font-weight: 700; }

    .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 0 20px; }
    .locked-banner {
      background: #fffbeb; color: #d97706; border-radius: 10px; padding: 12px 16px;
      font-size: 13px; margin-bottom: 16px;
    }
    @media (max-width: 640px) {
      .apply-shell { padding: 0 0 88px; }
      .apply-header { padding: 16px 20px 0; }
      .mobile-step-bar {
        display: flex; position: sticky; top: 0; z-index: 10;
        background: #fff; border-bottom: 1px solid var(--border);
        padding: 12px 20px; margin: 12px 0 0;
      }
      .mobile-step-item {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
        font-size: 12px; color: #94a3b8;
      }
      .mobile-step-item .num {
        width: 20px; height: 20px; border-radius: 50%; background: #e2e8f0; color: #64748b;
        display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
        flex-shrink: 0;
      }
      .mobile-step-item.active { color: var(--primary); font-weight: 600; }
      .mobile-step-item.active .num { background: var(--primary); color: #fff; }
      .form-card[data-step] { display: none; margin-left: 20px; margin-right: 20px; }
      .form-card[data-step].step-active { display: block; }
      #formActions { display: none; }
      .mobile-step-nav {
        display: flex; gap: 10px; position: fixed; bottom: 0; left: 0; right: 0;
        background: #fff; border-top: 1px solid var(--border); padding: 12px 20px;
        z-index: 10;
      }
      .mobile-step-nav .btn { flex: 1; height: 48px; }
      .form-input, .form-select { height: 48px; }
      .upload-zone { min-height: 120px; }
    }
    @media (min-width: 641px) {
      .mobile-step-bar, .mobile-step-nav { display: none; }
    }
    @media (min-width: 641px) and (max-width: 1023px) {
      .apply-shell { max-width: 720px; }
      .form-card[data-step="1"],
      .form-card[data-step="3"] {
        display: flex;
        flex-wrap: wrap;
        gap: 0 16px;
      }
      .form-card[data-step="1"] > .form-card-title,
      .form-card[data-step="3"] > .form-card-title {
        flex: 0 0 100%;
      }
      .form-card[data-step="1"] > .form-group {
        flex: 1 1 calc(50% - 16px);
      }
      .form-card[data-step="3"] > .form-group:first-of-type {
        flex: 0 0 calc(50% - 16px);
      }
      .form-card[data-step="3"] > .form-group:not(:first-of-type) {
        flex: 0 0 100%;
      }
    }
    @media (min-width: 1024px) {
      body { display: flex; justify-content: center; }
      .apply-shell { max-width: 640px; margin: 24px 0 24px 260px; }
      .desktop-step-nav {
        display: flex; flex-direction: column; gap: 4px;
        position: fixed; top: 24px; left: max(20px, calc(50% - 460px));
        width: 220px; background: #fff; border: 1px solid var(--border);
        border-radius: 14px; padding: 16px;
      }
      .desktop-step-nav .dsn-item {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        border-radius: 8px; font-size: 13px; color: #94a3b8; cursor: pointer;
      }
      .desktop-step-nav .dsn-item .num {
        width: 22px; height: 22px; border-radius: 50%; background: #f1f5f9; color: #94a3b8;
        display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
        flex-shrink: 0;
      }
      .desktop-step-nav .dsn-item.filled { color: var(--text); }
      .desktop-step-nav .dsn-item.filled .num { background: var(--primary-light); color: var(--primary); }
      .desktop-step-nav .dsn-item.current { background: var(--primary-light); color: var(--primary); font-weight: 600; }
      .desktop-step-nav .dsn-item.current .num { background: var(--primary); color: #fff; }
      .desktop-step-nav .dsn-item.disabled { cursor: not-allowed; }
    }
    @media (max-width: 1023px) {
      .desktop-step-nav { display: none; }
    }
  </style>
</head>
<body>
  <div class="desktop-step-nav" id="desktopStepNav">
    <div class="dsn-item" data-dsn-step="1" onclick="desktopGoToStep(1)"><span class="num">1</span>基础信息</div>
    <div class="dsn-item" data-dsn-step="2" onclick="desktopGoToStep(2)"><span class="num">2</span>平台账号</div>
    <div class="dsn-item" data-dsn-step="3" onclick="desktopGoToStep(3)"><span class="num">3</span>业绩证明</div>
  </div>
<div class="apply-shell">

  <div class="apply-header">
    <span class="back-link" onclick="goBack()">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      返回
    </span>
    <div class="title" id="pageTitle">新建入驻申请</div>
  </div>

  <div class="locked-banner" id="lockedBanner" style="display:none;">
    该申请正在审核中，暂不支持自行修改，如需变更请联系BD人工处理。
  </div>

  <div class="mobile-step-bar" id="mobileStepBar">
    <div class="mobile-step-item" data-step-tab="1"><span class="num">1</span>基础信息</div>
    <div class="mobile-step-item" data-step-tab="2"><span class="num">2</span>平台账号</div>
    <div class="mobile-step-item" data-step-tab="3"><span class="num">3</span>业绩证明</div>
  </div>

  <form id="mainForm">
    <div class="form-card" data-step="1">
      <h3 class="form-card-title">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        基础信息
      </h3>
      <div class="form-group">
        <label class="form-label">运营品牌 <span class="required">*</span></label>
        <select class="form-select" id="brand">
          <option value="">请选择运营品牌</option>
          <option value="品牌A">品牌A</option>
          <option value="品牌B">品牌B</option>
          <option value="品牌C">品牌C</option>
        </select>
        <div class="field-error">运营品牌为必填项</div>
      </div>
      <div class="form-group">
        <label class="form-label">主推产品 <span class="required">*</span></label>
        <input type="text" class="form-input" id="mainProduct" placeholder="请输入主推产品">
        <div class="field-error">主推产品为必填项</div>
      </div>
    </div>

    <div class="form-card" data-step="2">
      <h3 class="form-card-title">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20"/></svg>
        平台账号
      </h3>
      <div id="platformAccountList"></div>
      <div class="add-platform-btn" onclick="addPlatformAccount()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        添加平台账号
      </div>
    </div>

    <div class="form-card" data-step="3">
      <h3 class="form-card-title">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-6"/></svg>
        业绩证明
      </h3>
      <div class="form-group">
        <label class="form-label">近3个月GMV（元） <span class="required">*</span></label>
        <input type="number" class="form-input" id="gmv" placeholder="请输入近3个月GMV数值">
        <div class="field-error">近3个月GMV为必填项</div>
      </div>
      <div class="form-group">
        <label class="form-label">后台业绩截图 <span class="required">*</span></label>
        <div class="upload-zone" onclick="document.getElementById('shotInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <div class="title">点击上传业绩截图</div>
          <div class="hint">支持多图，模拟上传（.png/.jpg）</div>
          <input type="file" id="shotInput" style="display:none" accept="image/*" multiple onchange="handleShotSelect(this.files)">
        </div>
        <div class="shot-list" id="shotList"></div>
        <div class="field-error" id="shotError">请上传至少一张业绩截图</div>
      </div>
    </div>

    <div class="form-actions" id="formActions">
      <button type="button" class="btn" onclick="goBack()">取消</button>
      <button type="button" class="btn btn-primary" onclick="doSubmit()">提交申请</button>
    </div>

    <div class="mobile-step-nav" id="mobileStepNav">
      <button type="button" class="btn" id="stepPrevBtn" onclick="stepPrev()">上一步</button>
      <button type="button" class="btn btn-primary" id="stepNextBtn" onclick="stepNext()">下一步</button>
    </div>
  </form>

</div>

<div id="toastContainer" class="toast-container"></div>

<script>
var phone = localStorage.getItem('recruit_current_phone');
if (!phone) { location.href = 'login.html'; }

function g(name) { var r = location.search.match(new RegExp('[?&]'+name+'=([^&]*)')); return r ? decodeURIComponent(r[1]) : ''; }
var mode = g('mode') || 'add';
var editId = parseInt(g('id')) || 0;
var paSeq = 0;
var shots = [];

var TOTAL_STEPS = 3;
var currentStep = 1;

function isMobileStepMode() {
  return window.matchMedia('(max-width: 640px)').matches;
}

function updateStepUI() {
  if (!isMobileStepMode()) { updateDesktopNavUI(); return; }
  document.querySelectorAll('.form-card[data-step]').forEach(function(card) {
    card.classList.toggle('step-active', Number(card.getAttribute('data-step')) === currentStep);
  });
  document.querySelectorAll('.mobile-step-item').forEach(function(tab) {
    tab.classList.toggle('active', Number(tab.getAttribute('data-step-tab')) === currentStep);
  });
  document.getElementById('stepPrevBtn').style.visibility = currentStep === 1 ? 'hidden' : 'visible';
  document.getElementById('stepNextBtn').textContent = currentStep === TOTAL_STEPS ? '提交申请' : '下一步';
}

function stepPrev() {
  if (currentStep > 1) { currentStep--; updateStepUI(); saveDraft(); window.scrollTo(0, 0); }
}

function stepNext() {
  if (currentStep < TOTAL_STEPS) {
    clearErrors();
    if (!validateStep(currentStep)) {
      showToast('请完善表单中的必填项', 'error');
      return;
    }
    currentStep++;
    updateStepUI();
    saveDraft();
    window.scrollTo(0, 0);
  } else {
    clearErrors();
    var s1 = validateStep(1);
    var s2 = validateStep(2);
    var s3 = validateStep(3);
    if (!s1 || !s2 || !s3) {
      currentStep = !s1 ? 1 : (!s2 ? 2 : 3);
      updateStepUI();
      window.scrollTo(0, 0);
      showToast('请完善表单中的必填项', 'error');
      return;
    }
    doSubmit();
  }
}

var DRAFT_KEY = 'recruit_apply_draft_' + phone;

function saveDraft() {
  if (mode !== 'add') return;
  var draft = {
    currentStep: currentStep,
    brand: document.getElementById('brand').value,
    mainProduct: document.getElementById('mainProduct').value,
    gmv: document.getElementById('gmv').value,
    platformAccounts: collectPlatformAccounts().map(function(a) { return { platform: a.platform, account_name: a.account_name }; }),
    shots: shots.slice()
  };
  localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
}

function restoreDraft() {
  if (mode !== 'add') return false;
  var raw = localStorage.getItem(DRAFT_KEY);
  if (!raw) return false;
  var draft;
  try { draft = JSON.parse(raw); } catch (e) { return false; }
  if (!draft) return false;

  document.getElementById('brand').value = draft.brand || '';
  document.getElementById('mainProduct').value = draft.mainProduct || '';
  document.getElementById('gmv').value = draft.gmv || '';
  shots = (draft.shots || []).slice();
  renderShots();
  document.getElementById('platformAccountList').innerHTML = '';
  (draft.platformAccounts || []).forEach(function(pa) {
    addPlatformAccount(pa.platform, pa.account_name);
  });
  if ((draft.platformAccounts || []).length === 0) addPlatformAccount();
  currentStep = draft.currentStep || 1;
  return true;
}

function clearDraft() {
  localStorage.removeItem(DRAFT_KEY);
}

function isStepFilled(step) {
  if (step === 1) {
    return !!(document.getElementById('brand').value.trim() && document.getElementById('mainProduct').value.trim());
  }
  if (step === 2) {
    var accounts = collectPlatformAccounts();
    return accounts.length > 0 && accounts.every(function(a) { return a.account_name; });
  }
  if (step === 3) {
    return !!(document.getElementById('gmv').value.toString().trim()) && shots.length > 0;
  }
  return false;
}

function desktopGoToStep(step) {
  if (step > 1 && !isStepFilled(step - 1)) return;
  var target = document.querySelector('.form-card[data-step="' + step + '"]');
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function updateDesktopNavUI() {
  var nav = document.getElementById('desktopStepNav');
  if (!nav) return;
  for (var s = 1; s <= TOTAL_STEPS; s++) {
    var item = nav.querySelector('[data-dsn-step="' + s + '"]');
    var filled = isStepFilled(s);
    item.classList.toggle('filled', filled);
    item.classList.toggle('disabled', s > 1 && !isStepFilled(s - 1));
  }
}

var PLATFORM_OPTIONS = ['抖音', '视频号', '快手'];

function addPlatformAccount(platform, accountName) {
  paSeq++;
  var id = 'pa_' + paSeq;
  var wrap = document.createElement('div');
  wrap.className = 'platform-account-card';
  wrap.id = id;
  var optionsHtml = PLATFORM_OPTIONS.map(function(p) {
    return '<option value="'+p+'"' + (p === platform ? ' selected' : '') + '>' + p + '</option>';
  }).join('');
  wrap.innerHTML =
    '<div class="pa-head"><span class="pa-index">平台账号</span><button type="button" class="pa-remove" onclick="removePlatformAccount(\''+id+'\')">删除</button></div>' +
    '<div class="form-group"><label class="form-label">平台 <span class="required">*</span></label>' +
    '<select class="form-select pa-platform">' + optionsHtml + '</select></div>' +
    '<div class="form-group" style="margin-bottom:0;"><label class="form-label">运营账号 <span class="required">*</span></label>' +
    '<input type="text" class="form-input pa-account" placeholder="请输入运营账号" value="'+(accountName?esc(accountName):'')+'"></div>';
  document.getElementById('platformAccountList').appendChild(wrap);
  updateRemoveButtons();
}

function removePlatformAccount(id) {
  var list = document.getElementById('platformAccountList');
  if (list.children.length <= 1) { showToast('至少保留1个平台账号', 'error'); return; }
  var el = document.getElementById(id);
  if (el) el.remove();
  updateRemoveButtons();
}

function updateRemoveButtons() {
  var list = document.getElementById('platformAccountList');
  var single = list.children.length <= 1;
  Array.prototype.forEach.call(list.querySelectorAll('.pa-remove'), function(btn) {
    btn.disabled = single;
  });
}

function handleShotSelect(files) {
  Array.prototype.forEach.call(files, function(f) {
    shots.push(f.name);
  });
  renderShots();
}
function removeShot(idx) {
  shots.splice(idx, 1);
  renderShots();
}
function renderShots() {
  var html = shots.map(function(name, idx) {
    return '<span class="shot-chip">' + esc(name) + '<span class="rm" onclick="removeShot('+idx+')">&times;</span></span>';
  }).join('');
  document.getElementById('shotList').innerHTML = html;
}

function init() {
  var apps = JSON.parse(localStorage.getItem('recruit_applications') || '[]');
  if (mode === 'edit' && editId > 0) {
    var rec = apps.find(function(a) { return a.id === editId; });
    if (rec) {
      if (rec.status !== '已驳回') {
        document.getElementById('pageTitle').textContent = '申请详情';
        document.getElementById('lockedBanner').style.display = 'block';
        document.getElementById('formActions').innerHTML = '<button type="button" class="btn" onclick="goBack()">返回</button>';
        setReadOnly(true);
      } else {
        document.getElementById('pageTitle').textContent = '修改重提';
      }
      document.getElementById('brand').value = rec.brand || '';
      document.getElementById('mainProduct').value = rec.main_product || '';
      document.getElementById('gmv').value = rec.gmv || '';
      shots = (rec.screenshots || []).slice();
      renderShots();
      (rec.platform_accounts || []).forEach(function(pa) {
        addPlatformAccount(pa.platform, pa.account_name);
      });
      if ((rec.platform_accounts || []).length === 0) addPlatformAccount();
      return;
    }
  }
  if (mode === 'add' && restoreDraft()) {
    showToast('已恢复上次填写的草稿', 'info');
  } else {
    addPlatformAccount();
  }
}

function setReadOnly(v) {
  document.querySelectorAll('#mainForm input, #mainForm select').forEach(function(el) { el.disabled = v; });
  document.querySelectorAll('.upload-zone, .add-platform-btn, .pa-remove').forEach(function(el) { el.style.pointerEvents = v ? 'none' : ''; el.style.opacity = v ? '.6' : ''; });
}

function collectPlatformAccounts() {
  var list = [];
  document.querySelectorAll('#platformAccountList .platform-account-card').forEach(function(card) {
    var platform = card.querySelector('.pa-platform').value;
    var account = card.querySelector('.pa-account').value.trim();
    list.push({ platform: platform, account_name: account, _el: card });
  });
  return list;
}

function clearErrors() {
  document.querySelectorAll('.form-group').forEach(function(g) { g.classList.remove('has-error'); });
  document.getElementById('shotError').style.display = 'none';
}

function validateStep(step) {
  var ok = true;
  if (step === 1) {
    var brand = document.getElementById('brand');
    var mainProduct = document.getElementById('mainProduct');
    if (!brand.value.trim()) { brand.closest('.form-group').classList.add('has-error'); ok = false; }
    if (!mainProduct.value.trim()) { mainProduct.closest('.form-group').classList.add('has-error'); ok = false; }
  } else if (step === 2) {
    var accounts = collectPlatformAccounts();
    var accountsValid = accounts.length > 0 && accounts.every(function(a) { return a.account_name; });
    if (!accountsValid) {
      accounts.forEach(function(a) { if (!a.account_name) a._el.style.borderColor = '#ef4444'; });
      ok = false;
      showToast('请完善全部平台账号的运营账号', 'error');
    }
  } else if (step === 3) {
    var gmv = document.getElementById('gmv');
    if (!gmv.value.toString().trim()) { gmv.closest('.form-group').classList.add('has-error'); ok = false; }
    if (shots.length === 0) {
      document.getElementById('shotError').style.display = 'block';
      ok = false;
    }
  }
  return ok;
}

function validate() {
  clearErrors();
  var s1 = validateStep(1);
  var s2 = validateStep(2);
  var s3 = validateStep(3);
  var ok = s1 && s2 && s3;
  if (!ok) showToast('请完善表单中的必填项', 'error');
  return ok;
}

function doSubmit() {
  if (!validate()) return;

  var apps = JSON.parse(localStorage.getItem('recruit_applications') || '[]');
  var accounts = collectPlatformAccounts().map(function(a) { return { platform: a.platform, account_name: a.account_name }; });
  var data = {
    phone: phone,
    brand: document.getElementById('brand').value.trim(),
    main_product: document.getElementById('mainProduct').value.trim(),
    platform_accounts: accounts,
    gmv: Number(document.getElementById('gmv').value),
    screenshots: shots.slice(),
    updated_at: now()
  };

  if (mode === 'edit' && editId > 0) {
    var idx = apps.findIndex(function(a) { return a.id === editId; });
    if (idx >= 0) {
      data.id = editId;
      data.status = '已提交';
      data.created_at = apps[idx].created_at;
      data.reject_logs = apps[idx].reject_logs || [];
      apps[idx] = data;
    }
  } else {
    data.id = apps.length > 0 ? Math.max.apply(null, apps.map(function(a) { return a.id; })) + 1 : 1;
    data.status = '已提交';
    data.created_at = now();
    data.reject_logs = [];
    apps.push(data);
  }

  localStorage.setItem('recruit_applications', JSON.stringify(apps));
  clearDraft();
  showToast('提交成功', 'success');
  setTimeout(function() { location.href = 'mine.html'; }, 400);
}

function esc(s) { if(!s) return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function now(){ return new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-'); }
function goBack(){ location.href = 'mine.html'; }

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}

init();
updateStepUI();
document.getElementById('mainForm').addEventListener('input', saveDraft);
document.getElementById('mainForm').addEventListener('change', saveDraft);
document.getElementById('mainForm').addEventListener('input', updateStepUI);
document.getElementById('mainForm').addEventListener('change', updateStepUI);
</script>
