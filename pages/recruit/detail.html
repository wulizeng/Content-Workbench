<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入驻意向审核 - 详情</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .modal-overlay {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,.45); z-index:9999;
      display:flex; align-items:center; justify-content:center;
      animation:modalFadeIn .25s ease;
    }
    @keyframes modalFadeIn { from{opacity:0} to{opacity:1} }
    .modal {
      background:#fff; border-radius:12px; width:480px; max-width:92vw;
      max-height:90vh; box-shadow:0 24px 60px rgba(0,0,0,.2);
      display:flex; flex-direction:column; animation:modalSlideIn .3s ease;
    }
    @keyframes modalSlideIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-head {
      display:flex; justify-content:space-between; align-items:center;
      padding:20px 24px 16px; border-bottom:1px solid #e4e9f1;
    }
    .modal-head h3 { margin:0; font-size:17px; font-weight:700; color:#0f172a; }
    .modal-close {
      width:28px; height:28px; border:none; background:transparent;
      border-radius:6px; cursor:pointer; display:grid; place-items:center;
      color:#647084; font-size:18px; transition:background .15s;
    }
    .modal-close:hover { background:#f0f2f5; }
    .modal-body { padding:20px 24px; overflow-y:auto; flex:1; min-height:0; }
    .modal-foot {
      display:flex; justify-content:flex-end; gap:10px;
      padding:16px 24px 20px; border-top:1px solid #e4e9f1;
    }
    .modal-foot .btn { min-width:80px; }

    .detail-card {
      background:#fff; border:1px solid var(--border); border-radius:12px;
      padding:24px; margin-bottom:16px;
    }
    .detail-card-title {
      font-size:15px; font-weight:700; color:var(--ink,#0f172a);
      margin:0 0 18px; padding-bottom:12px; border-bottom:1px solid var(--border-light);
    }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
    .detail-item .k { font-size:12px; color:var(--text-tertiary,#94a3b8); margin-bottom:4px; }
    .detail-item .v { font-size:14px; color:var(--text,#0f172a); font-weight:500; }
    .platform-account-row {
      display:flex; align-items:center; gap:10px; padding:10px 14px;
      background:#f8fafc; border-radius:8px; margin-bottom:8px; font-size:13px;
    }
    .platform-account-row .plat-tag {
      display:inline-flex; padding:2px 10px; border-radius:12px;
      background:var(--primary-light); color:var(--primary); font-size:12px; font-weight:600;
    }
    .shot-grid { display:flex; gap:10px; flex-wrap:wrap; }
    .shot-thumb {
      width:120px; height:90px; border-radius:8px; overflow:hidden;
      border:1px solid var(--border); cursor:pointer; background:#f1f5f9;
      display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:12px;
    }
    .shot-thumb img { width:100%; height:100%; object-fit:cover; }
    .reject-log-item {
      padding:12px 14px; background:#fef2f2; border-radius:8px; margin-bottom:8px;
    }
    .reject-log-item .reason { font-size:13px; color:#dc2626; font-weight:500; }
    .reject-log-item .meta { font-size:12px; color:var(--text-tertiary,#94a3b8); margin-top:4px; }
    .pp-section { margin-bottom:18px; }
    .pp-section:last-child { margin-bottom:0; }
    .pp-section-title { font-size:13px; font-weight:700; color:var(--ink,#0f172a); margin:0 0 10px; }
    .pp-empty { color:#94a3b8; font-size:13px; padding:12px 0; }
    .pp-cats { display:flex; gap:8px; margin-bottom:10px; }
    .team-plan-table { width:100%; border-collapse:collapse; font-size:13px; }
    .team-plan-table th, .team-plan-table td { padding:8px 10px; border:1px solid var(--border-light,#e2e8f0); text-align:center; }
    .team-plan-table th { color:var(--text-tertiary,#94a3b8); font-weight:600; font-size:12px; background:#f8fafc; }
    .team-plan-table tbody td:first-child { text-align:left; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; padding:16px 0; }
    .form-textarea {
      width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px;
      font:inherit; font-size:13px; outline:none; resize:vertical; line-height:1.6; box-sizing:border-box;
    }
    .form-textarea:focus { border-color:var(--primary); }
    @media (max-width: 640px) {
      .detail-card { padding: 16px; }
      .detail-grid { grid-template-columns: 1fr; gap: 12px; }
      .shot-thumb { width: calc(50% - 5px); height: 100px; }
      .modal { width: 92vw; }
      .form-actions { flex-direction: column; }
      .form-actions .btn { width: 100%; height: 48px; }
    }
  </style>
</head>
<body>
<div class="page-container">

  <!-- Toast 轻提示容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <script>
    if (window.parent) {
      window.parent.postMessage({type:'breadcrumb', text:'分销枢纽 <span>/</span> 入驻意向审核 <span>/</span> 详情'}, '*');
    }
  </script>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
    <button class="btn" onclick="goBack()" style="display:flex;align-items:center;gap:4px;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      返回
    </button>
    <div class="page-title" style="margin-bottom:0;">入驻意向审核详情</div>
  </div>

  <div class="detail-card">
    <h3 class="detail-card-title">申请人信息</h3>
    <div class="detail-grid">
      <div class="detail-item"><div class="k">姓名</div><div class="v" id="dName">-</div></div>
      <div class="detail-item"><div class="k">申请人手机号</div><div class="v" id="dPhone">-</div></div>
      <div class="detail-item"><div class="k">当前状态</div><div class="v" id="dStatus">-</div></div>
      <div class="detail-item"><div class="k">运营品牌</div><div class="v" id="dBrand">-</div></div>
      <div class="detail-item"><div class="k">主推产品</div><div class="v" id="dProduct">-</div></div>
      <div class="detail-item"><div class="k">提交时间</div><div class="v" id="dCreatedAt">-</div></div>
      <div class="detail-item"><div class="k">近3个月GMV</div><div class="v" id="dGmv">-</div></div>
    </div>
  </div>

  <div class="detail-card">
    <h3 class="detail-card-title">平台账号</h3>
    <div id="dPlatformAccounts"></div>
  </div>

  <div class="detail-card">
    <h3 class="detail-card-title">业绩证明截图</h3>
    <div class="shot-grid" id="dShots"></div>
  </div>

  <div class="detail-card" id="dRejectCard" style="display:none;">
    <h3 class="detail-card-title">驳回历史</h3>
    <div id="dRejectLogs"></div>
  </div>

  <div class="detail-card" id="dPlanCard" style="display:none;">
    <h3 class="detail-card-title">项目规划</h3>
    <div id="dPlanBody"></div>
  </div>

  <div class="detail-card" id="dPlanRejectCard" style="display:none;">
    <h3 class="detail-card-title">项目规划驳回历史</h3>
    <div id="dPlanRejectLogs"></div>
  </div>

  <div class="form-actions" id="dActions"></div>

</div>

<!-- 通过确认弹窗 -->
<div id="approveModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeApproveModal()">
  <div class="modal" style="width:420px;">
    <div class="modal-head">
      <h3 id="approveModalTitle">确认通过审核</h3>
      <button class="modal-close" onclick="closeApproveModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-secondary,#475569);line-height:1.7;" id="approveModalDesc">通过后该申请状态变为"已审核"（终态），操作不可撤销，确认要通过吗？</p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeApproveModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmApprove()">确认通过</button>
    </div>
  </div>
</div>

<!-- 驳回弹窗 -->
<div id="rejectModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeRejectModal()">
  <div class="modal" style="width:480px;">
    <div class="modal-head">
      <h3 id="rejectModalTitle">驳回申请</h3>
      <button class="modal-close" onclick="closeRejectModal()">&times;</button>
    </div>
    <div class="modal-body">
      <label style="font-size:13px;font-weight:600;color:var(--text-secondary,#475569);display:block;margin-bottom:8px;">驳回原因 <span style="color:#ef4444;">*</span></label>
      <textarea class="form-textarea" id="rejectReason" rows="4" placeholder="请填写驳回原因，将展示给达人"></textarea>
      <div id="rejectError" style="display:none;color:#dc2626;font-size:12px;margin-top:6px;">驳回原因为必填项</div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeRejectModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmReject()">确认驳回</button>
    </div>
  </div>
</div>

<script>
var mockData = JSON.parse(localStorage.getItem('recruit_applications') || 'null') || [];
var mockTalentNames = {
  '138****2231':'李潮', '159****8820':'王强', '186****0093':'陈静', '177****5567':'林晓鹿', '135****9911':'赵凯'
};
var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
function talentName(phone) {
  return (talents[phone] || {}).name || mockTalentNames[phone] || '-';
}

function g(name) { var r = location.search.match(new RegExp('[?&]'+name+'=([^&]*)')); return r ? decodeURIComponent(r[1]) : ''; }
var appId = parseInt(g('id')) || 0;
var currentRecord = null;

function init() {
  currentRecord = mockData.find(function(r) { return r.id === appId; });
  if (!currentRecord) { showToast('未找到该申请记录', 'error'); return; }
  document.getElementById('dName').textContent = talentName(currentRecord.phone);
  document.getElementById('dPhone').textContent = currentRecord.phone;
  document.getElementById('dStatus').innerHTML = st(currentRecord.status);
  document.getElementById('dBrand').textContent = currentRecord.brand || '-';
  document.getElementById('dProduct').textContent = currentRecord.main_product || '-';
  document.getElementById('dCreatedAt').textContent = currentRecord.created_at;
  document.getElementById('dGmv').textContent = '¥' + Number(currentRecord.gmv || 0).toLocaleString('zh-CN');

  var paHtml = '';
  (currentRecord.platform_accounts || []).forEach(function(a) {
    paHtml += '<div class="platform-account-row"><span class="plat-tag">' + esc(a.platform) + '</span><span>' + esc(a.account_name) + '</span></div>';
  });
  document.getElementById('dPlatformAccounts').innerHTML = paHtml || '<div style="color:#94a3b8;font-size:13px;">暂无平台账号</div>';

  var shots = currentRecord.screenshots || [];
  if (shots.length === 0) {
    document.getElementById('dShots').innerHTML = '<div class="shot-thumb">示例截图</div><div class="shot-thumb">示例截图</div>';
  } else {
    document.getElementById('dShots').innerHTML = shots.map(function(s) {
      var name = typeof s === 'string' ? s : s.name;
      var dataUrl = typeof s === 'string' ? '' : s.dataUrl;
      if (dataUrl) {
        return '<div class="shot-thumb" onclick="window.open(\'' + dataUrl + '\',\'_blank\')"><img src="' + dataUrl + '" alt="' + esc(name) + '"></div>';
      }
      return '<div class="shot-thumb">' + esc(name) + '</div>';
    }).join('');
  }

  var logs = currentRecord.reject_logs || [];
  if (logs.length > 0) {
    document.getElementById('dRejectCard').style.display = '';
    document.getElementById('dRejectLogs').innerHTML = logs.map(function(l) {
      return '<div class="reject-log-item"><div class="reason">' + esc(l.reason) + '</div><div class="meta">' + esc(l.operator) + ' &middot; ' + esc(l.time) + '</div></div>';
    }).join('');
  }

  renderPlanCard();
  renderActions();
}

var PLAN_VISIBLE_STATUSES = ['待提交项目规划', '规划审核中', '规划已驳回', '已通过'];

function renderPlanCard() {
  if (PLAN_VISIBLE_STATUSES.indexOf(currentRecord.status) === -1) return;
  document.getElementById('dPlanCard').style.display = '';
  var plan = currentRecord.project_plan;
  if (!plan) {
    document.getElementById('dPlanBody').innerHTML = '<div class="pp-empty">等待客户提交项目规划</div>';
    return;
  }
  var catsHtml = (plan.categories || []).map(function(c) { return '<span class="plat-tag">' + esc(c) + '</span>'; }).join(' ');
  var shotsHtml = function(shots) {
    if (!shots || shots.length === 0) return '<div class="pp-empty" style="padding:6px 0;">暂无截图</div>';
    return '<div class="shot-grid">' + shots.map(function(s) {
      var name = typeof s === 'string' ? s : s.name;
      var dataUrl = typeof s === 'string' ? '' : s.dataUrl;
      if (dataUrl) return '<div class="shot-thumb" onclick="window.open(\'' + dataUrl + '\',\'_blank\')"><img src="' + dataUrl + '" alt="' + esc(name) + '"></div>';
      return '<div class="shot-thumb">' + esc(name) + '</div>';
    }).join('') + '</div>';
  };
  var teamHtml = '<table class="team-plan-table"><thead><tr><th>岗位</th><th>人数</th><th>职责说明</th></tr></thead><tbody>' +
    (plan.team_plan || []).map(function(t) {
      return '<tr><td>' + esc(t.role) + '</td><td>' + esc(String(t.count)) + '</td><td>' + esc(t.duty) + '</td></tr>';
    }).join('') + '</tbody></table>';

  var html = '';
  html += '<div class="pp-section"><h4 class="pp-section-title">公司介绍</h4><div class="detail-item v">' + esc(plan.company_intro) + '</div></div>';
  html += '<div class="pp-section"><h4 class="pp-section-title">经营项目介绍</h4><div class="pp-cats">' + catsHtml + '</div>';
  if ((plan.categories || []).indexOf('母婴') > -1) {
    html += '<div class="detail-grid" style="margin-bottom:10px;"><div class="detail-item"><div class="k">母婴规模介绍</div><div class="v">' + esc(plan.maternity_scale) + '</div></div><div class="detail-item"><div class="k">母婴品牌介绍</div><div class="v">' + esc(plan.maternity_brands) + '</div></div></div>';
  }
  if ((plan.categories || []).indexOf('服饰') > -1) {
    html += '<div class="detail-grid"><div class="detail-item"><div class="k">服饰规模介绍</div><div class="v">' + esc(plan.apparel_scale) + '</div></div><div class="detail-item"><div class="k">服饰品牌介绍</div><div class="v">' + esc(plan.apparel_brands) + '</div></div></div>';
  }
  html += '</div>';
  html += '<div class="pp-section"><h4 class="pp-section-title">付费流量运营案例</h4><div class="detail-item v" style="margin-bottom:8px;">' + esc(plan.paid_traffic_case) + '</div>' + shotsHtml(plan.paid_traffic_shots) + '</div>';
  html += '<div class="pp-section"><h4 class="pp-section-title">内容打造案例</h4><div class="detail-item v" style="margin-bottom:8px;">' + esc(plan.content_case) + '</div>' + shotsHtml(plan.content_case_shots) + '</div>';
  html += '<div class="pp-section"><h4 class="pp-section-title">直播间人货场构建</h4><div class="detail-item v">' + esc(plan.people_goods_field) + '</div></div>';
  html += '<div class="pp-section"><h4 class="pp-section-title">短视频内容策略</h4><div class="detail-item v">' + esc(plan.short_video_strategy) + '</div></div>';
  html += '<div class="pp-section"><h4 class="pp-section-title">投放策略</h4><div class="detail-item v">' + esc(plan.ad_strategy) + '</div></div>';
  html += '<div class="pp-section"><h4 class="pp-section-title">团队配置规模</h4>' + teamHtml + '</div>';
  html += '<div class="pp-section"><h4 class="pp-section-title">场地投入计划</h4><div class="detail-item v">' + esc(plan.venue_plan) + '</div></div>';
  if (plan.gmv_target_monthly && plan.gmv_target_monthly.length === 12) {
    var gmvTotal = plan.gmv_target_monthly.reduce(function(sum, v) { return sum + Number(v || 0); }, 0);
    var gmvMonthHtml = plan.gmv_target_monthly.map(function(v, idx) {
      return '<td style="text-align:right;padding:8px 10px;">' + (Number(v) || 0).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + '</td>';
    }).join('');
    var gmvTableHtml = '<table class="team-plan-table"><thead><tr><th>1月</th><th>2月</th><th>3月</th><th>4月</th><th>5月</th><th>6月</th><th>7月</th><th>8月</th><th>9月</th><th>10月</th><th>11月</th><th>12月</th><th>合计</th></tr></thead>' +
      '<tbody><tr>' + gmvMonthHtml + '<td style="text-align:right;padding:8px 10px;background:#fffbeb;font-weight:600;color:var(--primary);">' + gmvTotal.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + '</td></tr></tbody></table>';
    html += '<div class="pp-section"><h4 class="pp-section-title">年度GMV业绩目标（万元）</h4>' + gmvTableHtml + '</div>';
  }
  document.getElementById('dPlanBody').innerHTML = html;

  var planLogs = currentRecord.plan_reject_logs || [];
  if (planLogs.length > 0) {
    document.getElementById('dPlanRejectCard').style.display = '';
    document.getElementById('dPlanRejectLogs').innerHTML = planLogs.map(function(l) {
      return '<div class="reject-log-item"><div class="reason">' + esc(l.reason) + '</div><div class="meta">' + esc(l.operator) + ' &middot; ' + esc(l.time) + '</div></div>';
    }).join('');
  }
}

function currentPhase() {
  if (currentRecord.status === '已提交' || currentRecord.status === '审核中') return 'intent';
  if (currentRecord.status === '规划审核中') return 'plan';
  return null;
}

function renderActions() {
  var actions = document.getElementById('dActions');
  if (currentPhase()) {
    actions.innerHTML = '<button class="btn btn-danger" onclick="openRejectModal()">驳回</button><button class="btn btn-primary" onclick="openApproveModal()">通过</button>';
  } else {
    actions.innerHTML = '';
  }
}

function openApproveModal() {
  var phase = currentPhase();
  if (phase === 'plan') {
    document.getElementById('approveModalTitle').textContent = '确认通过项目规划审核';
    document.getElementById('approveModalDesc').textContent = '通过后该申请状态变为"已通过"（终态），操作不可撤销，确认要通过吗？';
  } else {
    document.getElementById('approveModalTitle').textContent = '确认通过审核';
    document.getElementById('approveModalDesc').textContent = '通过后该申请状态变为"待提交项目规划"，客户需在线提交项目规划，确认要通过吗？';
  }
  document.getElementById('approveModal').style.display = 'flex';
}
function closeApproveModal() { document.getElementById('approveModal').style.display = 'none'; }
function confirmApprove() {
  var phase = currentPhase();
  currentRecord.status = phase === 'plan' ? '已通过' : '待提交项目规划';
  currentRecord.updated_at = now();
  persist();
  closeApproveModal();
  showToast('审核通过', 'success');
  init();
}

function openRejectModal() {
  var phase = currentPhase();
  document.getElementById('rejectModalTitle').textContent = phase === 'plan' ? '驳回项目规划' : '驳回申请';
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectError').style.display = 'none';
  document.getElementById('rejectModal').style.display = 'flex';
}
function closeRejectModal() { document.getElementById('rejectModal').style.display = 'none'; }
function confirmReject() {
  var reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { document.getElementById('rejectError').style.display = 'block'; return; }
  var phase = currentPhase();
  currentRecord.updated_at = now();
  if (phase === 'plan') {
    currentRecord.status = '规划已驳回';
    currentRecord.plan_reject_logs = currentRecord.plan_reject_logs || [];
    currentRecord.plan_reject_logs.push({ reason: reason, time: now(), operator: 'BD-当前用户' });
  } else {
    currentRecord.status = '已驳回';
    currentRecord.reject_logs = currentRecord.reject_logs || [];
    currentRecord.reject_logs.push({ reason: reason, time: now(), operator: 'BD-当前用户' });
  }
  persist();
  closeRejectModal();
  showToast('已驳回', 'success');
  init();
}

function persist() {
  var idx = mockData.findIndex(function(r) { return r.id === currentRecord.id; });
  if (idx >= 0) mockData[idx] = currentRecord;
  localStorage.setItem('recruit_applications', JSON.stringify(mockData));
}

function st(s) {
  var m = {
    '已提交':'submitted', '审核中':'reviewing', '已驳回':'rejected',
    '待提交项目规划':'initial', '规划审核中':'reviewing', '规划已驳回':'rejected', '已通过':'approved'
  };
  return '<span class="status-tag '+(m[s]||'')+'">'+s+'</span>';
}
function esc(s) { if(!s) return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function now(){ return new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-'); }
function goBack(){ location.href='list.html'; }

// Toast 轻提示
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}

init();
</script>
<!-- 设备效果预览切换器：电脑 / 手机 -->
<script>
(function() {
  if (self !== top) return;
  function inject(doc) {
    if (!doc || !doc.body) return;
    var bar = doc.createElement('div');
    bar.id = 'deviceSwitcher';
    bar.innerHTML = '<button type="button" id="dsBtnPc" class="ds-active">💻 电脑</button><button type="button" id="dsBtnPhone">📱 手机预览</button>';
    doc.body.appendChild(bar);
    var st = doc.createElement('style');
    st.textContent = '#deviceSwitcher{position:fixed;top:16px;right:16px;z-index:99999;display:flex;gap:2px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:4px;box-shadow:0 6px 20px rgba(15,23,42,.18)}' +
      '#deviceSwitcher button{border:none;background:transparent;padding:7px 14px;border-radius:18px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;line-height:1.4;font-family:inherit}' +
      '#deviceSwitcher button.ds-active{background:#5b6cf5;color:#fff}';
    doc.body.appendChild(st);
    var btnPc = doc.getElementById('dsBtnPc');
    var btnPhone = doc.getElementById('dsBtnPhone');
    function enterPhone() {
      if (doc.getElementById('devicePhone')) return;
      var wrap = doc.createElement('div');
      wrap.id = 'devicePhone';
      wrap.innerHTML = '<div class="dp-frame"><div class="dp-notch"></div><iframe id="dpFrame" title="手机效果预览"></iframe></div>' +
        '<div class="dp-hint">📱 手机效果预览（390px 视口）· 预览内操作同样生效 · 点右上角「电脑」返回</div>';
      var st2 = doc.createElement('style');
      st2.id = 'dpStyle';
      st2.textContent = 'html.dp-phone,html.dp-phone body{height:100%;margin:0}' +
        'html.dp-phone body{background:#0f172a !important;display:flex !important;align-items:center;justify-content:center !important;overflow:hidden !important}' +
        'html.dp-phone > body > *:not(#devicePhone):not(#deviceSwitcher){display:none !important}' +
        '#devicePhone{display:flex;flex-direction:column;align-items:center;gap:14px}' +
        '#devicePhone .dp-frame{width:390px;height:min(800px,88vh);background:#fff;border:10px solid #1e293b;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;position:relative}' +
        '#devicePhone .dp-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:24px;background:#1e293b;border-radius:0 0 16px 16px;z-index:3}' +
        '#devicePhone #dpFrame{width:100%;height:100%;border:none;display:block;background:#fff}' +
        '#devicePhone .dp-hint{color:#94a3b8;font-size:12px;text-align:center}';
      doc.body.appendChild(st2);
      doc.body.appendChild(wrap);
      doc.documentElement.classList.add('dp-phone');
      doc.getElementById('dpFrame').src = location.href;
      btnPc.classList.remove('ds-active');
      btnPhone.classList.add('ds-active');
    }
    function exitPhone() {
      var w = doc.getElementById('devicePhone');
      if (w) w.parentNode.removeChild(w);
      var s = doc.getElementById('dpStyle');
      if (s) s.parentNode.removeChild(s);
      doc.documentElement.classList.remove('dp-phone');
      btnPc.classList.add('ds-active');
      btnPhone.classList.remove('ds-active');
    }
    btnPhone.addEventListener('click', enterPhone);
    btnPc.addEventListener('click', exitPhone);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { inject(document); });
  } else {
    inject(document);
  }
})();
</script>
</body>
</html>
