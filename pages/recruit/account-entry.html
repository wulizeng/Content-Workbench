<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号信息录入 - 列表</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/domains/recruit.css">
  <style>
    /* 主表字段较多：单元格统一不换行，横向滚动查看 */
    #dataTable th, #dataTable td { white-space: nowrap; }
    /* 操作列固定在右侧 */
    #dataTable thead th:last-child,
    #dataTable td.col-actions { position: sticky; right: 0; z-index: 2; }
    #dataTable td.col-actions {
      background: #fff;
      box-shadow: inset 1px 0 0 var(--border-light);
    }
    #dataTable tbody tr:hover td.col-actions { background: var(--primary-50); }
    /* 移动端（<1024px）：卡片流替代宽表格 */
    .card-list { display: none; }
    @media (max-width: 1023px) {
      .table-area .table-scroll, .table-area .pagination { display: none; }
      .card-list { display: block; }
      .ae-card {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 12px;
      }
      .ae-card-head {
        display: flex; justify-content: space-between; align-items: center;
        gap: 10px; margin-bottom: 10px;
      }
      .ae-card-head .name { font-size: 15px; font-weight: 700; color: var(--text); }
      .ae-card-body { font-size: 13px; color: var(--text-secondary); line-height: 1.9; }
      .ae-card-foot {
        display: flex; justify-content: flex-end;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light);
      }
    }
  </style>
</head>
<body>
<div class="page-container">

  <!-- Toast 轻提示容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/onboarding-store.js"></script>
  <script>
    // 权限检查
    if (!Auth.requireAuth()) {
      // 已在 requireAuth 中跳转到登录页
    }

    var currentUser = Auth.getCurrentUser();
    var Store = OnboardingStore;

    if (window.parent) {
      window.parent.postMessage({type:'breadcrumb', text:'分销枢纽 <span>/</span> 客户视角 <span>/</span> 账号信息录入'}, '*');
    }
  </script>
  <script src="../../js/shared/escape-html.js"></script>
  <script src="../../js/shared/storage.js"></script>
  <script src="../../js/shared/toast.js"></script>

  <div class="page-title" style="display:flex;align-items:center;gap:12px;">
    <span>账号信息录入列表</span>
    <a class="btn btn-primary" style="margin-left:auto;padding:6px 16px;font-size:13px;" href="account-entry-edit.html?mode=add">新增</a>
  </div>

  <div class="search-area">
    <div class="search-row">
      <div class="search-item">
        <label>账号昵称：</label>
        <input type="text" id="sNickname" placeholder="请输入账号昵称">
      </div>
      <div class="search-item">
        <label>账号UID：</label>
        <input type="text" id="sUid" placeholder="请输入账号UID">
      </div>
      <div class="search-item">
        <label>入驻模式：</label>
        <select id="sMode">
          <option value="">全部</option>
        </select>
      </div>
      <div class="search-item">
        <label>主销品牌：</label>
        <select id="sBrand">
          <option value="">全部</option>
        </select>
      </div>
      <div class="search-item">
        <label>合作码：</label>
        <input type="text" id="sCooperationCode" placeholder="请输入合作码">
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>
    <div class="search-active-tags" id="searchTags" style="display:none;"></div>
  </div>

  <div class="card-list" id="cardList"></div>

  <div class="table-area">
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead>
          <tr>
            <th>序号</th>
            <th>入驻模式</th>
            <th>账号昵称</th>
            <th>账号UID</th>
            <th>合作码</th>
            <th>账号所属平台</th>
            <th>账号运营模式</th>
            <th>主销品牌</th>
            <th>账号定位</th>
            <th>账号负责人</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info">共 <strong id="totalCount">0</strong> 条</span>
      <span class="page-btn disabled">&laquo;</span>
      <span class="page-btn active">1</span>
      <span class="page-btn">&raquo;</span>
    </div>
  </div>

</div>

<script>
var STORAGE_KEY = 'recruit_account_entries';
var SEARCH_IDS = ['sNickname', 'sUid', 'sMode', 'sBrand', 'sCooperationCode'];

var mockData = AppStorage.load(STORAGE_KEY, []);

// 入驻模式、主销品牌下拉选项统一取自业务字典
function initSelectOptions() {
  var modeSel = document.getElementById('sMode');
  Store.MODES.forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m.value;
    opt.textContent = m.label;
    modeSel.appendChild(opt);
  });
  var brandSel = document.getElementById('sBrand');
  Store.ACCOUNT_BRANDS.forEach(function(b) {
    var opt = document.createElement('option');
    opt.value = b;
    opt.textContent = b;
    brandSel.appendChild(opt);
  });
}

function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="12" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">暂无符合条件的账号信息</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      html += '<tr>';
      html += '<td>' + (index + 1) + '</td>';
      html += '<td>' + (row.mode ? '<span class="type-tag">' + esc(row.mode) + '</span>' : '') + '</td>';
      html += '<td>' + esc(row.nickname) + '</td>';
      html += '<td>' + esc(row.uid) + '</td>';
      html += '<td>' + esc(row.cooperation_code) + '</td>';
      html += '<td>' + esc(row.platform) + '</td>';
      html += '<td>' + esc(row.operation_mode) + '</td>';
      html += '<td>' + esc(row.brand) + '</td>';
      html += '<td>' + esc(row.positioning) + '</td>';
      html += '<td>' + esc(row.owner) + '</td>';
      html += '<td>' + esc(row.created_at) + '</td>';
      html += '<td class="col-actions">';
      html += '<a class="link-action link-action-icon" title="编辑" href="account-entry-edit.html?mode=edit&id=' + row.id + '"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>编辑</a>';
      html += '<a class="link-action link-action-icon" title="查看详情" href="account-entry-detail.html?id=' + row.id + '" style="margin-left:8px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>查看</a>';
      html += '</td></tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
}

function renderCards(data) {
  var list = document.getElementById('cardList');
  var html = '';
  if (data.length === 0) {
    html = '<div class="ae-card"><div class="ae-card-body">暂无符合条件的账号信息</div></div>';
  } else {
    data.forEach(function(row) {
      html += '<div class="ae-card">';
      html += '<div class="ae-card-head"><span class="name">' + esc(row.nickname) + '</span>' +
        (row.mode ? '<span class="type-tag">' + esc(row.mode) + '</span>' : '') + '</div>';
      html += '<div class="ae-card-body">';
      html += '<div>账号UID：' + esc(row.uid) + '</div>';
      // KOC 类展示合作码，其余模式展示平台与运营模式
      if (Store.accountEntryKindOfMode(row.mode) === 'koc') {
        html += '<div>合作码：' + esc(row.cooperation_code) + ' | 对接商务：' + esc(row.bd_contact) + '</div>';
      } else {
        html += '<div>平台：' + esc(row.platform) + ' | 运营模式：' + esc(row.operation_mode) + '</div>';
        html += '<div>主销品牌：' + esc(row.brand) + ' | 账号定位：' + esc(row.positioning) + '</div>';
        html += '<div>账号负责人：' + esc(row.owner) + '</div>';
      }
      html += '</div>';
      html += '<div class="ae-card-foot">' +
        '<a class="btn" style="height:48px;line-height:48px;padding:0 16px;margin-right:8px;" href="account-entry-edit.html?mode=edit&id=' + row.id + '">编辑</a>' +
        '<a class="btn btn-primary" style="height:48px;line-height:48px;padding:0 16px;" href="account-entry-detail.html?id=' + row.id + '">查看详情</a>' +
        '</div>';
      html += '</div>';
    });
  }
  list.innerHTML = html;
}

var currentFiltered = mockData.slice();

function isMobileView() {
  return window.matchMedia('(max-width: 1023px)').matches;
}

function renderView(data) {
  currentFiltered = data;
  if (isMobileView()) renderCards(data);
  else renderTable(data);
}

function filterData() {
  var nick = document.getElementById('sNickname').value.trim();
  var uid = document.getElementById('sUid').value.trim();
  var mode = document.getElementById('sMode').value;
  var brand = document.getElementById('sBrand').value;
  var code = document.getElementById('sCooperationCode').value.trim();
  return mockData.filter(function(x) {
    if (nick && (x.nickname || '').indexOf(nick) < 0) return false;
    if (uid && (x.uid || '').indexOf(uid) < 0) return false;
    if (mode && x.mode !== mode) return false;
    if (brand && x.brand !== brand) return false;
    if (code && (x.cooperation_code || '').indexOf(code) < 0) return false;
    return true;
  });
}

function doSearch() {
  renderView(filterData());
  showSearchTags();
}

function resetSearch() {
  SEARCH_IDS.forEach(function(id) {
    document.getElementById(id).value = '';
  });
  renderView(mockData);
  showSearchTags();
}

function showSearchTags() {
  var map = {
    sNickname: '账号昵称', sUid: '账号UID', sMode: '入驻模式',
    sBrand: '主销品牌', sCooperationCode: '合作码'
  };
  var tags = [];
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (el && el.value) tags.push({ name: map[id], value: el.value, id: id });
  });
  var container = document.getElementById('searchTags');
  if (!container) return;
  if (tags.length === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }
  var html = '';
  tags.forEach(function(t) {
    html += '<span class="search-active-tag">' + t.name + '：' + esc(t.value) + '<span class="tag-remove" onclick="clearSearchTag(\'' + t.id + '\')">&times;</span></span>';
  });
  container.style.display = '';
  container.innerHTML = html;
}

function clearSearchTag(id) {
  document.getElementById(id).value = '';
  doSearch();
}

window.addEventListener('resize', function() { renderView(currentFiltered); });

// 从新增/编辑页返回时自动刷新数据
window.addEventListener('pageshow', function() {
  mockData = AppStorage.load(STORAGE_KEY, []);
  renderView(filterData());
});

initSelectOptions();
renderView(mockData);
</script>
</body>
</html>
