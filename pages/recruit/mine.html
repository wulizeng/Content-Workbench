<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>达人工作台 - 客户入驻申请</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fb; }

    /* 页面容器：宽度自适应屏幕 */
    .page-wrap { width: 100%; margin: 0 auto; padding: 24px 28px 48px; box-sizing: border-box; }

    /* 页头：标题 + 副标题左侧，主操作右侧 */
    .page-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 20px;
    }
    .page-head h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; color: var(--text); }
    .ph-sub { font-size: 12.5px; color: var(--text-tertiary); }
    .ph-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .ph-new-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
      border: none; border-radius: 10px; background: var(--primary); color: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .18s;
      box-shadow: 0 2px 8px rgba(91,108,245,.25);
    }
    .ph-new-btn:hover { background: #4a5ae4; box-shadow: 0 4px 12px rgba(91,108,245,.35); }
    .user-chip {
      display: none; align-items: center; gap: 8px; padding: 5px 10px 5px 5px;
      border: 1px solid var(--border); border-radius: 20px; background: #fff;
      cursor: pointer; transition: all .15s;
    }
    .user-chip:hover { border-color: #fca5a5; background: #fef2f2; }
    .user-chip .logout-txt { font-size: 12px; color: var(--text-secondary); }
    .user-chip:hover .logout-txt { color: #dc2626; }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 50%; background: var(--primary);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
    }

    /* 申请卡片列表 */
    .app-card {
      background: #fff; border-radius: 14px; border: 1px solid var(--border);
      padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
      transition: box-shadow .18s, transform .18s;
    }
    .app-card:hover { box-shadow: 0 6px 18px rgba(15,23,42,.08); transform: translateY(-1px); }
    .app-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .app-card-time { font-size: 12px; color: var(--text-tertiary); }
    .app-card-template { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .app-card-template .meta-chip { padding: 3px 9px; border-radius: 999px; background: var(--primary-50); color: var(--primary); font-size: 12px; font-weight: 600; }
    .app-card-accounts { font-size: 13px; color: var(--text); line-height: 1.8; margin-bottom: 10px; }
    .app-card-accounts .plat-chip {
      display: inline-flex; padding: 2px 9px; border-radius: 10px; background: #f1f5f9;
      color: var(--text-secondary); font-size: 12px; margin-right: 6px; margin-bottom: 4px;
    }
    .app-card-reject {
      background: #fef2f2; border-radius: 8px; padding: 10px 12px; font-size: 12px;
      color: #dc2626; margin-bottom: 10px; line-height: 1.6;
    }
    .app-card-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .empty-wrap {
      text-align: center; padding: 70px 0; color: var(--text-tertiary);
      background: #fff; border: 1px dashed var(--border); border-radius: 14px;
    }
    .empty-wrap svg { color: #cbd5e1; margin-bottom: 12px; }
    .empty-wrap .t { font-size: 14px; margin-bottom: 18px; }

    /* 移动端适配 */
    @media (max-width: 640px) {
      .page-wrap { padding: 16px 14px 40px; }
      .page-head { flex-direction: column; align-items: stretch; }
      .ph-right { justify-content: space-between; }
      .ph-new-btn { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <div class="page-head">
    <div class="ph-left">
      <h1 id="mineTitle">客户入驻申请</h1>
      <div class="ph-sub"><span id="phoneTag">-</span><span id="appCount"></span></div>
    </div>
    <div class="ph-right">
      <button class="ph-new-btn" onclick="goApply('add')">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建申请
      </button>
      <div class="user-chip" id="logoutChip" onclick="doLogout()" title="点击退出登录">
        <div class="user-avatar" id="userAvatar">-</div>
        <span class="logout-txt">退出</span>
      </div>
    </div>
  </div>

  <div id="appList"></div>

</div>

<div id="toastContainer" class="toast-container"></div>

<script src="../../js/auth.js"></script>
<script>
// 权限检查
if (!Auth.requireAuth()) {
  // 已在 requireAuth 中跳转到登录页
}

var currentUser = Auth.getCurrentUser();

// 兼容旧登录态
var phone = localStorage.getItem('recruit_current_phone') || currentUser.phone;

document.getElementById('phoneTag').textContent = phone || '';

// 独立打开（非工作台 iframe）时才显示退出入口
if (self === top) {
  document.getElementById('logoutChip').style.display = 'flex';
}

var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
var talentName = (talents[phone] || {}).name;
if (talentName) {
  document.getElementById('mineTitle').textContent = talentName + ' 的申请';
  document.getElementById('userAvatar').textContent = talentName.charAt(0);
}

function loadApps() {
  var all = JSON.parse(localStorage.getItem('recruit_applications') || '[]');
  // 管理员可见全部申请
  if (currentUser && currentUser.role === 'admin') return all;
  return all.filter(function(a) { return a.phone === phone || a.talentPhone === phone; });
}

function render() {
  var apps = loadApps();
  var container = document.getElementById('appList');
  document.getElementById('appCount').textContent = apps.length > 0 ? ((phone ? ' · ' : '') + '共 ' + apps.length + ' 条申请') : '';
  if (apps.length === 0) {
    container.innerHTML = '<div class="empty-wrap">' +
      '<svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
      '<div class="t">还没有提交过入驻申请</div>' +
      '<button class="ph-new-btn" onclick="goApply(\'add\')">' +
      '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
      '新建申请</button>' +
      '</div>';
    return;
  }
  var html = '';
  apps.forEach(function(a) {
    var accountsHtml = (a.platform_accounts || []).map(function(p) {
      return '<span class="plat-chip">' + esc(p.platform) + ' ' + esc(p.account_name) + '</span>';
    }).join('');
    var rejectHtml = '';
    if (a.status === '已驳回' && a.reject_logs && a.reject_logs.length > 0) {
      var lastReason = a.reject_logs[a.reject_logs.length - 1].reason;
      rejectHtml = '<div class="app-card-reject">驳回原因：' + esc(lastReason) + '</div>';
    } else if (a.status === '规划已驳回' && a.plan_reject_logs && a.plan_reject_logs.length > 0) {
      var lastPlanReason = a.plan_reject_logs[a.plan_reject_logs.length - 1].reason;
      rejectHtml = '<div class="app-card-reject">项目规划驳回原因：' + esc(lastPlanReason) + '</div>';
    }
    var actionsHtml = '';
    if (a.status === '已驳回') {
      actionsHtml = '<button class="btn btn-primary" style="padding:6px 16px;font-size:12px;" onclick="goApply(\'edit\',' + a.id + ')">修改重提</button>';
    } else if (a.status === '待提交项目规划') {
      actionsHtml = '<button class="btn btn-primary" style="padding:6px 16px;font-size:12px;" onclick="goPlan(' + a.id + ')">填写项目规划</button>';
    } else if (a.status === '规划已驳回') {
      actionsHtml = '<button class="btn btn-primary" style="padding:6px 16px;font-size:12px;" onclick="goPlan(' + a.id + ')">修改重提</button>';
    } else if (a.status === '规划审核中') {
      actionsHtml = '<button class="btn" style="padding:6px 16px;font-size:12px;" onclick="viewDetail(' + a.id + ')">查看详情</button>';
    } else if (a.status === '已通过') {
      actionsHtml = '<button class="btn btn-primary" style="padding:6px 16px;font-size:12px;" onclick="viewDetail(' + a.id + ')">查看详情</button>';
    } else {
      actionsHtml = '<button class="btn" style="padding:6px 16px;font-size:12px;" disabled>审核中，请联系BD处理</button>';
    }
    html += '<div class="app-card">' +
      '<div class="app-card-top"><span class="app-card-time">提交于 ' + esc(a.created_at) + '</span>' + st(a.status) + '</div>' +
      '<div class="app-card-template"><span class="meta-chip">' + esc(a.business_type || '历史申请') + '</span><span class="meta-chip">' + esc(a.brand || '未设置品牌') + '</span></div>' +
      '<div class="app-card-accounts">' + (accountsHtml || '暂无平台账号') + '</div>' +
      rejectHtml +
      '<div class="app-card-actions">' + actionsHtml + '</div>' +
      '</div>';
  });
  container.innerHTML = html;
}

function goApply(mode, id) {
  if (mode === 'edit') { location.href = 'apply.html?mode=edit&id=' + id; }
  else { location.href = 'apply.html?mode=add'; }
}

function goPlan(id) {
  location.href = 'project-plan.html?id=' + id;
}

function viewDetail(id) {
  var apps = loadApps();
  var app = apps.find(function(a) { return a.id === id; });
  // 已进入项目规划阶段（已提交规划/规划审核中/规划已驳回/已通过且已有项目规划）→ 跳转详情页
  var planStatuses = ['规划审核中', '规划已驳回'];
  if (app && (planStatuses.indexOf(app.status) > -1 || (app.status === '已通过' && app.project_plan))) {
    location.href = 'detail.html?id=' + id + '&mode=view';
  } else {
    location.href = 'apply.html?mode=edit&id=' + id;
  }
}

function doLogout() {
  if (confirm('确定要退出登录吗？')) {
    Auth.logout();
  }
}

function st(s) {
  var m = {
    '已提交':'submitted', '审核中':'reviewing', '已驳回':'rejected',
    '待提交项目规划':'initial', '规划审核中':'reviewing', '规划已驳回':'rejected', '已通过':'approved'
  };
  return '<span class="status-tag '+(m[s]||'')+'">'+s+'</span>';
}
function esc(s) { if(!s) return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}

render();
</script>
<!-- 设备效果预览切换器：电脑 / 手机 -->
<script>
(function() {
  if (self !== top) return;
  function inject(doc) {
    if (!doc || !doc.body) return;
    var bar = doc.createElement('div');
    bar.id = 'deviceSwitcher';
    bar.innerHTML = '<button type="button" id="dsBtnPc" class="ds-active">💻 电脑</button><button type="button" id="dsBtnPhone">📱 手机预览</button>';
    doc.body.appendChild(bar);
    var st = doc.createElement('style');
    st.textContent = '#deviceSwitcher{position:fixed;top:16px;right:16px;z-index:99999;display:flex;gap:2px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:4px;box-shadow:0 6px 20px rgba(15,23,42,.18)}' +
      '#deviceSwitcher button{border:none;background:transparent;padding:7px 14px;border-radius:18px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;line-height:1.4;font-family:inherit}' +
      '#deviceSwitcher button.ds-active{background:#5b6cf5;color:#fff}';
    doc.body.appendChild(st);
    var btnPc = doc.getElementById('dsBtnPc');
    var btnPhone = doc.getElementById('dsBtnPhone');
    function enterPhone() {
      if (doc.getElementById('devicePhone')) return;
      var wrap = doc.createElement('div');
      wrap.id = 'devicePhone';
      wrap.innerHTML = '<div class="dp-frame"><div class="dp-notch"></div><iframe id="dpFrame" title="手机效果预览"></iframe></div>' +
        '<div class="dp-hint">📱 手机效果预览（390px 视口）· 预览内操作同样生效 · 点右上角「电脑」返回</div>';
      var st2 = doc.createElement('style');
      st2.id = 'dpStyle';
      st2.textContent = 'html.dp-phone,html.dp-phone body{height:100%;margin:0}' +
        'html.dp-phone body{background:#0f172a !important;display:flex !important;align-items:center;justify-content:center !important;overflow:hidden !important}' +
        'html.dp-phone > body > *:not(#devicePhone):not(#deviceSwitcher){display:none !important}' +
        '#devicePhone{display:flex;flex-direction:column;align-items:center;gap:14px}' +
        '#devicePhone .dp-frame{width:390px;height:min(800px,88vh);background:#fff;border:10px solid #1e293b;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;position:relative}' +
        '#devicePhone .dp-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:24px;background:#1e293b;border-radius:0 0 16px 16px;z-index:3}' +
        '#devicePhone #dpFrame{width:100%;height:100%;border:none;display:block;background:#fff}' +
        '#devicePhone .dp-hint{color:#94a3b8;font-size:12px;text-align:center}';
      doc.body.appendChild(st2);
      doc.body.appendChild(wrap);
      doc.documentElement.classList.add('dp-phone');
      doc.getElementById('dpFrame').src = location.href;
      btnPc.classList.remove('ds-active');
      btnPhone.classList.add('ds-active');
    }
    function exitPhone() {
      var w = doc.getElementById('devicePhone');
      if (w) w.parentNode.removeChild(w);
      var s = doc.getElementById('dpStyle');
      if (s) s.parentNode.removeChild(s);
      doc.documentElement.classList.remove('dp-phone');
      btnPc.classList.add('ds-active');
      btnPhone.classList.remove('ds-active');
    }
    btnPhone.addEventListener('click', enterPhone);
    btnPc.addEventListener('click', exitPhone);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { inject(document); });
  } else {
    inject(document);
  }
})();
</script>
</body>
</html>
