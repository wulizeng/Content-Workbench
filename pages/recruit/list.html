<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招商入驻审核 - 列表</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* 桌面端：操作列图标+文字链接 */
    .link-action-icon {
      display: inline-flex; align-items: center; gap: 4px;
    }
    .link-action-icon svg { flex-shrink: 0; }
    /* 窄桌面（1024~1279px）：平台账号摘要允许换行，不单独隐藏 */
    @media (min-width: 1024px) and (max-width: 1279px) {
      #dataTable td.col-platform { white-space: normal; word-break: break-all; }
    }
    /* 基础规则：折叠按钮默认隐藏（必须写在平板媒体查询之前，平板区间内靠后出现的 display:block 才能覆盖它） */
    .search-fold-bar { display: none; }
    /* 平板（641~1023px）：隐藏次要列、压缩平台摘要、筛选区可折叠 */
    @media (min-width: 641px) and (max-width: 1023px) {
      /* 隐藏"提交时间"独立列（收进状态列下方小字展示） */
      #dataTable thead th:nth-child(7),
      #dataTable tbody td:nth-child(7) { display: none; }
      /* 状态列下方叠加的创建时间小字：平板显示、桌面隐藏 */
      #dataTable .td-sub-time { display: block; margin-top: 4px; font-size: 11px; color: #94a3b8; }
      /* 平台账号摘要列：压缩宽度 + 省略号 + hover 提示（title 已由 renderTable 提供） */
      /* auto 表格布局下 td 会被 nowrap 内容撑开，截断规则改挂内层块元素才能生效 */
      #dataTable td.col-platform { max-width: 140px; }
      #dataTable td.col-platform .cell-ellipsis {
        display: block; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      /* 筛选区折叠：折叠按钮仅在平板区间显示；带 folded 类时隐藏筛选项与按钮 */
      .search-fold-bar { display: block; margin-bottom: 8px; }
      .search-area.folded .search-row,
      .search-area.folded .search-actions { display: none; }
    }
    /* 桌面端：状态列下方叠加时间小字隐藏（独立"提交时间"列恢复显示由浏览器默认表格布局提供） */
    @media (min-width: 1024px) {
      #dataTable .td-sub-time { display: none; }
    }
    /* 移动端（≤640px）：卡片流 + 底部抽屉筛选 + 加载更多 */
    .card-list, .load-more-bar, .filter-fab, .filter-sheet-overlay { display: none; }
    @media (max-width: 640px) {
      .search-area { display: none; }
      .table-area .table-scroll, .table-area .pagination { display: none; }
      .card-list { display: block; }
      .recruit-card {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 12px;
      }
      .recruit-card-head {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
      }
      .recruit-card-head .name { font-size: 15px; font-weight: 700; color: var(--text); }
      .recruit-card-body { font-size: 13px; color: var(--text-secondary); line-height: 1.9; }
      .recruit-card-body .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .chip {
        display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 12px;
        background: var(--primary-light); color: var(--primary); font-size: 12px; font-weight: 600;
      }
      .recruit-card-foot {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light);
      }
      .recruit-card-foot .time { font-size: 12px; color: #94a3b8; }
      .load-more-bar { display: block; text-align: center; margin: 8px 0 16px; }
      .load-more-bar .btn { width: 100%; height: 48px; }
      .filter-fab {
        display: inline-flex; align-items: center; gap: 6px;
        position: fixed; right: 16px; bottom: 24px; z-index: 50;
        height: 48px; padding: 0 18px; border: none; border-radius: 24px;
        background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
        box-shadow: 0 6px 18px rgba(91,108,245,.35); cursor: pointer;
      }
      .filter-sheet-overlay {
        display: flex; position: fixed; inset: 0; z-index: 100;
        background: rgba(0,0,0,.45); align-items: flex-end;
      }
      .filter-sheet {
        width: 100%; background: #fff; border-radius: 16px 16px 0 0;
        padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
        animation: sheetUp .25s ease;
      }
      @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .filter-sheet-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 0; font-size: 15px; font-weight: 700; color: var(--text);
      }
      .filter-sheet-close { border: none; background: transparent; font-size: 22px; color: #94a3b8; cursor: pointer; }
      .filter-sheet-body .search-item { display: block; margin-bottom: 14px; }
      .filter-sheet-body .search-item label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary); }
      .filter-sheet-body .search-item input,
      .filter-sheet-body .search-item select { width: 100%; height: 48px; box-sizing: border-box; }
      .filter-sheet-foot { display: flex; gap: 10px; }
      .filter-sheet-foot .btn { flex: 1; height: 48px; }
    }
  </style>
</head>
<body>
<div class="page-container">

  <!-- Toast 轻提示容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <script>
    if (window.parent) {
      window.parent.postMessage({type:'breadcrumb', text:'分销枢纽 <span>/</span> 招商入驻审核'}, '*');
    }
  </script>

  <div class="page-title">招商入驻审核（公共池）</div>

  <div class="search-area folded">
    <div class="search-fold-bar">
      <button type="button" class="btn" id="searchFoldBtn" onclick="toggleSearchFold()">筛选 &#9662;</button>
    </div>
    <div class="search-row">
      <div class="search-item">
        <label>申请人手机号：</label>
        <input type="text" id="sPhone" placeholder="请输入手机号">
      </div>
      <div class="search-item">
        <label>平台：</label>
        <select id="sPlatform">
          <option value="">全部</option>
          <option value="抖音">抖音</option>
          <option value="视频号">视频号</option>
          <option value="快手">快手</option>
        </select>
      </div>
      <div class="search-item">
        <label>状态：</label>
        <select id="sStatus">
          <option value="">全部</option>
          <option value="已提交">已提交</option>
          <option value="审核中">审核中</option>
          <option value="已审核">已审核</option>
          <option value="已驳回">已驳回</option>
        </select>
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>
    <div class="search-active-tags" id="searchTags" style="display:none;"></div>
  </div>

  <div class="card-list" id="cardList"></div>
  <div class="load-more-bar" id="loadMoreBar" style="display:none;">
    <button type="button" class="btn" onclick="loadMore()">加载更多</button>
  </div>

  <div class="table-area">
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead>
          <tr>
            <th>序号</th>
            <th>姓名</th>
            <th>申请人手机号</th>
            <th>平台账号摘要</th>
            <th>近3个月GMV</th>
            <th>状态</th>
            <th>提交时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info">共 <strong id="totalCount">0</strong> 条</span>
      <span class="page-btn disabled">&laquo;</span>
      <span class="page-btn active">1</span>
      <span class="page-btn">&raquo;</span>
    </div>
  </div>

</div>

  <button type="button" class="filter-fab" id="filterFab" onclick="toggleFilterSheet()">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
    筛选
  </button>

  <div class="filter-sheet-overlay" id="filterSheetOverlay" style="display:none;" onclick="if(event.target===this) toggleFilterSheet()">
    <div class="filter-sheet">
      <div class="filter-sheet-head">
        <span>筛选条件</span>
        <button type="button" class="filter-sheet-close" onclick="toggleFilterSheet()">&times;</button>
      </div>
      <div class="filter-sheet-body">
        <div class="search-item"><label>申请人手机号：</label><input type="text" id="mSPhone" placeholder="请输入手机号"></div>
        <div class="search-item"><label>平台：</label>
          <select id="mSPlatform"><option value="">全部</option><option value="抖音">抖音</option><option value="视频号">视频号</option><option value="快手">快手</option></select>
        </div>
        <div class="search-item"><label>状态：</label>
          <select id="mSStatus"><option value="">全部</option><option value="已提交">已提交</option><option value="审核中">审核中</option><option value="已审核">已审核</option><option value="已驳回">已驳回</option></select>
        </div>
      </div>
      <div class="filter-sheet-foot">
        <button type="button" class="btn" onclick="resetMobileSearch()">重置</button>
        <button type="button" class="btn btn-primary" onclick="doMobileSearch()">查询</button>
      </div>
    </div>
  </div>

<script>
var mockData = JSON.parse(localStorage.getItem('recruit_applications') || 'null') || [
  { id:1, phone:'138****2231', platform_accounts:[{platform:'抖音',account_name:'@潮流小美'}], gmv:128000, status:'已提交', created_at:'2026-07-20 10:12:00', brand:'品牌A', main_product:'女装连衣裙', screenshots:[], reject_logs:[] },
  { id:2, phone:'159****8820', platform_accounts:[{platform:'抖音',account_name:'@数码老王'},{platform:'视频号',account_name:'老王数码测评'}], gmv:356000, status:'审核中', created_at:'2026-07-21 14:05:00', brand:'品牌B', main_product:'蓝牙耳机', screenshots:[], reject_logs:[] },
  { id:3, phone:'186****0093', platform_accounts:[{platform:'快手',account_name:'家居好物研究所'}], gmv:76000, status:'已审核', created_at:'2026-07-18 09:30:00', brand:'品牌C', main_product:'收纳用品', screenshots:[], reject_logs:[] },
  { id:4, phone:'177****5567', platform_accounts:[{platform:'抖音',account_name:'@美妆小鹿'}], gmv:42000, status:'已驳回', created_at:'2026-07-22 16:48:00', brand:'品牌A', main_product:'口红套装', screenshots:[], reject_logs:[{reason:'业绩截图模糊，无法核实GMV数据', time:'2026-07-23 09:00:00', operator:'BD-张敏'}] }
];
var mockTalentNames = {
  '138****2231':'李潮', '159****8820':'王强', '186****0093':'陈静', '177****5567':'林晓鹿'
};
var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
function talentName(phone) {
  return (talents[phone] || {}).name || mockTalentNames[phone] || '-';
}

function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="7" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">公共池暂无符合条件的申请</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      html += '<tr>';
      html += '<td>' + (index+1) + '</td>';
      html += '<td>' + esc(talentName(row.phone)) + '</td>';
      html += '<td>' + esc(row.phone) + '</td>';
      html += '<td class="col-platform" title="' + esc(platformSummary(row.platform_accounts)) + '"><span class="cell-ellipsis">' + esc(platformSummary(row.platform_accounts)) + '</span></td>';
      html += '<td>&#165;' + Number(row.gmv).toLocaleString('zh-CN') + '</td>';
      html += '<td class="col-status">' + st(row.status) + '<div class="td-sub-time">' + esc(row.created_at) + '</div></td>';
      html += '<td>' + esc(row.created_at) + '</td>';
      html += '<td class="col-actions">';
      html += '<a class="link-action link-action-icon" title="查看详情" href="detail.html?id='+row.id+'&mode=view"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>查看</a>';
      html += '</td></tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
}
function platformSummary(accounts) {
  if (!accounts || accounts.length === 0) return '-';
  return accounts.map(function(a) { return a.platform + ' ' + a.account_name; }).join('；');
}
function st(s) {
  var m = { '已提交':'submitted', '审核中':'reviewing', '已审核':'approved', '已驳回':'rejected' };
  return '<span class="status-tag '+(m[s]||'')+'">'+s+'</span>';
}
function esc(s) { if(!s) return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function doSearch() {
  var p = document.getElementById('sPhone').value.trim();
  var pf = document.getElementById('sPlatform').value;
  var s = document.getElementById('sStatus').value;
  var f = mockData.filter(function(x) {
    if (p && x.phone.indexOf(p) < 0) return false;
    if (pf && !x.platform_accounts.some(function(a){ return a.platform === pf; })) return false;
    if (s && x.status !== s) return false;
    return true;
  });
  renderView(f);
  showSearchTags();
}
function resetSearch() {
  document.getElementById('sPhone').value = '';
  document.getElementById('sPlatform').value = '';
  document.getElementById('sStatus').value = '';
  renderView(mockData);
  showSearchTags();
}
function showSearchTags() {
  var map = { sPhone:'申请人手机号', sPlatform:'平台', sStatus:'状态' };
  var tags = [];
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (el && el.value) tags.push({ name: map[id], value: el.value, id: id });
  });
  var container = document.getElementById('searchTags');
  if (!container) return;
  if (tags.length === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }
  var html = '';
  tags.forEach(function(t) {
    html += '<span class="search-active-tag">' + t.name + '：' + t.value + '<span class="tag-remove" onclick="clearSearchTag(\'' + t.id + '\')">&times;</span></span>';
  });
  container.style.display = '';
  container.innerHTML = html;
}
function clearSearchTag(id) {
  document.getElementById(id).value = '';
  doSearch();
}
function toggleSearchFold() {
  var area = document.querySelector('.search-area');
  var btn = document.getElementById('searchFoldBtn');
  var folded = area.classList.toggle('folded');
  btn.innerHTML = folded ? '筛选 &#9662;' : '筛选 &#9652;';
}

var MOBILE_PAGE_SIZE = 10;
var mobileShownCount = MOBILE_PAGE_SIZE;
var currentFiltered = mockData.slice();

function isMobileView() {
  return window.matchMedia('(max-width: 640px)').matches;
}

function renderCards(data) {
  var list = document.getElementById('cardList');
  var slice = data.slice(0, mobileShownCount);
  var html = '';
  if (slice.length === 0) {
    html = '<div class="recruit-card"><div class="recruit-card-body">暂无符合条件的申请</div></div>';
  } else {
    slice.forEach(function(row) {
      var chips = (row.platform_accounts || []).map(function(a) {
        return '<span class="chip">' + esc(a.platform) + ' ' + esc(a.account_name) + '</span>';
      }).join('');
      html += '<div class="recruit-card">';
      html += '<div class="recruit-card-head"><span class="name">' + esc(talentName(row.phone)) + '</span>' + st(row.status) + '</div>';
      html += '<div class="recruit-card-body">';
      html += '<div>手机号：' + esc(row.phone) + '</div>';
      html += '<div>近3个月GMV：&#165;' + Number(row.gmv).toLocaleString('zh-CN') + '</div>';
      if (chips) html += '<div class="chip-row">' + chips + '</div>';
      html += '</div>';
      html += '<div class="recruit-card-foot"><span class="time">' + esc(row.created_at) + '</span>';
      html += '<a class="btn btn-primary" style="height:48px;line-height:48px;padding:0 16px;" href="detail.html?id=' + row.id + '&mode=view">查看详情</a>';
      html += '</div></div>';
    });
  }
  list.innerHTML = html;
  var bar = document.getElementById('loadMoreBar');
  bar.style.display = data.length > mobileShownCount ? '' : 'none';
}

function renderView(data) {
  currentFiltered = data;
  if (isMobileView()) {
    renderCards(data);
  } else {
    renderTable(data);
  }
}

function loadMore() {
  mobileShownCount += MOBILE_PAGE_SIZE;
  renderCards(currentFiltered);
}

function toggleFilterSheet() {
  var overlay = document.getElementById('filterSheetOverlay');
  overlay.style.display = overlay.style.display === 'none' ? 'flex' : 'none';
}

function doMobileSearch() {
  var p = document.getElementById('mSPhone').value.trim();
  var pf = document.getElementById('mSPlatform').value;
  var s = document.getElementById('mSStatus').value;
  var f = mockData.filter(function(x) {
    if (p && x.phone.indexOf(p) < 0) return false;
    if (pf && !x.platform_accounts.some(function(a){ return a.platform === pf; })) return false;
    if (s && x.status !== s) return false;
    return true;
  });
  mobileShownCount = MOBILE_PAGE_SIZE;
  renderView(f);
  toggleFilterSheet();
}

function resetMobileSearch() {
  document.getElementById('mSPhone').value = '';
  document.getElementById('mSPlatform').value = '';
  document.getElementById('mSStatus').value = '';
  mobileShownCount = MOBILE_PAGE_SIZE;
  renderView(mockData);
}

window.addEventListener('resize', function() { renderView(currentFiltered); });

// Toast 轻提示
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}

localStorage.setItem('recruit_applications', JSON.stringify(mockData));
renderView(mockData);
</script>
<!-- 设备效果预览切换器：电脑 / 手机 -->
<script>
(function() {
  if (self !== top) return;
  function inject(doc) {
    if (!doc || !doc.body) return;
    var bar = doc.createElement('div');
    bar.id = 'deviceSwitcher';
    bar.innerHTML = '<button type="button" id="dsBtnPc" class="ds-active">💻 电脑</button><button type="button" id="dsBtnPhone">📱 手机预览</button>';
    doc.body.appendChild(bar);
    var st = doc.createElement('style');
    st.textContent = '#deviceSwitcher{position:fixed;top:16px;right:16px;z-index:99999;display:flex;gap:2px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:4px;box-shadow:0 6px 20px rgba(15,23,42,.18)}' +
      '#deviceSwitcher button{border:none;background:transparent;padding:7px 14px;border-radius:18px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;line-height:1.4;font-family:inherit}' +
      '#deviceSwitcher button.ds-active{background:#5b6cf5;color:#fff}';
    doc.body.appendChild(st);
    var btnPc = doc.getElementById('dsBtnPc');
    var btnPhone = doc.getElementById('dsBtnPhone');
    function enterPhone() {
      if (doc.getElementById('devicePhone')) return;
      var wrap = doc.createElement('div');
      wrap.id = 'devicePhone';
      wrap.innerHTML = '<div class="dp-frame"><div class="dp-notch"></div><iframe id="dpFrame" title="手机效果预览"></iframe></div>' +
        '<div class="dp-hint">📱 手机效果预览（390px 视口）· 预览内操作同样生效 · 点右上角「电脑」返回</div>';
      var st2 = doc.createElement('style');
      st2.id = 'dpStyle';
      st2.textContent = 'html.dp-phone,html.dp-phone body{height:100%;margin:0}' +
        'html.dp-phone body{background:#0f172a !important;display:flex !important;align-items:center;justify-content:center !important;overflow:hidden !important}' +
        'html.dp-phone > body > *:not(#devicePhone):not(#deviceSwitcher){display:none !important}' +
        '#devicePhone{display:flex;flex-direction:column;align-items:center;gap:14px}' +
        '#devicePhone .dp-frame{width:390px;height:min(800px,88vh);background:#fff;border:10px solid #1e293b;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;position:relative}' +
        '#devicePhone .dp-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:24px;background:#1e293b;border-radius:0 0 16px 16px;z-index:3}' +
        '#devicePhone #dpFrame{width:100%;height:100%;border:none;display:block;background:#fff}' +
        '#devicePhone .dp-hint{color:#94a3b8;font-size:12px;text-align:center}';
      doc.body.appendChild(st2);
      doc.body.appendChild(wrap);
      doc.documentElement.classList.add('dp-phone');
      doc.getElementById('dpFrame').src = location.href;
      btnPc.classList.remove('ds-active');
      btnPhone.classList.add('ds-active');
    }
    function exitPhone() {
      var w = doc.getElementById('devicePhone');
      if (w) w.parentNode.removeChild(w);
      var s = doc.getElementById('dpStyle');
      if (s) s.parentNode.removeChild(s);
      doc.documentElement.classList.remove('dp-phone');
      btnPc.classList.add('ds-active');
      btnPhone.classList.remove('ds-active');
    }
    btnPhone.addEventListener('click', enterPhone);
    btnPc.addEventListener('click', exitPhone);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { inject(document); });
  } else {
    inject(document);
  }
})();
</script>
</body>
</html>
