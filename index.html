<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== 系统内多页签 ===== */
    .tab-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 28px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      background: #fff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15,23,42,0.05);
      position: relative;
      z-index: 9;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px 6px 14px;
      background: #f1f5f9;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
      user-select: none;
      flex-shrink: 0;
    }
    .tab-item:hover { background: #e8edf6; color: var(--primary); }
    .tab-item.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(91,108,245,.25);
    }
    .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px; height: 18px;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      color: var(--text-tertiary);
      transition: all .15s;
    }
    .tab-close:hover { background: #fee2e2; color: #dc2626; }
    .tab-item.active .tab-close { color: rgba(255,255,255,0.75); }
    .tab-item.active .tab-close:hover { background: rgba(255,255,255,0.25); color: #fff; }

    /* ===== 右上角账号切换下拉 ===== */
    .topnav-user { position: relative; }
    .topnav-user .user-caret { color: rgba(255,255,255,0.85); transition: transform .18s; }
    .topnav-user.open .user-caret { transform: rotate(180deg); }
    .account-menu {
      display: none; position: absolute; top: calc(100% + 10px); right: 0; z-index: 999;
      width: 240px; background: #fff; border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 12px 32px rgba(15,23,42,.16); padding: 6px; cursor: default;
    }
    .topnav-user.open .account-menu { display: block; }
    .account-menu .menu-title {
      font-size: 11px; color: var(--text-tertiary); font-weight: 600; padding: 8px 10px 4px;
    }
    .account-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 9px; cursor: pointer; transition: background .15s;
    }
    .account-item:hover { background: #f4f6fb; }
    .account-item .acc-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .account-item .acc-info { flex: 1; min-width: 0; }
    .account-item .acc-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .account-item .acc-role { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
    .account-item .acc-check { color: var(--primary); flex-shrink: 0; display: none; }
    .account-item.current { background: var(--primary-light); }
    .account-item.current .acc-check { display: block; }
    .account-menu .menu-divider { height: 1px; background: var(--border); margin: 6px 4px; }
    .account-menu .menu-logout {
      display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 9px;
      font-size: 13px; color: #dc2626; cursor: pointer; transition: background .15s;
    }
    .account-menu .menu-logout:hover { background: #fef2f2; }

    /* ===== 全局搜索下拉 ===== */
    .topnav-search { position: relative; }
    .search-dropdown {
      display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 999;
      width: 280px; background: #fff; border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(15,23,42,.16); padding: 4px; max-height: 360px; overflow-y: auto;
    }
    .search-dropdown.show { display: block; }
    .search-dropdown-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 8px; cursor: pointer; transition: background .15s;
    }
    .search-dropdown-item:hover { background: #f4f6fb; }
    .search-dropdown-item svg { flex-shrink: 0; width: 16px; height: 16px; color: var(--text-tertiary); }
    .search-dropdown-item .item-text { font-size: 13px; color: var(--text); flex: 1; min-width: 0; }
    .search-dropdown-item .item-group { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
    .search-dropdown-item .item-text em { font-style: normal; color: var(--primary); font-weight: 600; }
    .search-dropdown-empty {
      padding: 20px 12px; text-align: center; font-size: 13px; color: var(--text-tertiary);
    }
  </style>
</head>

            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

      <!-- 右侧主内容区 -->
      <main class="main-area">
        <div class="main-header">
          <div class="breadcrumb" id="breadcrumb">开店指南</div>
        </div>
        <div class="tab-bar" id="tabBar"></div>
        <div class="main-content" id="mainContent"></div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/auth.js"></script>
  <script>
    // ===== 登录检查 =====
    if (!Auth.isAuthenticated()) {
      window.location.href = 'login.html';
    }

    var currentUser = Auth.getCurrentUser();

    // ===== 多页签管理 =====
    var tabs = [];
    var activeTabId = null;
    var tabSeq = 0;
    var homeTabId = null;

    function findTab(id) {
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === id) return tabs[i]; }
      return null;
    }

    function buildFrameSrc(page) {
      return page + (page.indexOf('?') > -1 ? '&' : '?') + 'v=' + Date.now();
    }

    function createTab(opts) {
      var id = 'tab_' + (++tabSeq);
      var iframe = document.createElement('iframe');
      iframe.className = 'tab-frame fade-in';
      iframe.src = buildFrameSrc(opts.page);
      iframe.style.display = 'none';
      document.getElementById('mainContent').appendChild(iframe);
      var tab = { id: id, title: opts.title, page: opts.page, iframe: iframe, closable: opts.closable !== false };
      tabs.push(tab);
      if (opts.activate !== false) activateTab(id); else renderTabBar();
      return tab;
    }

    function activateTab(id) {
      activeTabId = id;
      tabs.forEach(function(t) { t.iframe.style.display = (t.id === id) ? 'block' : 'none'; });
      renderTabBar();
      var t = findTab(id);
      if (t) document.getElementById('breadcrumb').innerHTML = t.title;
    }

    function closeTab(id) {
      var idx = -1;
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === id) { idx = i; break; } }
      if (idx === -1) return;
      var tab = tabs[idx];
      if (!tab.closable) return;
      tab.iframe.parentNode.removeChild(tab.iframe);
      tabs.splice(idx, 1);
      if (activeTabId === id) {
        var next = tabs[idx] || tabs[idx - 1];
        if (next) activateTab(next.id);
      } else {
        renderTabBar();
      }
    }

    function renderTabBar() {
      var bar = document.getElementById('tabBar');
      bar.innerHTML = '';
      tabs.forEach(function(t) {
        var el = document.createElement('div');
        el.className = 'tab-item' + (t.id === activeTabId ? ' active' : '');
        el.onclick = (function(id) { return function() { activateTab(id); }; })(t.id);
        var titleSpan = document.createElement('span');
        titleSpan.textContent = t.title;
        el.appendChild(titleSpan);
        if (t.closable) {
          var closeBtn = document.createElement('span');
          closeBtn.className = 'tab-close';
          closeBtn.innerHTML = '&times;';
          closeBtn.onclick = (function(id) { return function(e) { e.stopPropagation(); closeTab(id); }; })(t.id);
          el.appendChild(closeBtn);
        }
        bar.appendChild(el);
      });
    }

    // 打开页签（同地址页签已存在则复用并激活）
    function openTab(page, title) {
      for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].page === page) { activateTab(tabs[i].id); return; }
      }
      createTab({ title: title, page: page, closable: true, activate: true });
    }

    // 切换固定"首页"页签的内容（不新建页签，仅替换首页iframe的地址，页签文字始终显示"首页"）
    // ===== 清除所有菜单激活态（兼容 guide 侧边栏 + recruit 侧边栏） =====
    function clearSidebarActive() {
      document.querySelectorAll('.sidebar-item.active, #sidebarGroup-recruit .sidebar-parent.active').forEach(function(i) { i.classList.remove('active'); });
    }

    function switchToHome(el, page) {
      clearSidebarActive();
      el.classList.add('active');
      var home = findTab(homeTabId);
      // 客户账号无首页页签，降级为普通页签打开
      if (!home) { openTab(page, el.textContent.trim()); return; }
      home.page = page;
      home.iframe.src = buildFrameSrc(page);
      activateTab(homeTabId);
    }

    // ===== 展开/收起侧边栏二级菜单 =====
    function toggleSubmenu(el) {
      el.classList.toggle('open');
    }

    // ===== 顶部一级菜单 → 每类默认页面 =====
    var topMenuDefaultPage = {
      guide: { page: 'pages/guide/list.html', title: '开店指南' },
      recruit: { page: 'pages/recruit/panorama-customer.html', title: '分销全景图' }
    };
    var currentTopKey = 'guide';

    // ===== 点击顶部一级菜单：切换左侧菜单分组 =====
    function toggleSidebar(key) {
      var body = document.querySelector('.app-body');

      if (key && key !== currentTopKey) {
        // 切换到另一个一级菜单分组
        document.querySelectorAll('.topnav-item').forEach(function(i) { i.classList.remove('active', 'sidebar-open'); });
        var btn = document.querySelector('.topnav-item[data-key="' + key + '"]');
        btn.classList.add('active', 'sidebar-open');

        document.querySelectorAll('.sidebar-group').forEach(function(g) { g.style.display = 'none'; });
        document.getElementById('sidebarGroup-' + key).style.display = '';

        body.classList.remove('sidebar-hidden');
        currentTopKey = key;

        var def = topMenuDefaultPage[key];
        if (def) {
          // 优先按配置的默认页面精确匹配 data-page；否则回退：首页型菜单（data-home）→ 首个页签型（data-page）→ 首个一级菜单
          var firstItem =
            (def.page && document.querySelector('#sidebarGroup-' + key + ' [data-page="' + def.page + '"]')) ||
            document.querySelector('#sidebarGroup-' + key + ' [data-home]') ||
            document.querySelector('#sidebarGroup-' + key + ' [data-page]') ||
            document.querySelector('#sidebarGroup-' + key + ' .sidebar-parent');
          if (firstItem) firstItem.click();
        }
        return;
      }

      // 再次点击当前激活分组：收起/展开侧边栏
      var btn = document.querySelector('.topnav-item[data-key="' + currentTopKey + '"]');
      body.classList.toggle('sidebar-hidden');
      btn.classList.toggle('sidebar-open');
    }

    // ===== 左侧菜单切换（以页签方式打开） =====
    function switchSidebar(el) {
      clearSidebarActive();
      el.classList.add('active');
      var page = el.getAttribute('data-page');
      var title = el.querySelector('span').textContent.trim();
      openTab(page, title);
    }

    // ===== 监听 iframe postMessage =====
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;

      // 更新面包屑（仅当前激活页签的子页面）
      if (e.data.type === 'breadcrumb') {
        var active = findTab(activeTabId);
        if (active && active.iframe.contentWindow === e.source) {
          document.getElementById('breadcrumb').innerHTML = e.data.text;
        }
        return;
      }

      // 子页面请求打开新页签
      if (e.data.type === 'openTab') {
        openTab(e.data.page, e.data.title || '新页签');
        return;
      }

      // 子页面请求关闭所在页签
      if (e.data.type === 'closeTab') {
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].iframe.contentWindow === e.source) { closeTab(tabs[i].id); break; }
        }
        return;
      }

      // 智能体卡片跳转（兼容旧逻辑，以页签打开）
      if (e.data.type === 'navigate') {
        openTab(e.data.page, e.data.title || '详情');
        return;
      }
    });

    // ===== 初始化：创建首页页签（仅运营视角账号，客户账号无首页） =====
    var HAS_HOME = !currentUser || currentUser.role !== 'talent';
    if (HAS_HOME) {

    }

      var draftHead = flowDraftItem + panoramaDraftItem + cooperationSignDraftItem;

      // 草稿：暂不常用的功能菜单
      var draftItems = draftHead +

        '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' +
        '<span>开票信息录入</span>' +

        '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>' +
        '<span>直播账号管理</span>' +
        '</a>' +
        '<a class="sidebar-item sidebar-child" data-page="pages/recruit/deposit-flow.html" onclick="switchSidebar(this)">' +

        '<span>保证金流水</span>' +
        '</a>';

      // 分销全景图（顶部一级菜单，所有角色可见；保留原分销页面入口）
      var customerPanoramaItem =
        '<div class="sidebar-parent" data-page="pages/recruit/panorama-customer.html" onclick="switchSidebar(this)">' +
        '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19V3"/><path d="M2 19h22"/></svg>' +

      // 客户注册账号（顶部一级菜单，所有角色可见；talent 只能看到自己）
      var profileItem =

      function operatorItems(label) {

    // ===== 用户注册：新标签页跳转到客户端注册页 =====
    function openRegisterPage() {
      window.open('pages/recruit/login.html?mode=register', '_blank');
    }

    function markSidebarActive(el) {
      clearSidebarActive();
      el.classList.add('active');
    }

    // ===== 右上角账号切换：客户 / 运营 / 管理员 =====
    var PRESET_ACCOUNTS = [
      { role: 'talent', roleLabel: '客户（达人）', name: '李潮', phone: '138****2231', color: '#f59e0b' },
      { role: 'operator', roleLabel: '运营', name: '张运营', email: 'operator@company.com', color: '#10b981' },

    function renderAccountMenu() {
      var html = '<div class="menu-title">切换账号</div>';

        var isCur = currentUser && currentUser.role === acc.role;
        html += '<div class="account-item' + (isCur ? ' current' : '') + '" onclick="switchAccount(' + i + ')">' +
          '<div class="acc-avatar" style="background:' + acc.color + '">' + acc.name.charAt(0) + '</div>' +

          '<svg class="acc-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>' +
          '</div>';
      });
      html += '<div class="menu-divider"></div>' +
        '<div class="menu-logout" onclick="logout()">' +
        '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>' +
        '退出登录</div>';
      document.getElementById('accountMenu').innerHTML = html;
    }

    function switchAccount(i) {
      var acc = PRESET_ACCOUNTS[i];
      if (currentUser && currentUser.role === acc.role) {
        document.getElementById('topnavUser').classList.remove('open');
        return;
      }
      var user = { role: acc.role, name: acc.name, permissions: Auth.getRolePermissions(acc.role) };
      if (acc.phone) user.phone = acc.phone;
      if (acc.email) user.email = acc.email;
      Auth.setCurrentUser(user);
      if (acc.role === 'talent') {
        // 保证演示达人身份存在并写入客户端登录态（同时初始化 updated_at / last_login_at）
        var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
        var nowStr = new Date().toLocaleString('zh-CN', {hour12:false}).replace(/\//g, '-');
        if (!talents[acc.phone]) {
          talents[acc.phone] = { phone: acc.phone, name: acc.name, talent_id: 'T_DEMO_001', created_at: nowStr, updated_at: nowStr, last_login_at: nowStr };
        } else {
          talents[acc.phone].last_login_at = nowStr;
          if (!talents[acc.phone].updated_at) talents[acc.phone].updated_at = talents[acc.phone].created_at || nowStr;
        }
        localStorage.setItem('recruit_talents', JSON.stringify(talents));
        localStorage.setItem('recruit_current_phone', acc.phone);
      } else {
        localStorage.removeItem('recruit_current_phone');
      }
      location.reload();
    }

    function toggleAccountMenu() {
      document.getElementById('topnavUser').classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      var u = document.getElementById('topnavUser');
      if (u && !u.contains(e.target)) u.classList.remove('open');
    });

    // ===== 更新用户信息显示 =====
    function updateUserDisplay() {
      var roleLabels = { talent: '客户', operator: '运营', bd: 'BD', admin: '管理员' };
      var userName = currentUser.name || currentUser.email || currentUser.phone || '用户';
      var label = roleLabels[currentUser.role];
      document.getElementById('userName').textContent = userName + (label ? ' · ' + label : '');
      document.getElementById('userAvatar').textContent = userName.charAt(0).toUpperCase();
    }

    // ===== 退出登录 =====
    function logout() {
      if (confirm('确定要退出登录吗？')) {
        Auth.logout();
      }
    }

    // ===== 页面加载时初始化 =====
    renderMenuByRole(currentUser.role);
    updateUserDisplay();
    renderAccountMenu();
    // 客户账号无首页：默认直接进入分销枢纽（自动打开我的申请）
    if (!HAS_HOME) toggleSidebar('recruit');

    // ===== 全局搜索：模糊查询菜单名称 =====
    var searchInput = document.getElementById('globalSearch');
    var searchDropdown = document.getElementById('searchDropdown');

    // 收集所有菜单项
    function collectMenuItems() {
      var items = [];
      ['guide', 'recruit'].forEach(function(key) {
        var group = document.getElementById('sidebarGroup-' + key);
        if (!group || group.style.display === 'none') return;
        var groupName = key === 'guide' ? '店铺引擎' : '分销枢纽';
        var parents = group.querySelectorAll('.sidebar-parent');
        parents.forEach(function(parent) {
          var parentSpan = parent.querySelector(':scope > span');
          var parentName = parentSpan ? parentSpan.textContent.trim() : '';
          var parentPage = parent.getAttribute('data-page');
          var parentHome = parent.getAttribute('data-home');
          if (parentPage || parentHome) {
            items.push({
              name: parentName,
              page: parentPage || '',
              isHome: !!parentHome,
              homePage: parentHome || '',
              group: groupName,
              parentName: ''
            });
          }
          // 仅取紧跟在当前 parent 后面的 .sidebar-children 内的子项
          var sibling = parent.nextElementSibling;
          if (sibling && sibling.classList.contains('sidebar-children')) {
            sibling.querySelectorAll('.sidebar-child').forEach(function(child) {
              var childSpan = child.querySelector(':scope > span');
              var childName = childSpan ? childSpan.textContent.trim() : '';
              var childPage = child.getAttribute('data-page');
              if (childPage && childName) {
                items.push({
                  name: childName,
                  page: childPage,
                  isHome: false,
                  group: groupName,
                  parentName: parentName
                });
              }
            });
          }
        });
      });
      var seen = {};
      var unique = [];
      items.forEach(function(item) {
        var k = item.page || item.homePage;
        if (!seen[k]) { seen[k] = true; unique.push(item); }
      });
      return unique;
    }

    // 高亮匹配文字
    function highlightMatch(text, keyword) {
      if (!keyword) return escHtml(text);
      var idx = text.toLowerCase().indexOf(keyword.toLowerCase());
      if (idx < 0) return escHtml(text);
      return escHtml(text.substring(0, idx)) +
        '<em>' + escHtml(text.substring(idx, idx + keyword.length)) + '</em>' +
        escHtml(text.substring(idx + keyword.length));
    }

    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // 搜索事件
    searchInput.addEventListener('input', function() {
      var keyword = this.value.trim();
      if (!keyword) {
        searchDropdown.classList.remove('show');
        searchDropdown.innerHTML = '';
        return;
      }
      var allItems = collectMenuItems();
      var matched = allItems.filter(function(item) {
        return item.name.toLowerCase().indexOf(keyword.toLowerCase()) >= 0;
      });
      if (matched.length === 0) {
        searchDropdown.innerHTML = '<div class="search-dropdown-empty">未找到匹配的菜单</div>';
        searchDropdown.classList.add('show');
        return;
      }
      var html = '';
      matched.forEach(function(item) {
        var groupLabel = item.parentName ? item.group + ' / ' + item.parentName : item.group;
        html += '<div class="search-dropdown-item" data-page="' + escHtml(item.page) + '" data-home="' + (item.isHome ? '1' : '') + '" data-home-page="' + escHtml(item.homePage || '') + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
          '<span class="item-text">' + highlightMatch(item.name, keyword) + '</span>' +
          '<span class="item-group">' + escHtml(groupLabel) + '</span>' +
          '</div>';
      });
      searchDropdown.innerHTML = html;
      searchDropdown.classList.add('show');
      // 点击结果项
      searchDropdown.querySelectorAll('.search-dropdown-item').forEach(function(el) {
        el.addEventListener('click', function() {
          var page = this.getAttribute('data-page');
          var isHome = this.getAttribute('data-home') === '1';
          var homePage = this.getAttribute('data-home-page');
          searchDropdown.classList.remove('show');
          searchInput.value = '';
          if (isHome && homePage) {
            // 首页型菜单：找到对应的 sidebar 元素并点击
            var target = document.querySelector('[data-home="1"][onclick*="' + homePage + '"]');
            if (target) target.click();
          } else if (page) {
            // 普通页签型菜单：激活对应侧边栏项并打开页签
            var sidebarItem = document.querySelector('.sidebar-child[data-page="' + page + '"]');
            if (sidebarItem) {
              sidebarItem.click();
            } else {
              openTab(page, matched.filter(function(m) { return m.page === page; })[0].name || '新页签');
            }
          }
        });
      });
    });

    // 点击外部关闭搜索下拉
    document.addEventListener('click', function(e) {
      var s = document.querySelector('.topnav-search');
      if (s && !s.contains(e.target)) {
        searchDropdown.classList.remove('show');
      }
    });
  </script>
</body>
</html>
