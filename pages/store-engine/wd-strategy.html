<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挽单方案</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
  :root { --ink:#0f172a; }
  .data-table thead th, .data-table tbody td { text-align:center; white-space:nowrap; font-size:12.5px; }
  .data-table .col-left { text-align:left; }
  .plan-no { font-family:"SF Mono","Menlo",monospace; font-size:12px; color:var(--primary); font-weight:600; cursor:pointer; }
  .plan-no:hover { text-decoration:underline; }
  .plan-name { font-size:12.5px; color:var(--ink); font-weight:600; }
  .plan-src { font-size:11px; color:var(--text-tertiary); margin-top:3px; }
  .rt-chip { display:inline-block; padding:1px 7px; border-radius:4px; background:#f2f3f5; color:#4e5969; font-size:11px; margin:1px 3px 1px 0; }
  .rt-chip.bad { background:#fef2f2; color:#dc2626; }
  .ratio-cell { text-align:left; }
  .ratio-cell .r { font-size:11.5px; color:var(--text-secondary); }
  .ratio-cell .r b { color:#059669; font-family:"SF Mono","Menlo",monospace; }
  .ratio-cell .r.over b { color:#dc2626; }
  .tier-tag { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:10px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .tier-tag::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
  .tier-tag.t-yh { background:#ecfdf5; color:#059669; }
  .tier-tag.t-ym { background:#dbeafe; color:#2563eb; }
  .tier-tag.t-l { background:#f1f5f9; color:#647084; }
  .st-tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11.5px; font-weight:600; }
  .ps-tag { display:inline-flex; align-items:center; gap:6px; padding:3px 12px; border-radius:13px; font-size:11.5px; font-weight:700; cursor:pointer; border:1px solid transparent; }
  .ps-tag::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .ps-on { background:#ecfdf5; color:#059669; border-color:#a7f3d0; }
  .ps-off { background:#f1f5f9; color:#647084; border-color:#e2e8f0; }
  .ps-tag:hover { box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .ps-tag.sy-pending { background:#fef3c7; color:#d97706; border-color:#fde68a; }
  .ps-tag.sy-doing { background:#dbeafe; color:#2563eb; border-color:#bfdbfe; }
  .ps-tag.sy-done { background:#ecfdf5; color:#059669; border-color:#a7f3d0; }
  .ps-tag.sy-fail { background:#fef2f2; color:#dc2626; border-color:#fecaca; }
  .ps-tag.ro { cursor:default; }
  .ps-tag.ro:hover { box-shadow:none; }
  .shop-code { font-family:"SF Mono","Menlo",monospace; font-size:11.5px; color:var(--primary); font-weight:600; }
  .st-draft { background:#f1f5f9; color:#475569; }
  .st-guard-passed { background:#dbeafe; color:#2563eb; }
  .st-pending-sync { background:#fef3c7; color:#d97706; }
  .st-syncing { background:#dbeafe; color:#2563eb; }
  .st-unverified { background:#ffedd5; color:#ea580c; }
  .st-active { background:#ecfdf5; color:#059669; }
  .st-verify-fail { background:#fef2f2; color:#dc2626; }
  .st-disabled { background:#f1f5f9; color:#647084; }
  .op-link { color:var(--primary); cursor:pointer; font-size:12px; }
  .op-link:hover { text-decoration:underline; }
  .op-sep { color:var(--border); margin:0 5px; }

  .view-toggle { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .view-toggle button { border:none; background:#fff; padding:7px 14px; font-size:12.5px; cursor:pointer; color:var(--text-secondary); }
  .view-toggle button.on { background:var(--primary); color:#fff; font-weight:600; }
  .table-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .tb-left { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .tb-note { font-size:11.5px; color:var(--text-tertiary); }

  .matrix-wrap { overflow-x:auto; padding:4px 0 10px; }
  .matrix { border-collapse:separate; border-spacing:6px; width:100%; min-width:900px; }
  .matrix th { font-size:12px; color:var(--text-secondary); font-weight:600; padding:6px 4px; }
  .matrix th.row-h { text-align:right; padding-right:10px; color:var(--ink); font-size:12.5px; }
  .mx-cell { border-radius:8px; padding:8px 10px; text-align:center; border:1px solid var(--border-light); background:#fafbfd; }
  .mx-cell.on { background:#eef0ff; border-color:#c7cdf9; cursor:pointer; }
  .mx-cell.on:hover { box-shadow:0 2px 8px rgba(91,108,245,.16); }
  .mx-cell.legacy { background:#fff7ed; border-color:#fed7aa; }
  .mx-id { font-size:11px; font-weight:700; color:var(--primary); font-family:"SF Mono","Menlo",monospace; }
  .mx-meta { font-size:11px; color:var(--text-tertiary); margin-top:2px; }
  .mx-empty { color:var(--text-disabled); font-size:12px; }
  </style>
</head>
<body>
<div class="page-container">
  <div id="toastContainer" class="toast-container"></div>
  <script>
    if (window.parent) { window.parent.postMessage({type:'breadcrumb', text:'售后挽单 <span>/</span> 挽单方案'}, '*'); }
  </script>

  <div class="page-title">挽单方案</div>

  <div class="search-area">
    <div class="search-row">
      <div class="search-item">
        <label>方案编号：</label>
        <input type="text" id="fId" placeholder="如 WD20261026001">
      </div>
      <div class="search-item">
        <label>方案名称：</label>
        <input type="text" id="fName" placeholder="请输入方案名称">
      </div>
      <div class="search-item">
        <label>品牌：</label>
        <select id="fBrand"><option value="">全部</option></select>
      </div>
      <div class="search-item">
        <label>店铺：</label>
        <select id="fShop"><option value="">全部</option></select>
      </div>
      <div class="search-item">
        <label>分档：</label>
        <select id="fTier"><option value="">全部</option><option value="YH">高档</option><option value="YM">中档</option><option value="L">低档</option></select>
      </div>
      <div class="search-item">
        <label>挽回类型：</label>
        <select id="fRecover"><option value="">全部</option><option value="custom">自定义挽单</option><option value="smart">智能挽单</option></select>
      </div>
      <div class="search-item">
        <label>状态：</label>
        <select id="fStatus"><option value="">全部</option></select>
      </div>
      <div class="search-item">
        <label>同步平台状态：</label>
        <select id="fSync"><option value="">全部</option></select>
      </div>
      <div class="search-item">
        <label>更新时间：</label>
        <input type="date" id="fFrom"> <span style="margin:0 4px;color:var(--text-tertiary);">至</span> <input type="date" id="fTo">
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" onclick="runFilter(true)">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>
  </div>

  <div class="table-area">
    <div class="table-toolbar">
      <div class="tb-left">
        <button class="btn btn-primary" onclick="addNew()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新增
        </button>
        <button class="btn" onclick="regenPlans()">按商品池重新生成</button>
        <span class="tb-note">方案按挽单商品池「店铺 × 分档」自动生成，也可手工新建草稿；<span class="op-link" onclick="resetDemo()">恢复演示数据</span></span>
      </div>
      <div class="view-toggle">
        <button id="btnList" class="on" onclick="switchView('list')">列表视图</button>
        <button id="btnMatrix" onclick="switchView('matrix')">店铺×分档矩阵</button>
      </div>
    </div>

    <div class="table-scroll" id="listView">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:46px;">序号</th>
            <th style="width:120px;">方案编号</th>
            <th style="width:96px;">店铺编码</th>
            <th style="width:120px;">店铺名称</th>
            <th style="width:76px;">分档</th>
            <th class="col-left" style="width:250px;">方案名称</th>
            <th style="width:110px;">商品范围</th>
            <th class="col-left" style="width:210px;">最大挽留比例</th>
            <th style="width:104px;">状态</th>
            <th style="width:118px;">同步平台状态</th>
            <th style="width:126px;">更新时间</th>
            <th style="width:96px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="matrix-wrap" id="matrixView" style="display:none;"></div>

    <div class="pagination">
      <span class="page-info">共 <strong id="totalCount">0</strong> 条</span>
      <span class="page-btn disabled">&laquo;</span>
      <span class="page-btn active">1</span>
      <span class="page-btn">&raquo;</span>
    </div>
  </div>
</div>

<script src="../../js/wd/retention-data.js?v=20261120b"></script>
<script>
function esc(s) {
  if (s === null || s === undefined) return '';
  var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML;
}
WD.initPlans();
function parseMin(str) {
  var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(str || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime() : NaN;
}
function cleanUnnamedDrafts() {
  var now = Date.now();
  var kept = WD.STRATEGIES.filter(function(s) {
    if (!(s.status === 'DRAFT' && (!s.plan || !s.plan.name))) return true;
    // 「新增」刚创建、详情页可能仍在编辑：10 分钟内不回收，避免 focus 竞态误删
    if (s.pendingNew) {
      var t = parseMin(s.createdAt);
      if (!isNaN(t) && now - t < 10 * 60 * 1000) return true;
    }
    return false;
  });
  if (kept.length !== WD.STRATEGIES.length) {
    WD.STRATEGIES.length = 0;
    kept.forEach(function(s) { WD.STRATEGIES.push(s); });
    WD.persistPlans();
  }
}
cleanUnnamedDrafts();
var current = WD.STRATEGIES.slice();
var viewMode = 'list';

var SCOPE_TXT = { all:'不限制商品', include:'添加商品支持方案', exclude:'添加商品不支持方案' };
function scopeCell(p, s) {
  var ids = Array.isArray(p.items) ? p.items : null;
  var sub = p.productScope === 'include'
    ? ((ids ? ids.length : s.itemCnt) + ' 个平台商品 / ' + s.physicalCnt + ' 条物理方案')
    : (s.itemCnt + ' 款 / ' + s.physicalCnt + ' 条物理方案');
  return '<td><div style="font-size:11.5px;">' + esc(SCOPE_TXT[p.productScope] || p.productScope) + '</div>'
    + '<div style="font-size:11px;color:var(--text-tertiary);">' + esc(sub) + '</div></td>';
}
var RECOVER_TXT = { custom:'自定义挽单', smart:'智能挽单' };

(function initFilters() {
  var bSel = document.getElementById('fBrand');
  WD.BRANDS.forEach(function(b) { bSel.insertAdjacentHTML('beforeend', '<option value="' + esc(b) + '">' + esc(b) + '</option>'); });
  var sSel = document.getElementById('fStatus');
  Object.keys(WD.PLAN_STATUS).forEach(function(k) {
    sSel.insertAdjacentHTML('beforeend', '<option value="' + k + '">' + esc(WD.PLAN_STATUS[k]) + '</option>');
  });
  var ySel = document.getElementById('fSync');
  Object.keys(WD.PLAN_SYNC_STATUS).forEach(function(k) {
    ySel.insertAdjacentHTML('beforeend', '<option value="' + k + '">' + esc(WD.PLAN_SYNC_STATUS[k].label) + '</option>');
  });
  var shSel = document.getElementById('fShop');
  WD.TAG_SHOPS.forEach(function(s) {
    shSel.insertAdjacentHTML('beforeend', '<option value="' + esc(s.code) + '">' + esc(s.code) + ' ' + esc(s.name) + '</option>');
  });
})();

function planOf(s) { return s.plan || (s.plan = WD.planOf(s)); }
// 分档徽章：仅自动生成的分组方案有档位；存量/手工方案无分档，单元格留空
function tierCell(s) {
  var tn = WD.RUN_TIER_NAME[s.tier];
  return '<td>' + (tn ? '<span class="tier-tag t-' + String(s.tier).toLowerCase() + '">' + esc(tn) + '</span>' : '') + '</td>';
}

function renderTable(data) {
  var tb = document.getElementById('tableBody');
  if (!data.length) {
    tb.innerHTML = '<tr><td colspan="12" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无方案</div><div class="empty-hint">点击「新增」手工新建挽单方案草稿</div></td></tr>';
  } else {
    tb.innerHTML = data.map(function(s, i) {
      var p = planOf(s);
      var ss = s.syncStatus || WD.syncStatusOf(s);
      var fr = s.syncFailReason !== undefined ? s.syncFailReason : WD.syncFailReason(s);
      var clampedCnt = p.amountRows.filter(function(r){ return r.clamped; }).length;
      var isAll = p.amountMode === 'all';
      var isFixed = p.ruleType === 'fixed';
      var ratios;
      if (isAll) {
        var r0 = p.amountRows[0] || { suggest: 0, fixed: 0, capPct: 100 };
        ratios = '<div class="r">' + (isFixed ? '统一退款' : '全部订单金额') + '：<b>'
          + (isFixed ? '¥' + (r0.fixed || 0) : r0.suggest + '%') + '</b>'
          + '<span style="color:var(--text-tertiary);">（' + (isFixed ? '固定金额退款' : '固定比例退款')
          + (!isFixed && p.ratioCap ? '，最高不超 ' + p.ratioCap + ' 元' : '')
          + (isFixed && p.autoApprove && p.autoApprove.on ? '，小金额自动同意' : '') + '）</span></div>';
      } else {
        ratios = p.amountRows.slice(0, 3).map(function(r) {
          var note = r.clamped ? '<span style="color:#d97706;">（目标 ' + r.raw + '% 已压回上限 ' + r.capPct + '%）</span>' : '（上限 ' + r.capPct + '%）';
          return '<div class="r' + (!isFixed && r.suggest > r.capPct ? ' over' : '') + '">' + esc(r.lower + '–' + (r.upper === null ? '∞' : r.upper)) + ' 元：<b>'
            + (isFixed ? '¥' + (r.fixed || 0) : r.suggest + '%') + '</b>' + (isFixed ? '' : note) + '</div>';
        }).join('')
          + (clampedCnt && !p.amountRows.slice(0, 3).some(function(r){ return r.clamped; })
              ? '<div class="r" style="color:#d97706;">含 ' + clampedCnt + ' 档目标比例超平台上限，已压回（详见比例表）</div>' : '')
          + (p.amountRows.length > 3 ? '<div class="r" style="color:var(--text-tertiary);">共 ' + p.amountRows.length + ' 档，详情页可展开全部</div>' : '');
      }
      return '<tr>'
        + '<td>' + (i + 1) + '</td>'
        + '<td><span class="plan-no" onclick="viewDetail(\'' + esc(s.id) + '\')">' + esc(s.id) + '</span></td>'
        + '<td><span class="shop-code">' + esc(s.shopCode || '') + '</span></td>'
        + '<td>' + esc(s.shopName || '') + '</td>'
        + tierCell(s)
        + '<td class="col-left"><div class="plan-name">' + esc(p.name) + '</div>'
        + '<div class="plan-src">' + esc(p.source) + '</div></td>'
        + scopeCell(p, s)
        + '<td class="ratio-cell">' + ratios + '</td>'
        + '<td><span class="ps-tag ' + (s.planStatus === 'DISABLED' ? 'ps-off' : 'ps-on') + '" onclick="togglePlanStatus(\'' + esc(s.id) + '\')">' + esc(WD.PLAN_STATUS[s.planStatus] || '启用') + '</span></td>'
        + '<td><span class="ps-tag ro ' + ss.tone + '" title="' + esc(fr ? (ss.label + '：' + fr) : ss.note) + '">' + esc(ss.label) + '</span></td>'
        + '<td style="font-size:11.5px;">' + esc(s.updated) + '</td>'
        + '<td><span class="op-link" onclick="viewDetail(\'' + esc(s.id) + '\')">查看</span>'
        + '<span class="op-sep">|</span><span class="op-link" onclick="editDetail(\'' + esc(s.id) + '\')">编辑</span></td>'
        + '</tr>';
    }).join('');
  }
  document.getElementById('totalCount').textContent = data.length;
}

var ST_CLS = { DRAFT:'draft', GUARD_PASSED:'guard-passed', GUARD_BLOCKED:'verify-fail', PENDING_SYNC:'pending-sync',
  SYNCING:'syncing', SYNCED_UNVERIFIED:'unverified', ACTIVE:'active', VERIFY_FAILED:'verify-fail',
  DISABLED:'disabled', RETIRED:'draft' };

function renderMatrix(data) {
  var tiers = ['YH', 'YM', 'L'];
  var tierName = { YH: '高档', YM: '中档', L: '低档' };
  var html = '<table class="matrix"><thead><tr><th></th>';
  tiers.forEach(function(t) { html += '<th>' + esc(tierName[t]) + '</th>'; });
  html += '<th style="width:120px;">存量/全店</th></tr></thead><tbody>';
  WD.TAG_SHOPS.forEach(function(sh) {
    html += '<tr><th class="row-h">' + esc(sh.name) + '</th>';
    tiers.forEach(function(t) {
      var s = data.filter(function(x){ return x.shopCode === sh.code && x.tier === t && !x.isLegacy; })[0];
      if (s) {
        var p = planOf(s);
        html += '<td><div class="mx-cell on" onclick="viewDetail(\'' + esc(s.id) + '\')">'
          + '<div class="mx-id">' + esc(s.id) + '</div>'
          + '<div class="mx-meta">' + esc(WD.PLAN_STATUS[s.planStatus] || '启用') + ' · 退款 ' + s.ratio + '% 最高 ¥' + s.cap + '</div>'
          + '<div class="mx-meta">' + esc(RECOVER_TXT[p.recoverType]) + ' · ' + s.itemCnt + ' 款</div></div></td>';
      } else {
        html += '<td><div class="mx-cell"><span class="mx-empty">—</span></div></td>';
      }
    });
    var legacy = data.filter(function(x){ return x.isLegacy && x.shopCode === sh.code; })[0];
    html += legacy
      ? '<td><div class="mx-cell legacy" onclick="viewDetail(\'' + esc(legacy.id) + '\')"><div class="mx-id">' + esc(legacy.id) + '</div><div class="mx-meta">' + esc(WD.PLAN_STATUS[legacy.planStatus] || '启用') + ' · 存量智能挽单</div><div class="mx-meta">' + legacy.itemCnt + ' 款</div></div></td>'
      : '<td><div class="mx-cell"><span class="mx-empty">—</span></div></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  html += '<div style="font-size:11px;color:var(--text-tertiary);margin-top:6px;">行 = 店铺，列 = 分档；方案按挽单商品池「店铺 × 分档」生成，退款比例与最高退款金额取自该店铺商品判定策略的分档规则；橙色为抖店存量导入方案。矩阵用于核对同一商品是否被多条方案重复覆盖。</div>';
  document.getElementById('matrixView').innerHTML = html;
}

function switchView(v) {
  viewMode = v;
  document.getElementById('btnList').classList.toggle('on', v === 'list');
  document.getElementById('btnMatrix').classList.toggle('on', v === 'matrix');
  document.getElementById('listView').style.display = v === 'list' ? '' : 'none';
  document.getElementById('matrixView').style.display = v === 'matrix' ? '' : 'none';
  if (v === 'matrix') renderMatrix(current);
}

function runFilter(showToast) {
  var id = document.getElementById('fId').value.trim();
  var name = document.getElementById('fName').value.trim();
  var brand = document.getElementById('fBrand').value;
  var shop = document.getElementById('fShop').value;
  var tier = document.getElementById('fTier').value;
  var recover = document.getElementById('fRecover').value;
  var status = document.getElementById('fStatus').value;
  var sync = document.getElementById('fSync').value;
  var from = document.getElementById('fFrom').value, to = document.getElementById('fTo').value;
  current = WD.STRATEGIES.filter(function(s) {
    var p = planOf(s);
    if (id && s.id.indexOf(id) === -1) return false;
    if (name && p.name.indexOf(name) === -1) return false;
    if (brand && s.brand !== brand) return false;
    if (shop && s.shopCode !== shop) return false;
    if (tier && s.tier !== tier) return false;
    if (recover && p.recoverType !== recover) return false;
    if (status && s.planStatus !== status) return false;
    var ss = s.syncStatus || WD.syncStatusOf(s);
    if (sync && ss.code !== sync) return false;
    var day = s.updated.slice(0, 10);
    if (from && day < from) return false;
    if (to && day > to) return false;
    return true;
  });
  renderTable(current);
  if (viewMode === 'matrix') renderMatrix(current);
  if (showToast) toast('查询完成，命中 ' + current.length + ' 条方案', 'info');
}
function resetSearch() {
  ['fId','fName','fBrand','fShop','fTier','fRecover','fStatus','fSync','fFrom','fTo'].forEach(function(i) { document.getElementById(i).value = ''; });
  current = WD.STRATEGIES.slice();
  renderTable(current);
  if (viewMode === 'matrix') renderMatrix(current);
}

function openDetail(qs) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type:'openTab', page:'pages/store-engine/wd-strategy-detail.html' + qs, title:'方案详情' }, '*');
  } else { location.href = 'wd-strategy-detail.html' + qs; }
}
function viewDetail(id) {
  var s = WD.STRATEGIES.filter(function(x){ return x.id === id; })[0];
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type:'openTab', page:'pages/store-engine/wd-strategy-detail.html?id=' + encodeURIComponent(id),
      title:'方案详情 - ' + (s ? planOf(s).name : id) }, '*');
  } else { location.href = 'wd-strategy-detail.html?id=' + encodeURIComponent(id); }
}
function editDetail(id) { openDetail('?id=' + encodeURIComponent(id) + '&mode=edit'); }
function addNew() {
  var d = new Date(), pad = function(x){ return String(x).padStart(2, '0'); };
  var day = String(d.getFullYear()) + pad(d.getMonth() + 1) + pad(d.getDate());
  var prefix = 'WD' + day;
  // 方案编号规则：WD + 年月日 + 3 位流水（按当日已有方案数递增）
  var maxSeq = WD.STRATEGIES.reduce(function(a, s) {
    var m = String(s.id).match(/^WD(\d{8})(\d{3})$/);
    return Math.max(a, m && m[1] === day ? parseInt(m[2], 10) : 0);
  }, 0);
  var ts = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  var s = { id: prefix + String(maxSeq + 1).padStart(3, '0'),
    manual: true,
    brand: '森马', tier: '', band: '全部订单金额', ratio: 8, cap: 15, dailyBudget: 3000,
    freq: '1_per_after_sale_order', reasons: ['无理由原因'], group: 'NONE', status: 'DRAFT',
    itemCnt: 0, physicalCnt: 0, prevId: '', guard: false, reason: '手工新建草稿', planStatus: 'DISABLED', pendingNew: true,
    shopCode: 'DY-S001', shopName: '森马旗舰店', schemeId: '',
    createdBy: '当前用户（业务运营）', createdAt: ts, updatedBy: '当前用户（业务运营）', updated: ts };
  s.plan = WD.planOf(s);
  s.plan.name = '';
  // 新建草稿直接落在本期开放范围内
  s.plan.recoverType = 'custom';
  s.plan.scene = 'after_sale';
  s.plan.afterSaleTypes = ['退货退款'];
  s.plan.reasons = ['无理由原因'];
  s.plan.productScope = 'all';
  s.plan.crowdScope = 'all';
  s.plan.amountMode = 'all';
  s.plan.ruleType = 'ratio';
  s.plan.amountRows = [{ band: '全部订单金额', lower: 0, upper: null, maxRatio: 100, capPct: 100,
    raw: s.ratio, suggest: s.ratio, fixed: 0, over: false, clamped: false }];
  s.logs = [{ at: ts, by: '当前用户（业务运营）', act: '创建方案', detail: '手工新建挽单方案草稿，待填写后保存' }];
  WD.STRATEGIES.push(s);
  WD.persistPlans(s.id);
  runFilter(false);
  openDetail('?id=' + encodeURIComponent(s.id) + '&mode=edit&new=1');
}
function togglePlanStatus(id) {
  // 先拉最新存储再改，避免详情页并行修改被过期内存数组覆盖
  WD.reloadPlans();
  WD.initPlans();
  var s = WD.STRATEGIES.filter(function(x){ return x.id === id; })[0];
  if (!s) { runFilter(false); return; }
  var on = s.planStatus !== 'DISABLED';
  if (on && !confirm('禁用方案「' + (s.plan ? s.plan.name : id) + '」？禁用后抖店侧不再向消费者触发挽留。')) return;
  s.planStatus = on ? 'DISABLED' : 'ENABLED';
  s.updated = nowStr2();
  var prevSync = (s.syncStatus || WD.syncStatusOf(s)).label;
  // 与详情页保持同一口径：已生效方案被禁用后需人工到抖店下线，回到待同步
  var ss0 = s.syncStatus || WD.syncStatusOf(s);
  if (on && (ss0.code === 'SUCCESS' || ss0.code === 'SYNCING' || ss0.code === 'FAILED')) {
    s.syncStatus = { code: 'PENDING', label: WD.PLAN_SYNC_STATUS.PENDING.label, tone: 'sy-pending',
      note: '方案已禁用，需人工在抖店下线该方案', at: s.updated };
    s.syncFailReason = '';
  } else {
    s.syncStatus = WD.syncStatusOf(s);
    s.syncFailReason = WD.syncFailReason(s);
  }
  if (!s.logs) s.logs = [];
  s.logs.push({ at: s.updated, by: '当前用户（业务运营）', act: on ? '禁用方案' : '启用方案',
    detail: '方案状态：' + (on ? '启用 → 禁用' : '禁用 → 启用') + '；同步平台状态：' + prevSync + ' → ' + s.syncStatus.label
      + (on ? '；需人工在抖店下线该方案' : '；需确认抖店侧方案已开启') });
  WD.persistPlans(id);
  runFilter(false);
  toast(on ? '已禁用 ' + id : '已启用 ' + id, on ? 'warning' : 'success');
}
function nowStr2() {
  var d = new Date(), p = function(x){ return String(x).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function resetDemo() {
  if (!confirm('将丢弃本地保存的方案编辑，恢复为初始演示数据。是否继续？')) return;
  WD.resetPlans();
  location.reload();
}
function regenPlans() {
  if (!confirm('将按当前挽单商品池与商品判定策略，按「店铺 × 分档」重新生成方案；自动生成方案上的手工修改将被覆盖，手工新建的方案保留。是否继续？')) return;
  WD.regeneratePlans();
  runFilter(false);
  var n = WD.STRATEGIES.filter(function(s){ return s.gen; }).length;
  toast('已按当前商品池与判定策略重新生成 ' + n + ' 个方案', 'success');
}

function toast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div'); t.className = 'toast toast-' + (type || 'info'); t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('toast-hide'); }, 3400);
  setTimeout(function(){ t.remove(); }, 3900);
}

runFilter(false);
window.addEventListener('storage', function(e) {
  if (e.key !== 'wd_plans') return;
  WD.reloadPlans();
  WD.initPlans();
  cleanUnnamedDrafts();
  runFilter(false);
  toast('已同步详情页保存的方案变更', 'info');
});
window.addEventListener('focus', function() {
  WD.reloadPlans();
  WD.initPlans();
  cleanUnnamedDrafts();
  runFilter(false);
});
</script>
