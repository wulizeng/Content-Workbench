<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户档案库 - 分销枢纽</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* ===== 整页满屏 flex 布局（高度自适应，不超屏） ===== */
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
    .page-container { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 20px; width: 100%; box-sizing: border-box; }
    .cp-topbar, .cp-kpi-grid, .cp-topfilter { flex-shrink: 0; }

    /* ===== 顶部标题栏 ===== */
    .cp-topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .cp-logo { width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
    .cp-title { font-size: 20px; font-weight: 700; color: var(--text); }
    .cp-badge { font-size: 12px; color: var(--text-tertiary); background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px; }

    /* ===== KPI 紧凑统计条 ===== */
    .cp-kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--bg-white);
      border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
    .cp-kpi { padding: 11px 14px; border-right: 1px solid var(--border-light); }
    .cp-kpi:last-child { border-right: none; }
    .cp-kpi .k-label { font-size: 12px; color: var(--text-tertiary); }
    .cp-kpi .k-value { display: inline-block; font-size: 20px; font-weight: 800; color: var(--text); margin-top: 3px; line-height: 1; }
    .cp-kpi .k-value.accent { color: var(--primary); }
    .cp-kpi .k-value.warn { color: var(--danger); }
    .cp-kpi .k-sub { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--text-muted); }

    /* ===== 顶部品牌视角筛选条 ===== */
    .cp-topfilter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .cp-topfilter .row-label { font-size: 13px; color: var(--text-tertiary); flex-shrink: 0; }
    .cp-pill { font-size: 13px; color: var(--text-secondary); background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 14px; cursor: pointer; transition: var(--transition); user-select: none; }
    .cp-pill:hover { border-color: var(--primary-200); color: var(--primary); }
    .cp-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ===== 主从分栏（等高，各自内部滚动） ===== */
    .cp-body { display: flex; gap: 16px; align-items: stretch; flex: 1; min-height: 0; }
    .cp-left { flex: 0 1 320px; min-width: 240px; display: flex; flex-direction: column; height: 100%;
      background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
    .cp-right { flex: 1; min-width: 0; height: 100%; overflow-y: auto; }

    /* ===== 左侧查询区 ===== */
    .cp-filter { background: transparent; border: none; border-bottom: 1px solid var(--border-light); border-radius: 0;
      padding: 10px 12px; margin-bottom: 0; flex-shrink: 0; box-shadow: none; }
    .cp-filter-row { display: flex; align-items: center; gap: 6px; }
    .cp-search { flex: 1; min-width: 0; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 0 10px; font-size: 13px; }
    .cp-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .cp-search-btn { height: 34px; padding: 0 14px; font-size: 13px; flex-shrink: 0; }
    .cp-more-btn { width: 34px; height: 34px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-white);
      color: var(--text-secondary); cursor: pointer; transition: var(--transition); }
    .cp-more-btn:hover { border-color: var(--primary-200); color: var(--primary); }
    .cp-more-btn svg { transition: transform var(--transition); }
    .cp-more-btn.open { color: var(--primary); border-color: var(--primary); }
    .cp-more-btn.open svg { transform: rotate(45deg); }

    /* 展开的附加查询条件 */
    .cp-extra { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .cp-extra.open { display: block; }
    .cp-extra-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .cp-extra-row:last-child { margin-bottom: 0; }
    .cp-extra-row .f-label { font-size: 12.5px; color: var(--text-tertiary); width: 58px; flex-shrink: 0; }
    .cp-extra-row select, .cp-extra-row input { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 0 8px; font-size: 13px; background: var(--bg-white); color: var(--text); }
    .cp-extra-row select:focus, .cp-extra-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

    /* ===== 客户列表卡片 ===== */
    .cp-list { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; padding: 10px; background: var(--bg); }
    .cp-card { position: relative; background: var(--bg-white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px 12px; cursor: pointer; transition: var(--transition); }
    .cp-card:hover { border-color: var(--primary-200); box-shadow: var(--shadow-md); }
    .cp-card.active { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .cp-card .c-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
    .cp-card .c-name { font-size: 13px; line-height: 1.35; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-card .c-sub { font-size: 11.5px; line-height: 1.35; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-card .cp-status { font-size: 11px; padding: 1px 8px; flex-shrink: 0; }

    /* ===== 分页条 ===== */
    .cp-pager { display: flex; align-items: center; gap: 4px; margin-top: 0; padding: 8px; flex-shrink: 0; flex-wrap: nowrap;
      background: var(--bg-white); border-top: 1px solid var(--border-light); }
    .pg-btn { width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-white);
      color: var(--text-secondary); cursor: pointer; font-size: 13px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pg-btn:hover:not(:disabled) { border-color: var(--primary-200); color: var(--primary); }
    .pg-btn:disabled { opacity: .4; cursor: not-allowed; }
    .pg-info { font-size: 12px; color: var(--text-secondary); min-width: 34px; text-align: center; white-space: nowrap; }
    .pg-total { font-size: 11.5px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
    .pg-size { width: 68px; height: 24px; border: 1px solid var(--border); border-radius: 6px; font-size: 11.5px; padding: 0 2px;
      background: var(--bg-white); color: var(--text-secondary); flex-shrink: 0; }

    .cp-tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; border-radius: 6px;
      padding: 2px 8px; line-height: 1.6; }
    .cp-tag.type { background: var(--primary-light); color: var(--primary); }
    .cp-tag.level-S { background: #fff7ed; color: #ea580c; }
    .cp-tag.level-A { background: #fef9c3; color: #ca8a04; }
    .cp-tag.level-B { background: #e0f2fe; color: #0284c7; }
    .cp-tag.level-C { background: #f1f5f9; color: #64748b; }
    .cp-tag.city { background: var(--bg); color: var(--text-secondary); font-weight: 500; }
    .cp-status { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; border-radius: 20px; padding: 2px 10px; }
    .cp-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
    .cp-status.已合作 { background: var(--success-light); color: var(--success-hover); }
    .cp-status.已合作::before { background: var(--success); }
    .cp-status.洽谈 { background: var(--warning-light); color: var(--warning-hover); }
    .cp-status.洽谈::before { background: var(--warning); }
    .cp-status.暂停 { background: var(--danger-light); color: var(--danger-hover); }
    .cp-status.暂停::before { background: var(--danger); }

    /* ===== 客户详情 ===== */
    .cp-detail { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px 22px; box-shadow: var(--shadow-sm); }
    .cp-detail-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; padding-bottom: 14px;
      border-bottom: 1px solid var(--border-light); margin-bottom: 16px; }
    .cp-detail-head .d-title { font-size: 18px; font-weight: 800; color: var(--text); }
    .cp-summary-line { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .cp-summary-line b { color: var(--text); font-weight: 600; }
    .cp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .cp-chip { font-size: 12px; color: var(--text-secondary); background: var(--bg); border-radius: 6px; padding: 2px 8px; }

    .cp-section { margin-bottom: 18px; }
    .cp-section-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;
      color: var(--text); margin-bottom: 10px; }
    .cp-section-title::before { content: ''; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }
    .cp-section-title .hint { font-size: 12px; font-weight: 400; color: var(--text-muted); }
    .cp-kv { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .cp-kv-cell { padding: 8px 12px; border-bottom: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 2px; }
    .cp-kv-cell:nth-last-child(-n+2) { border-bottom: none; }
    .cp-kv-cell .kv-label { font-size: 11.5px; color: var(--text-muted); }
    .cp-kv-cell .kv-value { font-size: 13px; color: var(--text); word-break: break-all; }
    .cp-kv-cell .kv-value.link { color: var(--primary); }

    /* ===== 子表 Tab ===== */
    .cp-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 6px 0 12px; }
    .cp-tab { font-size: 13.5px; color: var(--text-secondary); padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
    .cp-tab .cnt { color: var(--text-muted); font-size: 12px; margin-left: 3px; }
    .cp-tab.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); }
    .cp-table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    .cp-table { border-collapse: collapse; min-width: 100%; font-size: 12.5px; white-space: nowrap; }
    .cp-table th { background: var(--bg); color: var(--text-secondary); font-weight: 600; text-align: left;
      padding: 9px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
    .cp-table td { padding: 9px 12px; border-bottom: 1px solid var(--border-light); color: var(--text); }
    .cp-table tr:last-child td { border-bottom: none; }
    .cp-empty { padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

    /* ===== 统一配色的细滚动条 ===== */
    .cp-list::-webkit-scrollbar, .cp-right::-webkit-scrollbar { width: 6px; height: 6px; }
    .cp-list::-webkit-scrollbar-track, .cp-right::-webkit-scrollbar-track { background: transparent; }
    .cp-list::-webkit-scrollbar-thumb, .cp-right::-webkit-scrollbar-thumb { background: var(--primary-200); border-radius: 3px; }
    .cp-list::-webkit-scrollbar-thumb:hover, .cp-right::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    .cp-table-scroll::-webkit-scrollbar { height: 6px; }
    .cp-table-scroll::-webkit-scrollbar-track { background: transparent; }
    .cp-table-scroll::-webkit-scrollbar-thumb { background: var(--primary-200); border-radius: 3px; }

    @media (max-width: 900px) {
      .cp-kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .cp-kpi:nth-child(3n) { border-right: none; }
      .cp-kpi { border-bottom: 1px solid var(--border-light); }
      .cp-kv { grid-template-columns: 1fr; }
      .cp-kv-cell:nth-last-child(-n+2) { border-bottom: 1px solid var(--border-light); }
      .cp-kv-cell:last-child { border-bottom: none; }
    }

    /* 仅窄屏（真移动端）才堆叠；常规工作台宽度保持左列表右详情 */
    @media (max-width: 560px) {
      body { overflow: auto; display: block; }
      .page-container { display: block; }
      .cp-body { flex-direction: column; height: auto; }
      .cp-left { flex: 1 1 auto; width: 100%; min-width: 0; height: auto; }
      .cp-list { flex: none; max-height: 46vh; }
      .cp-right { width: 100%; height: auto; overflow: visible; }
    }
  </style>
</head>
<body>
<div class="page-container">
  <div id="toastContainer" class="toast-container"></div>

  <script src="../../js/auth.js"></script>
  <script>
    if (!Auth.requireAuth()) { /* 已跳转登录页 */ }
    if (window.parent) {
      window.parent.postMessage({ type: 'breadcrumb', text: '分销枢纽 <span>/</span> 运营视角 <span>/</span> 客户档案库' }, '*');
    }
  </script>

  <!-- 顶部标题栏 -->
  <div class="cp-topbar">
    <div class="cp-logo">档</div>
    <div class="cp-title">客户档案库</div>
  </div>

  <!-- KPI -->
  <div class="cp-kpi-grid" id="kpiGrid"></div>

  <!-- 顶部品牌视角筛选 -->
  <div class="cp-topfilter" id="brandPills"></div>

  <!-- 主从分栏：左侧查询+列表 / 右侧详情 -->
  <div class="cp-body">
    <div class="cp-left">
      <div class="cp-filter">
        <div class="cp-filter-row">
          <input type="text" class="cp-search" id="searchInput" placeholder="客户编码 / 客户名称"
                 onkeydown="if(event.key==='Enter'){doSearch();}">
          <button type="button" class="btn btn-primary cp-search-btn" onclick="doSearch()">查询</button>
          <button type="button" class="cp-more-btn" id="moreBtn" title="更多查询条件" onclick="toggleMore()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="cp-extra" id="extraFilters">
          <div class="cp-extra-row">
            <span class="f-label">客户类型</span>
            <select id="fType">
              <option value="">全部</option>
              <option value="DP">DP</option>
              <option value="KOC">KOC</option>
              <option value="KOL">KOL</option>
              <option value="MCN">MCN</option>
            </select>
          </div>
          <div class="cp-extra-row">
            <span class="f-label">合作状态</span>
            <select id="fStatus">
              <option value="">全部</option>
              <option value="已合作">已合作</option>
              <option value="洽谈">洽谈</option>
              <option value="暂停">暂停</option>
            </select>
          </div>
          <div class="cp-extra-row">
            <span class="f-label">客户等级</span>
            <select id="fLevel">
              <option value="">全部</option>
              <option value="S">S级</option>
              <option value="A">A级</option>
              <option value="B">B级</option>
              <option value="C">C级</option>
            </select>
          </div>
          <div class="cp-extra-row">
            <span class="f-label">城市</span>
            <input type="text" id="fCity" placeholder="按城市模糊查询">
          </div>
          <div class="cp-extra-row">
            <span class="f-label">归属商务</span>
            <input type="text" id="fBd" placeholder="按归属商务模糊查询">
          </div>
        </div>
      </div>
      <div class="cp-list" id="customerList"></div>
      <div class="cp-pager">
        <button type="button" class="pg-btn" id="pagerPrev" onclick="gotoPage(-1)" title="上一页">‹</button>
        <span class="pg-info" id="pagerInfo">1 / 1</span>
        <button type="button" class="pg-btn" id="pagerNext" onclick="gotoPage(1)" title="下一页">›</button>
        <span class="pg-total" id="pagerTotal">共 0 条</span>
        <select class="pg-size" id="pageSize" onchange="setPageSize(this.value)">
          <option value="5">5条/页</option>
          <option value="10" selected>10条/页</option>
          <option value="20">20条/页</option>
        </select>
      </div>
    </div>

    <!-- 右侧：客户详情 -->
    <div class="cp-right">
      <div class="cp-detail" id="customerDetail"></div>
    </div>
  </div>
</div>

<script src="../../js/recruit/customer-profile-data.js"></script>
<script>
var BRANDS = ['全部', '巴拉巴拉', '迷你巴拉', '森马', '马卡乐'];

// 纯查询浏览页：数据直接取种子，不落 localStorage
var profiles = JSON.parse(JSON.stringify(window.CUSTOMER_PROFILE_SEED));
var state = {
  selectedId: profiles.length ? profiles[0].id : null,
  brand: '全部',
  query: { kw: '', type: '', status: '', level: '', city: '', bd: '' }, // 已应用的查询条件
  activeTab: '账号子表',
  page: 1,
  pageSize: 10
};

function esc(s) { if (s === null || s === undefined) return ''; var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function byId(id) { for (var i = 0; i < profiles.length; i++) if (profiles[i].id === id) return profiles[i]; return null; }
function findField(p, label) {
  var secs = p.sections;
  for (var i = 0; i < secs.length; i++) for (var j = 0; j < secs[i].fields.length; j++)
    if (secs[i].fields[j].label === label) return secs[i].fields[j].value;
  return '';
}

// ===== 筛选（品牌视角即时生效；左侧条件点「查询」生效） =====
function contains(hay, needle) {
  hay = String(hay || '').toLowerCase();
  needle = String(needle || '').trim().toLowerCase();
  return !needle || hay.indexOf(needle) >= 0;
}
function filtered() {
  var q = state.query;
  return profiles.filter(function (p) {
    if (state.brand !== '全部') {
      var hit = (p.brandLines || []).some(function (b) { return b.indexOf(state.brand) >= 0 || state.brand.indexOf(b) >= 0; });
      if (!hit && String(p.name).indexOf(state.brand) < 0) return false;
    }
    if (q.kw) {
      // 客户编码 / 客户名称 模糊查询
      var hay = (p.code + ' ' + p.name).toLowerCase();
      if (hay.indexOf(q.kw.trim().toLowerCase()) < 0) return false;
    }
    if (q.type && p.type !== q.type) return false;
    if (q.status && p.status !== q.status) return false;
    if (q.level && p.level !== q.level) return false;
    if (!contains(p.city, q.city)) return false;
    if (!contains(findField(p, '归属商务'), q.bd)) return false;
    return true;
  });
}

// ===== 查询交互 =====
function doSearch() {
  state.query = {
    kw: document.getElementById('searchInput').value,
    type: document.getElementById('fType').value,
    status: document.getElementById('fStatus').value,
    level: document.getElementById('fLevel').value,
    city: document.getElementById('fCity').value,
    bd: document.getElementById('fBd').value
  };
  state.page = 1;
  refresh();
  showToast('查询完成，共 ' + filtered().length + ' 条', 'info');
}
function toggleMore() {
  var extra = document.getElementById('extraFilters');
  var btn = document.getElementById('moreBtn');
  var open = !extra.classList.contains('open');
  extra.classList.toggle('open', open);
  btn.classList.toggle('open', open);
}

// ===== KPI =====
function renderKPI(list) {
  var total = list.length;
  var coop = list.filter(function (p) { return p.status === '已合作'; }).length;
  var talking = list.filter(function (p) { return p.status === '洽谈'; }).length;
  var sa = list.filter(function (p) { return p.level === 'S' || p.level === 'A'; }).length;
  var expiring = list.filter(function (p) { return p.flags && p.flags.expiringSoon; }).length;
  var risk = list.filter(function (p) { return p.flags && p.flags.risk; }).length;
  var cards = [
    { l: '客户总数', v: total, s: '达人+分销合计' },
    { l: '已合作', v: coop, s: '状态=已合作', accent: true },
    { l: '洽谈中', v: talking, s: '状态=洽谈' },
    { l: 'S/A 级客户', v: sa, s: '核心客户池' },
    { l: '到期提醒', v: expiring, s: '合同/授权 90 天内', warn: true },
    { l: '风险客户', v: risk, s: '命中风控标记', warn: true }
  ];
  document.getElementById('kpiGrid').innerHTML = cards.map(function (c) {
    var cls = c.accent ? 'accent' : (c.warn && c.v > 0 ? 'warn' : '');
    return '<div class="cp-kpi"><div class="k-label">' + c.l + '</div>' +
      '<div class="k-value ' + cls + '">' + c.v + '</div>' +
      '<div class="k-sub">' + c.s + '</div></div>';
  }).join('');
}

// ===== 顶部品牌视角 pills =====
function renderBrandPills() {
  document.getElementById('brandPills').innerHTML =
    '<span class="row-label">品牌视角</span>' + BRANDS.map(function (b) {
      return '<span class="cp-pill' + (state.brand === b ? ' active' : '') + '" onclick="setBrand(\'' + b + '\')">' + b + '</span>';
    }).join('');
}
function setBrand(b) { state.brand = b; state.page = 1; renderBrandPills(); refresh(); }

// ===== 客户列表 =====
function statusTag(s) { return '<span class="cp-status ' + s + '">' + s + '</span>'; }
function renderList(list) {
  var totalPages = Math.max(1, Math.ceil(list.length / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  var start = (state.page - 1) * state.pageSize;
  var pageItems = list.slice(start, start + state.pageSize);
  // 选中项不在当前页时，定位到本页第一条
  if (!pageItems.some(function (p) { return p.id === state.selectedId; })) {
    state.selectedId = pageItems.length ? pageItems[0].id : null;
  }
  var el = document.getElementById('customerList');
  if (!list.length) {
    el.innerHTML = '<div class="cp-empty">没有匹配的客户</div>';
  } else {
    el.innerHTML = pageItems.map(function (p) {
      return '<div class="cp-card' + (p.id === state.selectedId ? ' active' : '') + '" onclick="selectCustomer(' + p.id + ')">' +
        '<div class="c-top"><span class="c-name">' + esc(p.name) + '</span>' + statusTag(p.status) + '</div>' +
        '<div class="c-sub">' + esc(p.code) + ' · ' + esc(p.type) + ' · ' + esc(p.level) + '级 · ' + esc(p.city) + '</div>' +
        '</div>';
    }).join('');
  }
  renderPager(list.length, totalPages);
  renderDetail();
}
function renderPager(total, totalPages) {
  document.getElementById('pagerInfo').textContent = state.page + ' / ' + totalPages;
  document.getElementById('pagerTotal').textContent = '共 ' + total + ' 条';
  document.getElementById('pagerPrev').disabled = state.page <= 1;
  document.getElementById('pagerNext').disabled = state.page >= totalPages;
}
function gotoPage(d) { state.page += d; refresh(); }
function setPageSize(v) { state.pageSize = +v; state.page = 1; refresh(); }
function selectCustomer(id) { state.selectedId = id; refresh(); }

// ===== 详情 =====
function renderDetail() {
  var p = byId(state.selectedId);
  var el = document.getElementById('customerDetail');
  if (!p) { el.innerHTML = '<div class="cp-empty">请选择左侧客户查看详情</div>'; return; }
  var html = '';
  // 头部
  html += '<div class="cp-detail-head">' +
    '<div><div class="d-title">' + esc(p.name) + '</div>' +
    '<div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
      '<span class="cp-tag type" style="background:var(--bg);color:var(--text-secondary);">' + esc(p.code) + '</span>' +
      '<span class="cp-tag type">' + esc(p.type) + '</span>' +
      '<span class="cp-tag level-' + esc(p.level) + '">' + esc(p.level) + '级</span>' +
      statusTag(p.status) +
    '</div></div></div>';
  // 摘要行
  html += '<div class="cp-summary-line">联系人：<b>' + esc(findField(p, '联系人')) + ' ' + esc(findField(p, '联系手机')) +
    '</b>&nbsp;&nbsp;' + esc(p.city) + '&nbsp;&nbsp; 归属商务：<b>' + esc(findField(p, '归属商务')) +
    '</b>&nbsp;&nbsp; 建档：<b>' + esc(findField(p, '建档日期')) + '</b></div>';
  // 标签 chips
  html += '<div class="cp-chips" style="margin-bottom:18px;">' + (p.brandLines || []).concat(p.tags || []).map(function (t) {
    return '<span class="cp-chip">' + esc(t) + '</span>';
  }).join('') + '</div>';

  // 四个键值分区
  p.sections.forEach(function (sec) {
    html += '<div class="cp-section"><div class="cp-section-title">' + esc(sec.title) +
      (sec.hint ? '<span class="hint">' + esc(sec.hint) + '</span>' : '') + '</div>';
    html += '<div class="cp-kv">';
    sec.fields.forEach(function (f) {
      var linkCls = (f.label === '客户编号') ? ' link' : '';
      html += '<div class="cp-kv-cell">' +
        '<span class="kv-label">' + esc(f.label) + '</span>' +
        '<span class="kv-value' + linkCls + '">' + esc(f.value || '—') + '</span>' +
        '</div>';
    });
    html += '</div></div>';
  });

  // 子表 Tab
  var tabNames = ['账号子表', '跟进记录', '回款订单', '资质附件'];
  html += '<div class="cp-tabs">' + tabNames.map(function (t) {
    var cnt = p.tables[t] ? p.tables[t].rows.length : 0;
    return '<div class="cp-tab' + (state.activeTab === t ? ' active' : '') + '" onclick="setTab(\'' + t + '\')">' +
      t + '<span class="cnt">' + cnt + '</span></div>';
  }).join('') + '</div>';
  html += '<div id="tabBody">' + renderTable(p) + '</div>';

  el.innerHTML = html;
}
function setTab(t) { state.activeTab = t; renderDetail(); }

function renderTable(p) {
  var tb = p.tables[state.activeTab];
  if (!tb || !tb.rows.length) return '<div class="cp-table-scroll"><div class="cp-empty">暂无记录</div></div>';
  var head = '<tr>' + tb.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
  var body = tb.rows.map(function (row) {
    return '<tr>' + row.map(function (cell) {
      return '<td>' + esc(cell || '') + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return '<div class="cp-table-scroll"><table class="cp-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

// ===== 主渲染 =====
function refresh() { var list = filtered(); renderKPI(list); renderList(list); }
function render() { renderBrandPills(); refresh(); }

// Toast
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function () {
    if (toast.parentNode) { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s';
      setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300); }
  }, 2500);
}

render();
</script>
</body>
</html>
