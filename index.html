<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容电商AI工作台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== 系统内多页签 ===== */
    .tab-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 28px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      background: #fff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15,23,42,0.05);
      position: relative;
      z-index: 9;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px 6px 14px;
      background: #f1f5f9;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
      user-select: none;
      flex-shrink: 0;
    }
    .tab-item:hover { background: #e8edf6; color: var(--primary); }
    .tab-item.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(91,108,245,.25);
    }
    .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px; height: 18px;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      color: var(--text-tertiary);
      transition: all .15s;
    }
    .tab-close:hover { background: #fee2e2; color: #dc2626; }
    .tab-item.active .tab-close { color: rgba(255,255,255,0.75); }
    .tab-item.active .tab-close:hover { background: rgba(255,255,255,0.25); color: #fff; }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- ========== 顶部导航栏 ========== -->
    <header class="topnav">
      <div class="topnav-left">
        <div class="topnav-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16.3 4.2c.7 2.1 1.9 3.6 3.7 4.4v3.8a8.8 8.8 0 0 1-3.5-.9v4.9a6.2 6.2 0 1 1-6.2-6.2c.4 0 .8 0 1.2.1v3.9c-.4-.2-.8-.3-1.2-.3a2.4 2.4 0 1 0 2.4 2.4V4.2h3.6Z" fill="#fff"/></svg>
          </div>
          <span class="brand-name">内容电商AI工作台</span>
        </div>
        <div class="topnav-divider"></div>
        <nav class="topnav-menu" id="topnavMenu">
          <a class="topnav-item active" data-key="guide" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>店铺引擎</span>
            <svg class="chevron-down" viewBox="0 0 24 24" width="12" height="12"><path d="m6 9 6 6 6-6"/></svg>
          </a>
        </nav>
      </div>
      <div class="topnav-right">
        <div class="topnav-search">
          <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="输入内容查询" id="globalSearch">
        </div>
        <button class="topnav-icon-btn" title="通知">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notify-dot"></span>
        </button>
        <div class="topnav-user">
          <div class="user-avatar">U</div>
          <span class="user-name">管理员</span>
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
    </header>

    <!-- ========== 下方主体区 ========== -->
    <div class="app-body">

      <!-- 左侧菜单 -->
      <aside class="sidebar" id="sidebar">
        <a class="sidebar-item active" data-page="pages/guide/list.html" onclick="switchSidebar(this)">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>开店指南</span>
        </a>
        <a class="sidebar-item" data-page="pages/phone/list.html" onclick="switchSidebar(this)">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span>电话号码申请</span>
        </a>
        <a class="sidebar-item" data-page="pages/auth/list.html" onclick="switchSidebar(this)">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>平台店铺授权书</span>
        </a>
        <div class="sidebar-parent" onclick="toggleSubmenu(this)">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span>包装优化</span>
          <svg class="arrow" viewBox="0 0 24 24" width="12" height="12"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="sidebar-children">
          <a class="sidebar-item sidebar-child" data-page="pages/package/list.html" onclick="switchSidebar(this)">
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>详情页属性优化</span>
          </a>
          <a class="sidebar-item sidebar-child" data-page="pages/package/size-params.html" onclick="switchSidebar(this)">
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <span>批量配置任务</span>
          </a>
        </div>
        <div class="sidebar-parent" onclick="toggleSubmenu(this)">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"/><polyline points="9 14 12 17 15 14"/><line x1="12" y1="10" x2="12" y2="17"/></svg>
          <span>草稿</span>
          <svg class="arrow" viewBox="0 0 24 24" width="12" height="12"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="sidebar-children">
          <a class="sidebar-item sidebar-child" data-page="pages/license/list.html" onclick="switchSidebar(this)">
            <svg viewBox="0 0 24 24" width="17" height="17"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span>营业执照申请</span>
          </a>
          <a class="sidebar-item sidebar-child" data-page="pages/legal/list.html" onclick="switchSidebar(this)">
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>法人证件申请</span>
          </a>
          <a class="sidebar-item sidebar-child" data-page="pages/seal/list.html" onclick="switchSidebar(this)">
            <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg>
            <span>公章使用申请</span>
          </a>
        </div>
      </aside>

      <!-- 右侧主内容区 -->
      <main class="main-area">
        <div class="main-header">
          <div class="breadcrumb" id="breadcrumb">开店指南</div>
        </div>
        <div class="tab-bar" id="tabBar"></div>
        <div class="main-content" id="mainContent"></div>
      </main>

    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ===== 多页签管理 =====
    var tabs = [];
    var activeTabId = null;
    var tabSeq = 0;

    function findTab(id) {
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === id) return tabs[i]; }
      return null;
    }

    function buildFrameSrc(page) {
      return page + (page.indexOf('?') > -1 ? '&' : '?') + 'v=' + Date.now();
    }

    function createTab(opts) {
      var id = 'tab_' + (++tabSeq);
      var iframe = document.createElement('iframe');
      iframe.className = 'tab-frame fade-in';
      iframe.src = buildFrameSrc(opts.page);
      iframe.style.display = 'none';
      document.getElementById('mainContent').appendChild(iframe);
      var tab = { id: id, title: opts.title, page: opts.page, iframe: iframe, closable: opts.closable !== false };
      tabs.push(tab);
      if (opts.activate !== false) activateTab(id); else renderTabBar();
      return tab;
    }

    function activateTab(id) {
      activeTabId = id;
      tabs.forEach(function(t) { t.iframe.style.display = (t.id === id) ? 'block' : 'none'; });
      renderTabBar();
      var t = findTab(id);
      if (t) document.getElementById('breadcrumb').innerHTML = t.title;
    }

    function closeTab(id) {
      var idx = -1;
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === id) { idx = i; break; } }
      if (idx === -1) return;
      var tab = tabs[idx];
      if (!tab.closable) return;
      tab.iframe.parentNode.removeChild(tab.iframe);
      tabs.splice(idx, 1);
      if (activeTabId === id) {
        var next = tabs[idx] || tabs[idx - 1];
        if (next) activateTab(next.id);
      } else {
        renderTabBar();
      }
    }

    function renderTabBar() {
      var bar = document.getElementById('tabBar');
      bar.innerHTML = '';
      tabs.forEach(function(t) {
        var el = document.createElement('div');
        el.className = 'tab-item' + (t.id === activeTabId ? ' active' : '');
        el.onclick = (function(id) { return function() { activateTab(id); }; })(t.id);
        var titleSpan = document.createElement('span');
        titleSpan.textContent = t.title;
        el.appendChild(titleSpan);
        if (t.closable) {
          var closeBtn = document.createElement('span');
          closeBtn.className = 'tab-close';
          closeBtn.innerHTML = '&times;';
          closeBtn.onclick = (function(id) { return function(e) { e.stopPropagation(); closeTab(id); }; })(t.id);
          el.appendChild(closeBtn);
        }
        bar.appendChild(el);
      });
    }

    // 打开页签（同地址页签已存在则复用并激活）
    function openTab(page, title) {
      for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].page === page) { activateTab(tabs[i].id); return; }
      }
      createTab({ title: title, page: page, closable: true, activate: true });
    }

    // ===== 展开/收起侧边栏二级菜单 =====
    function toggleSubmenu(el) {
      el.classList.toggle('open');
    }

    // ===== 点击店铺引擎切换左侧菜单 =====
    function toggleSidebar() {
      var body = document.querySelector('.app-body');
      var btn = document.querySelector('.topnav-item[data-key="guide"]');
      body.classList.toggle('sidebar-hidden');
      btn.classList.toggle('sidebar-open');
    }

    // ===== 左侧菜单切换（以页签方式打开） =====
    function switchSidebar(el) {
      document.querySelectorAll('.sidebar-item').forEach(function(i) { i.classList.remove('active'); });
      el.classList.add('active');
      var page = el.getAttribute('data-page');
      var title = el.querySelector('span').textContent.trim();
      openTab(page, title);
    }

    // ===== 监听 iframe postMessage =====
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;

      // 更新面包屑（仅当前激活页签的子页面）
      if (e.data.type === 'breadcrumb') {
        var active = findTab(activeTabId);
        if (active && active.iframe.contentWindow === e.source) {
          document.getElementById('breadcrumb').innerHTML = e.data.text;
        }
        return;
      }

      // 子页面请求打开新页签
      if (e.data.type === 'openTab') {
        openTab(e.data.page, e.data.title || '新页签');
        return;
      }

      // 子页面请求关闭所在页签
      if (e.data.type === 'closeTab') {
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].iframe.contentWindow === e.source) { closeTab(tabs[i].id); break; }
        }
        return;
      }

      // 智能体卡片跳转（兼容旧逻辑，以页签打开）
      if (e.data.type === 'navigate') {
        openTab(e.data.page, e.data.title || '详情');
        return;
      }
    });

    // ===== 初始化：创建首页页签 =====
    createTab({ title: '首页', page: 'pages/guide/list.html', closable: false, activate: true });
  </script>
</body>
</html>
