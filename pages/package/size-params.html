<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能体中心</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* ===== 智能体中心三栏布局 ===== */
    .agent-hub {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-light, #f5f7fb);
    }

    /* ===== 左侧：智能体卡片列表 ===== */
    .agent-sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--border-light, #eef0f5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .agent-sidebar-header {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border-light, #eef0f5);
    }
    .agent-sidebar-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text, #1a1d2e);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .agent-sidebar-header h3 svg { color: var(--primary, #5b6cf5); }
    .agent-sidebar-header p {
      font-size: 12px;
      color: var(--text-muted, #a0a5b8);
      margin: 6px 0 0;
    }
    .agent-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .agent-list::-webkit-scrollbar { width: 0; }

    .agent-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background: var(--bg-hover, #f8f9fc);
      cursor: pointer;
      transition: all 0.22s ease;
      position: relative;
    }
    .agent-card:hover {
      background: linear-gradient(135deg, #eef0ff 0%, #f8f9fc 100%);
      border-color: rgba(91, 108, 245, 0.15);
      transform: translateX(2px);
    }
    .agent-card.active {
      background: linear-gradient(135deg, #eef0ff 0%, #e8ebff 100%);
      border-color: var(--primary, #5b6cf5);
      box-shadow: 0 4px 16px rgba(91, 108, 245, 0.12);
    }
    .agent-card.active::after {
      content: '';
      position: absolute;
      right: -1px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
      background: var(--primary, #5b6cf5);
      border-radius: 3px 0 0 3px;
    }
    .agent-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .agent-card-icon.c1 { background: linear-gradient(135deg, #5b6cf5, #8b5cf6); }
    .agent-card-icon.c2 { background: linear-gradient(135deg, #10b981, #06b6d4); }
    .agent-card-icon.c5 { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
    .agent-card-icon.c6 { background: linear-gradient(135deg, #f97316, #eab308); }
    .agent-card-body { flex: 1; min-width: 0; }
    .agent-card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text, #1a1d2e);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agent-card-desc {
      font-size: 11px;
      color: var(--text-muted, #a0a5b8);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .agent-card-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(91, 108, 245, 0.1);
      color: var(--primary, #5b6cf5);
      font-weight: 500;
    }

    /* ===== 中间：智能体描述与流程说明 ===== */
    .agent-info {
      width: 340px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--border-light, #eef0f5);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 28px 24px;
    }
    .agent-info::-webkit-scrollbar { width: 0; }

    .agent-info-hero {
      text-align: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-light, #eef0f5);
      margin-bottom: 24px;
    }
    .agent-info-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #fff;
      box-shadow: 0 6px 24px rgba(91, 108, 245, 0.25);
      animation: iconFloat 3s ease-in-out infinite;
    }
    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .agent-info-hero h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text, #1a1d2e);
      margin: 0 0 8px;
    }
    .agent-info-hero p {
      font-size: 13px;
      color: var(--text-secondary, #5a5f7a);
      line-height: 1.7;
      margin: 0;
    }

    .agent-info-section {
      margin-bottom: 24px;
    }
    .agent-info-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted, #a0a5b8);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-info-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-light, #eef0f5);
    }

    /* 能力标签 */
    .agent-capabilities {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .agent-cap-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--bg-hover, #f8f9fc);
      color: var(--text-secondary, #5a5f7a);
      border: 1px solid var(--border-light, #eef0f5);
    }
    .agent-cap-tag svg { flex-shrink: 0; }

    /* 流程步骤 */
    .agent-flow-steps {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .agent-flow-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
      padding-bottom: 20px;
    }
    .agent-flow-step:last-child { padding-bottom: 0; }
    .agent-flow-step::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 1.5px;
      background: var(--border-light, #eef0f5);
    }
    .agent-flow-step:last-child::before { display: none; }
    .agent-flow-step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
    }
    .agent-flow-step:nth-child(1) .agent-flow-step-num { background: linear-gradient(135deg, #5b6cf5, #8b5cf6); }
    .agent-flow-step:nth-child(2) .agent-flow-step-num { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
    .agent-flow-step:nth-child(3) .agent-flow-step-num { background: linear-gradient(135deg, #10b981, #06b6d4); }
    .agent-flow-step-body { flex: 1; padding-top: 4px; }
    .agent-flow-step-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text, #1a1d2e);
      margin-bottom: 3px;
    }
    .agent-flow-step-desc {
      font-size: 12px;
      color: var(--text-muted, #a0a5b8);
      line-height: 1.6;
    }

    /* 开始对话按钮 */
    .agent-start-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary, #5b6cf5) 0%, #8b5cf6 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(91, 108, 245, 0.25);
      margin-top: 8px;
    }
    .agent-start-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(91, 108, 245, 0.35);
    }

    /* ===== 右侧：对话区 ===== */
    .agent-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: linear-gradient(180deg, rgba(91,108,245,0.02) 0%, rgba(255,255,255,0) 30%);
    }
    .agent-chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-light, #eef0f5);
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .agent-chat-header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success, #10b981);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
    }
    .agent-chat-header-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text, #1a1d2e);
    }
    .agent-chat-header-sub {
      font-size: 12px;
      color: var(--text-muted, #a0a5b8);
      margin-left: auto;
    }

    /* ===== 对话记录区 ===== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .chat-messages::-webkit-scrollbar { width: 0; }

    /* ===== 消息气泡 ===== */
    .msg-row { display: flex; gap: 12px; max-width: 80%; animation: msgIn 0.3s ease; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.assistant { align-self: flex-start; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; flex-shrink: 0;
    }
    .msg-row.user .msg-avatar {
      background: linear-gradient(135deg, var(--primary, #5b6cf5) 0%, #8b5cf6 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(91,108,245,0.3);
    }
    .msg-row.assistant .msg-avatar {
      background: linear-gradient(135deg, var(--success, #10b981) 0%, #06b6d4 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(16,185,129,0.3);
    }
    .msg-content { display: flex; flex-direction: column; }
    .msg-row.user .msg-content { align-items: flex-end; }
    .msg-row.assistant .msg-content { align-items: flex-start; }
    .msg-time {
      font-size: 11px; color: var(--text-muted, #a0a5b8);
      margin-top: 4px; padding: 0 4px;
    }
    .msg-bubble {
      padding: 11px 15px;
      border-radius: var(--radius-lg, 12px);
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }
    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, var(--primary, #5b6cf5) 0%, #7c6cf7 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 12px rgba(91,108,245,0.15);
    }
    .msg-row.assistant .msg-bubble {
      background: #fff;
      color: var(--text, #1a1d2e);
      border: 1px solid var(--border, #e2e5f0);
      border-left: 3px solid var(--success, #10b981);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* ===== 执行结果卡片 ===== */
    .result-card {
      margin-top: 10px;
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
      border: 1px solid #a7f3d0;
      border-left: 3px solid var(--success, #10b981);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #065f46;
    }
    .result-card .result-title {
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-card .result-title svg { flex-shrink: 0; }
    .result-card pre {
      margin: 0;
      white-space: pre-wrap;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #065f46;
    }

    /* ===== 加载动画 ===== */
    .typing-indicator { display: flex; gap: 5px; padding: 8px 0; }
    .typing-indicator span {
      width: 7px; height: 7px; border-radius: 50%;
      animation: typing 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(1) { background: var(--primary, #5b6cf5); animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { background: #8b5cf6; animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { background: var(--success, #10b981); animation-delay: 0.4s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ===== 输入区域 ===== */
    .chat-input-area {
      padding: 14px 20px 20px;
      border-top: 1px solid var(--border-light, #eef0f5);
      background: rgba(255,255,255,0.9);
    }
    .chat-input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #fff;
      border: 1.5px solid var(--border, #e2e5f0);
      border-radius: 12px;
      padding: 10px 14px;
      transition: all 0.25s ease;
    }
    .chat-input-wrapper:focus-within {
      border-color: var(--primary, #5b6cf5);
      box-shadow: 0 0 0 3px rgba(91, 108, 245, 0.08), 0 4px 16px rgba(91,108,245,0.08);
    }
    .chat-input-wrapper textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 14px;
      line-height: 1.5;
      font-family: inherit;
      color: var(--text, #1a1d2e);
      background: transparent;
      min-height: 22px;
      max-height: 120px;
    }
    .chat-input-wrapper textarea::placeholder { color: var(--text-muted, #a0a5b8); }
    .chat-send-btn {
      width: 34px; height: 34px;
      border: none; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary, #5b6cf5) 0%, #8b5cf6 100%);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(91,108,245,0.25);
    }
    .chat-send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(91,108,245,0.35);
    }
    .chat-send-btn:disabled { background: var(--text-disabled, #d0d3e0); cursor: not-allowed; box-shadow: none; transform: none; }
    .chat-attach-btn {
      width: 34px; height: 34px;
      border: none; border-radius: 50%;
      background: var(--bg-hover, #f8f9fc);
      color: var(--text-secondary, #5a5f7a);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }
    .chat-attach-btn:hover {
      background: linear-gradient(135deg, #eef0ff 0%, #f5f3ff 100%);
      color: var(--primary, #5b6cf5);
      transform: rotate(-15deg);
    }

    /* ===== 文件预览 ===== */
    .file-preview-bar { display: none; flex-wrap: wrap; gap: 8px; padding: 0 0 10px; }
    .file-preview-bar.has-files { display: flex; }
    .file-tag {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      background: var(--primary-50, #eef0ff);
      border: 1px solid var(--primary-100, #d4d9fc);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-secondary, #5a5f7a);
      max-width: 200px;
    }
    .file-tag svg { flex-shrink: 0; color: var(--primary, #5b6cf5); }
    .file-tag-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-tag-size { color: var(--text-muted, #a0a5b8); flex-shrink: 0; }
    .file-tag-remove {
      width: 16px; height: 16px;
      border: none; background: transparent;
      color: var(--text-muted, #a0a5b8); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; flex-shrink: 0;
      transition: all 0.15s;
    }
    .file-tag-remove:hover { background: var(--danger-light, #fef2f2); color: var(--danger, #ef4444); }

    /* ===== 消息中的文件 ===== */
    .msg-files { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .msg-file-tag {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .msg-row.user .msg-file-tag { background: rgba(255,255,255,0.18); color: #fff; }
    .msg-row.assistant .msg-file-tag { background: var(--bg-hover, #f8f9fc); color: var(--text-secondary, #5a5f7a); border: 1px solid var(--border, #e2e5f0); }
    .msg-file-tag svg { flex-shrink: 0; }

    /* ===== 欢迎区（对话内） ===== */
    .chat-welcome {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .chat-welcome-icon {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary, #5b6cf5) 0%, #8b5cf6 50%, #06b6d4 100%);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(91,108,245,0.3);
      animation: iconFloat 3s ease-in-out infinite;
    }
    .chat-welcome-icon svg { stroke: #fff; }
    .chat-welcome h2 {
      font-size: 20px; font-weight: 700;
      color: var(--text, #1a1d2e); margin-bottom: 8px;
    }
    .chat-welcome p {
      font-size: 13px; color: var(--text-secondary, #5a5f7a);
      max-width: 400px; margin: 0 auto; line-height: 1.7;
    }
    .chat-quick-prompts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }
    .chat-quick-prompt {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border, #e2e5f0);
      background: #fff;
      font-size: 12px;
      color: var(--text-secondary, #5a5f7a);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chat-quick-prompt:hover {
      border-color: var(--primary, #5b6cf5);
      color: var(--primary, #5b6cf5);
      background: var(--primary-50, #eef0ff);
    }
  </style>
</head>
<body>
  <div class="agent-hub">

    <!-- ===== 左侧：智能体卡片列表 ===== -->
    <div class="agent-sidebar">
      <div class="agent-sidebar-header">
        <h3>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 1 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 1-1.82-.33 1.65 1.65 0 0 1-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 1 9 19.4a1.65 1.65 0 0 1-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 1 4.68 15a1.65 1.65 0 0 1-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 1 4.6 9a1.65 1.65 0 0 1-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 1 9 4.68 1.65 1.65 0 0 1 10 3.17V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 1 1 1.51 1.65 1.65 0 0 1 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 1 19.4 9a1.65 1.65 0 0 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 1-1.51 1z"/></svg>
          智能体中心
        </h3>
        <p>选择一个智能体开始使用</p>
      </div>
      <div class="agent-list" id="agentList">
        <!-- 卡片1：设置尺码参数智能体 -->
        <div class="agent-card active" data-agent="detail-opt" onclick="selectAgent(this)">
          <div class="agent-card-icon c1">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          </div>
          <div class="agent-card-body">
            <div class="agent-card-name">设置尺码参数智能体</div>

  <script>
    // ===== 智能体配置数据 =====
    var agentData = {

      },

        color: 'linear-gradient(135deg, #10b981, #06b6d4)',
        desc: '自动检测各平台商品的必填属性是否完整，快速标记缺失项，并提供一键补充建议，确保商品信息合规上架。',
        capabilities: ['属性检测', '缺失标记', '一键补充', '合规校验', '检查报告'],
        flow: [
          { label: '选择目标商品', desc: '输入商品ID或导入商品列表，确定检查范围' },
          { label: '自动属性检测', desc: '智能体逐一比对平台必填属性规则，标记缺失项' },

        ],

        placeholder: '输入商品ID或上传商品列表，开始属性检查...'
      },
      'product-recommend': {
        name: '商品推荐智能体',
        icon: 'c5',
        color: 'linear-gradient(135deg, #06b6d4, #3b82f6)',
        desc: '批量设置商品详情页中商品详情高级编辑下商品推荐组件及推荐关联商品并发布商品，支持通过对话输入或 Excel 导入方式批量操作。',
        capabilities: ['推荐组件设置', '关联商品配置', '批量发布', 'Excel导入', '结果导出'],
        flow: [
          { label: '输入店铺和平台商品ID', desc: '选择智能体，在对话框输入店铺和平台商品ID，或者添加 Excel，并说明操作类型（增加或删除推荐商品）' },
          { label: '智能体自动执行', desc: '智能体自动设置商品推荐组件及推荐关联商品并发布' },
          { label: '返回执行结果', desc: '智能体返回执行结果，含成功数、失败数等明细' }
        ],
        welcome: '批量设置商品详情页商品推荐组件及推荐关联商品并发布',
        placeholder: '输入店铺和平台商品ID，或上传Excel文件...'
      },
      'text-component': {
        name: '文本组件智能体',
        icon: 'c6',
        color: 'linear-gradient(135deg, #f97316, #eab308)',
        desc: '批量设置商品详情页中商品详情高级编辑下文本组件的编辑并自动发布，支持通过对话输入或 Excel 导入方式批量操作。',
        capabilities: ['文本组件编辑', '批量发布', 'Excel导入', '操作类型选择', '结果导出'],
        flow: [
          { label: '输入店铺和平台商品ID', desc: '选择智能体，在对话框输入店铺、平台商品ID和操作类型，或者添加 Excel' },
          { label: '智能体自动执行', desc: '智能体自动编辑文本组件并发布商品' },
          { label: '返回执行结果', desc: '智能体返回执行结果，含成功数、失败数等明细' }
        ],
        welcome: '批量设置商品详情页文本组件并自动发布',
        placeholder: '输入店铺、平台商品ID和操作类型，或上传Excel文件...'
      }
    };

    // ===== 当前选中智能体 =====
    var currentAgent = 'detail-opt';

    // ===== 切换智能体 =====
    function selectAgent(el) {
      // 更新卡片激活状态
      document.querySelectorAll('.agent-card').forEach(function(c) { c.classList.remove('active'); });
      el.classList.add('active');

      var agentId = el.getAttribute('data-agent');
      currentAgent = agentId;
      var data = agentData[agentId];

      // 更新中间信息面板
      renderAgentInfo(data);

      // 更新右侧对话区
      document.getElementById('chatHeaderTitle').textContent = data.name;
      document.getElementById('chatInput').placeholder = data.placeholder;

      // 重置对话区
      resetChat(data);
    }

    // ===== 渲染中间信息面板 =====
    function renderAgentInfo(data) {
      var info = document.getElementById('agentInfo');
      var html = '';

      // 顶部英雄区
      html += '<div class="agent-info-hero">';
      html += '  <div class="agent-info-icon" style="background:' + data.color + '">';
      html += '    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2">';
      html += '      <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>';
      html += '      <line x1="7" y1="7" x2="7.01" y2="7"/>';
      html += '    </svg>';
      html += '  </div>';
      html += '  <h2>' + escapeHtml(data.name) + '</h2>';
      html += '  <p>' + escapeHtml(data.desc) + '</p>';
      html += '</div>';

      // 能力标签
      html += '<div class="agent-info-section">';
      html += '  <div class="agent-info-section-title">核心能力</div>';
      html += '  <div class="agent-capabilities">';
      data.capabilities.forEach(function(cap) {
        html += '    <div class="agent-cap-tag">';
        html += '      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
        html += '      ' + escapeHtml(cap);
        html += '    </div>';
      });
      html += '  </div>';
      html += '</div>';

      // 流程步骤
      html += '<div class="agent-info-section">';
      html += '  <div class="agent-info-section-title">执行流程</div>';
      html += '  <div class="agent-flow-steps">';
      data.flow.forEach(function(step, i) {
        html += '  <div class="agent-flow-step">';
        html += '    <div class="agent-flow-step-num">' + (i + 1) + '</div>';
        html += '    <div class="agent-flow-step-body">';
        html += '      <div class="agent-flow-step-label">' + escapeHtml(step.label) + '</div>';
        html += '      <div class="agent-flow-step-desc">' + escapeHtml(step.desc) + '</div>';
        html += '    </div>';
        html += '  </div>';
      });
      html += '  </div>';
      html += '</div>';

      // 开始按钮
      html += '<button class="agent-start-btn" onclick="focusChatInput()">';
      html += '  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
      html += '  开始对话';
      html += '</button>';

      info.innerHTML = html;
    }

    // ===== 重置对话区 =====
    function resetChat(data) {
      var messages = document.getElementById('chatMessages');
      messages.innerHTML = '';
      chatHistory = [];
      pendingFiles = [];
      renderFilePreview();

      var welcome = document.createElement('div');
      welcome.className = 'chat-welcome';
      welcome.id = 'chatWelcome';
      welcome.innerHTML = '<div class="chat-welcome-icon" style="background:' + data.color + '">'
        + '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2">'
        + '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>'
        + '<line x1="7" y1="7" x2="7.01" y2="7"/>'
        + '</svg></div>'
        + '<h2>' + escapeHtml(data.name) + '</h2>'
        + '<p>' + escapeHtml(data.welcome) + '</p>';
      messages.appendChild(welcome);
    }

    // ===== 聚焦输入框 =====
    function focusChatInput() {
      document.getElementById('chatInput').focus();
    }

    // ===== 对话记录存储 =====
    var chatHistory = [];
    var pendingFiles = [];

    // ===== 文件选择处理 =====
    function handleFileSelect(e) {
      var files = Array.from(e.target.files);
      files.forEach(function(f) {
        var exists = pendingFiles.some(function(pf) { return pf.name === f.name && pf.size === f.size; });
        if (!exists) pendingFiles.push(f);
      });
      renderFilePreview();
      e.target.value = '';
    }

    // ===== 渲染文件预览条 =====
    function renderFilePreview() {
      var bar = document.getElementById('filePreviewBar');
      bar.innerHTML = '';
      if (pendingFiles.length === 0) { bar.classList.remove('has-files'); return; }
      bar.classList.add('has-files');
      pendingFiles.forEach(function(f, idx) {
        var tag = document.createElement('div');
        tag.className = 'file-tag';
        tag.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
          + '<span class="file-tag-name">' + escapeHtml(f.name) + '</span>'
          + '<span class="file-tag-size">' + formatFileSize(f.size) + '</span>'
          + '<button class="file-tag-remove" title="移除" onclick="removeFile(' + idx + ')"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
        bar.appendChild(tag);
      });
    }

    function removeFile(idx) { pendingFiles.splice(idx, 1); renderFilePreview(); }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // ===== 发送消息 =====
    function sendMessage() {
      var input = document.getElementById('chatInput');
      var text = input.value.trim();
      var files = pendingFiles.slice();
      if (!text && files.length === 0) return;

      var welcome = document.getElementById('chatWelcome');
      if (welcome) welcome.style.display = 'none';

      var displayText = text || '（发送了文件）';
      appendMessage('user', displayText, null, files);
      chatHistory.push({ role: 'user', content: displayText, files: files.map(function(f) { return f.name; }) });

      input.value = '';
      pendingFiles = [];
      autoResize(input);
      renderFilePreview();

      showTyping();

      setTimeout(function() {
        removeTyping();
        var reply = generateReply(text, files);
        appendMessage('assistant', reply.text, reply.result, reply.files);
        chatHistory.push({ role: 'assistant', content: reply.text, result: reply.result || null });
      }, 800 + Math.random() * 1200);
    }

    // ===== 追加消息 =====
    function appendMessage(role, text, result, files) {
      var container = document.getElementById('chatMessages');
      var row = document.createElement('div');
      row.className = 'msg-row ' + role;

      var avatarText = role === 'user' ? '我' : 'AI';
      var timeStr = formatTime(new Date());
      var html = '<div class="msg-avatar">' + avatarText + '</div>';
      html += '<div class="msg-content">';
      html += '<div class="msg-bubble">' + escapeHtml(text);

      if (files && files.length > 0) {
        html += '<div class="msg-files">';
        files.forEach(function(f) {
          var name = typeof f === 'string' ? f : f.name;
          html += '<div class="msg-file-tag"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + escapeHtml(name) + '</div>';
        });
        html += '</div>';
      }

      if (result) {
        html += '<div class="result-card">';
        html += '<div class="result-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>执行结果</div>';
        html += '<pre>' + escapeHtml(result) + '</pre>';
        html += '</div>';
      }

      html += '</div>';
      html += '<div class="msg-time">' + timeStr + '</div>';
      html += '</div>';
      row.innerHTML = html;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    // ===== 加载动画 =====
    function showTyping() {
      var container = document.getElementById('chatMessages');
      var row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.id = 'typingRow';
      row.innerHTML = '<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }
    function removeTyping() { var el = document.getElementById('typingRow'); if (el) el.remove(); }

    // ===== 模拟AI回复 =====
    function generateReply(text, files) {
      if (files && files.length > 0) {
        var fileNames = files.map(function(f) { return f.name; });
        var hasExcel = fileNames.some(function(n) { return /\.(xlsx|xls|csv)$/i.test(n); });
        if (hasExcel) {
          return {
            text: '已接收到文件，正在解析数据：',
            result: '解析文件: ' + fileNames.join(', ') + '\n\n店铺编码: SHOP-20260001\n商品数: 128\n成功数: 125\n失败数: 3\n执行时间: ' + formatTime(new Date())
          };
        }
        return {
          text: '已接收文件，处理结果如下：',
          result: '文件: ' + fileNames.join(', ') + '\n\n店铺编码: SHOP-20260001\n商品数: 56\n成功数: 54\n失败数: 2\n执行时间: ' + formatTime(new Date())
        };
      }
      if (text.indexOf('查看') >= 0) {
        return {
          text: '已查询到当前配置数据如下：',
          result: '尺码: S  |  身高: 155-160cm  |  体重: 40-50kg\n尺码: M  |  身高: 160-165cm  |  体重: 50-60kg\n尺码: L  |  身高: 165-170cm  |  体重: 60-70kg\n尺码: XL |  身高: 170-175cm  |  体重: 70-80kg'
        };
      }
      if (text.indexOf('导出') >= 0) {
        return {
          text: '数据报表已生成：',
          result: '文件名: 数据报表_20260713.xlsx\n总记录: 128 条\n覆盖平台: 淘宝、京东\n文件大小: 12.3 KB\n\n执行时间: ' + formatTime(new Date())
        };
      }
      if (text.indexOf('新增') >= 0 || text.indexOf('添加') >= 0) {
        return {
          text: '已成功新增配置：',
          result: '+ 新增项已添加\n\n店铺编码: SHOP-20260001\n商品数: 86\n成功数: 86\n失败数: 0\n执行时间: ' + formatTime(new Date())
        };
      }
      if (text.indexOf('删除') >= 0 || text.indexOf('移除') >= 0) {
        return {
          text: '已执行删除操作：',
          result: '已移除指定项\n\n店铺编码: SHOP-20260001\n商品数: 15\n成功数: 14\n失败数: 1\n执行时间: ' + formatTime(new Date())
        };
      }
      return {
        text: '收到您的指令，正在处理。以下是执行结果：',
        result: '店铺编码: SHOP-20260001\n商品数: 128\n成功数: 125\n失败数: 3\n执行时间: ' + formatTime(new Date())
      };
    }

    function fillPrompt(text) {
      var input = document.getElementById('chatInput');
      input.value = text;
      input.focus();
      autoResize(input);
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(date) {
      var y = date.getFullYear();
      var mo = (date.getMonth() + 1).toString().padStart(2, '0');
      var d = date.getDate().toString().padStart(2, '0');
      var h = date.getHours().toString().padStart(2, '0');
      var m = date.getMinutes().toString().padStart(2, '0');
      var s = date.getSeconds().toString().padStart(2, '0');
      return y + '-' + mo + '-' + d + ' ' + h + ':' + m + ':' + s;
    }

    // ===== 初始化渲染 =====
    renderAgentInfo(agentData[currentAgent]);

    // ===== 通知父页面更新面包屑 =====
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'breadcrumb', text: '包装优化 / 智能体中心' }, '*');
    }
  </script>
</body>
</html>
