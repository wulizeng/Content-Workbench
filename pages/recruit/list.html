<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户合作管理 - 列表</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/domains/recruit.css">
  <style>
    /* 入驻节点小徽章 — 与客户入驻申请页保持一致的视觉 */
    .stage-badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px;
      background: #f1f5f9; border-radius: 12px; font-size: 12px; color: var(--text-secondary); white-space: nowrap;
    }
    .stage-badge .stage-no { color: var(--primary); font-weight: 700; }
    .stage-cell { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stage-final-tip { font-size: 12px; color: #16a34a; }
    /* 移动端（<1024px）：卡片流 + 底部抽屉筛选 + 加载更多 */
    .card-list, .load-more-bar, .filter-fab, .filter-sheet-overlay { display: none; }
    @media (max-width: 1023px) {
      .search-area { display: none; }
      .table-area .table-scroll, .table-area .pagination { display: none; }
      .card-list { display: block; }
      .recruit-card {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 12px;
      }
      .recruit-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
      .recruit-card-head .name { font-size: 15px; font-weight: 700; color: var(--text); word-break: break-all; }
      .recruit-card-body { font-size: 13px; color: var(--text-secondary); line-height: 1.9; }
      .recruit-card-foot {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light);
      }
      .recruit-card-foot .time { font-size: 12px; color: #94a3b8; }
      .load-more-bar { display: block; text-align: center; margin: 8px 0 16px; }
      .load-more-bar .btn { width: 100%; height: 48px; }
      .filter-fab {
        display: inline-flex; align-items: center; gap: 6px;
        position: fixed; right: 16px; bottom: 24px; z-index: 50;
        height: 48px; padding: 0 18px; border: none; border-radius: 24px;
        background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
        box-shadow: 0 6px 18px rgba(91,108,245,.35); cursor: pointer;
      }
      .filter-sheet-overlay {
        display: flex; position: fixed; inset: 0; z-index: 100;
        background: rgba(0,0,0,.45); align-items: flex-end;
      }
      .filter-sheet {
        width: 100%; background: #fff; border-radius: 16px 16px 0 0;
        padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
        animation: sheetUp .25s ease;
      }
      @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .filter-sheet-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 0; font-size: 15px; font-weight: 700; color: var(--text);
      }
      .filter-sheet-close { border: none; background: transparent; font-size: 22px; color: #94a3b8; cursor: pointer; }
      .filter-sheet-body .search-item { display: block; margin-bottom: 14px; }
      .filter-sheet-body .search-item label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary); }
      .filter-sheet-body .search-item input,
      .filter-sheet-body .search-item select { width: 100%; height: 48px; box-sizing: border-box; }
      .filter-sheet-foot { display: flex; gap: 10px; }
      .filter-sheet-foot .btn { flex: 1; height: 48px; }
    }
  </style>
</head>
<body>
<div class="page-container">

  <!-- Toast 轻提示容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/onboarding-store.js"></script>
  <script src="../../js/shared/escape-html.js"></script>
  <script src="../../js/shared/toast.js"></script>
  <script>
    // 权限检查
    if (!Auth.requireAuth()) {
      // 已在 requireAuth 中跳转到登录页
    }

    var currentUser = Auth.getCurrentUser();

    if (window.parent) {
      window.parent.postMessage({type:'breadcrumb', text:'分销枢纽 <span>/</span> 客户合作管理'}, '*');
    }
  </script>

  <div class="page-title">客户合作管理</div>

  <div class="search-area">
    <div class="search-row">
      <div class="search-item">
        <label>客户名称：</label>
        <input type="text" id="sName" placeholder="请输入企业全称关键词">
      </div>
      <div class="search-item">
        <label>品牌：</label>
        <select id="sBrand"><option value="">全部</option></select>
      </div>
      <div class="search-item">
        <label>入驻平台：</label>
        <select id="sPlatform"><option value="">全部</option></select>
      </div>
      <div class="search-item">
        <label>状态：</label>
        <select id="sStatus"><option value="">全部</option><option value="submitted">已提交</option><option value="reviewed">已审核</option></select>
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>
    <div class="search-active-tags" id="searchTags" style="display:none;"></div>
  </div>

  <div class="card-list" id="cardList"></div>
  <div class="load-more-bar" id="loadMoreBar" style="display:none;">
    <button type="button" class="btn" onclick="loadMore()">加载更多</button>
  </div>

  <div class="table-area">
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead>
          <tr>
            <th>序号</th>
            <th>客户名称</th>
            <th>品牌</th>
            <th>入驻模式</th>
            <th>入驻平台</th>
            <th>对接商务</th>
            <th>创建时间</th>
            <th>创建人</th>
            <th>更新人</th>
            <th>更新时间</th>
            <th>入驻节点</th>
            <th>节点状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info">共 <strong id="totalCount">0</strong> 条</span>
      <span class="page-btn disabled">&laquo;</span>
      <span class="page-btn active">1</span>
      <span class="page-btn">&raquo;</span>
    </div>
  </div>

</div>

  <button type="button" class="filter-fab" id="filterFab" onclick="toggleFilterSheet()">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
    筛选
  </button>

  <div class="filter-sheet-overlay" id="filterSheetOverlay" style="display:none;" onclick="if(event.target===this) toggleFilterSheet()">
    <div class="filter-sheet">
      <div class="filter-sheet-head">
        <span>筛选条件</span>
        <button type="button" class="filter-sheet-close" onclick="toggleFilterSheet()">&times;</button>
      </div>
      <div class="filter-sheet-body">
        <div class="search-item"><label>客户名称：</label><input type="text" id="mSName" placeholder="请输入企业全称关键词"></div>
        <div class="search-item"><label>品牌：</label><select id="mSBrand"><option value="">全部</option></select></div>
        <div class="search-item"><label>入驻平台：</label><select id="mSPlatform"><option value="">全部</option></select></div>
        <div class="search-item"><label>状态：</label><select id="mSStatus"><option value="">全部</option><option value="submitted">已提交</option><option value="reviewed">已审核</option></select></div>
      </div>
      <div class="filter-sheet-foot">
        <button type="button" class="btn" onclick="resetMobileSearch()">重置</button>
        <button type="button" class="btn btn-primary" onclick="doMobileSearch()">查询</button>
      </div>
    </div>
  </div>

  <!-- 手工流转入口已收敛至详情页（detail.html），列表页不再提供弹窗 -->

<script>
var Store = OnboardingStore;
var VISIBLE_STATUSES = [Store.STATUS.SUBMITTED, Store.STATUS.REVIEWED];

// ===== 数据：入驻申请（已提交 + 已审核），按更新时间倒序 =====
function loadData() {
  var data = Store.list().filter(function(a) { return VISIBLE_STATUSES.indexOf(a.status) > -1; });
  data = Auth.filterApplications(data);
  return data.sort(function(a, b) { return (b.updatedAt || '').localeCompare(a.updatedAt || ''); });
}
var allData = loadData();
// 手工流转仅开放运营侧（operator / bd / admin）；达人菜单不展示本页，同时作前端防御
var canOperateStage = !!currentUser && ['operator', 'bd', 'admin'].indexOf(currentUser.role) > -1;
// 记录上一次搜索条件，刷新时无需手动重新录入
var lastQuery = { name: '', brand: '', platform: '', status: '' };
function refresh() {
  allData = loadData();
  renderView(applyFilter(allData, lastQuery));
}

// ===== 字段取值（列表与卡片共用） =====
function customerName(app) {
  var form = app.form || {};
  var fin = form.finance || {};
  var ent = form.enterprise || {};
  return fin.fullName || ent.entName || '';
}
function creatorOf(app) { return app.ownerName || app.ownerPhone || '-'; }
function updaterOf(app) {
  var versions = app.versions || [];
  if (versions.length) return versions[versions.length - 1].operator || creatorOf(app);
  return creatorOf(app);
}
function modeLabel(app) { var m = Store.modeByValue(app.mode); return m ? m.label : (app.mode || '-'); }
function platText(app) { return (app.platforms && app.platforms.length) ? app.platforms.join('、') : '-'; }

// 平台/品牌下拉选项（桌面 + 移动端）；品牌含马卡乐专属品牌
(function fillSelectOptions() {
  var brands = Store.BRANDS.concat(Store.MAKALE_BRANDS || []);
  ['sPlatform', 'mSPlatform'].forEach(function(id) {
    var sel = document.getElementById(id);
    Store.PLATFORMS.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      sel.appendChild(opt);
    });
  });
  ['sBrand', 'mSBrand'].forEach(function(id) {
    var sel = document.getElementById(id);
    brands.forEach(function(b) {
      var opt = document.createElement('option');
      opt.value = b; opt.textContent = b;
      sel.appendChild(opt);
    });
  });
})();

function st(s) {
  var m = { submitted: 'reviewing', reviewed: 'approved' };
  return '<span class="status-tag ' + (m[s] || '') + '">' + esc(Store.statusLabel(s)) + '</span>';
}
// 与客户入驻申请页保持同一表现：【stage-badge】 X/N · 阶段名（N 基于模式对应的流程模板：default12/makale11/customer_koc10/influencer8/koc_lite6）
function stageBadge(app) {
  var stages = Store.stagesForApp(app);
  var no = Store.currentStageOf(app) || 1;
  var stage = stages[no - 1] || { name: '-' };
  return '<span class="stage-badge"><span class="stage-no">' + no + '/' + stages.length + '</span>' + esc(stage.name || '-') + '</span>';
}
// 单元格：徐章 + 终态提示；节点流转操作入口已收敛至详情页，列表不再展示
function stageCell(app) {
  var no = Store.currentStageOf(app) || 1;
  var total = Store.stagesForApp(app).length;
  var html = '<div class="stage-cell">' + stageBadge(app);
  if (canOperateStage) {
    if (app.status === Store.STATUS.REVIEWED && no >= total) {
      html += '<span class="stage-final-tip">已入驻完毕</span>';
    }
  }
  return html + '</div>';
}
function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="13" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">暂无已提交的入驻申请</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      html += '<tr>';
      html += '<td>' + (index + 1) + '</td>';
      html += '<td>' + esc(customerName(row) || '-') + '</td>';
      html += '<td>' + esc(row.brand || '-') + '</td>';
      html += '<td>' + esc(modeLabel(row)) + '</td>';
      html += '<td>' + esc(platText(row)) + '</td>';
      html += '<td>' + esc(row.bdContact || '-') + '</td>';
      html += '<td>' + esc(row.createdAt || '-') + '</td>';
      html += '<td>' + esc(creatorOf(row)) + '</td>';
      html += '<td>' + esc(updaterOf(row)) + '</td>';
      html += '<td>' + esc(row.updatedAt || '-') + '</td>';
      html += '<td>' + stageCell(row) + '</td>';
      html += '<td class="col-status">' + st(row.status) + '</td>';
      html += '<td class="col-actions">';
      html += '<a class="link-action link-action-icon" title="查看详情" href="detail.html?id=' + encodeURIComponent(row.id) + '&mode=view"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>查看</a>';
      html += '</td></tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
}

// ===== 筛选 =====
function applyFilter(list, q) {
  return list.filter(function(x) {
    if (q.name && customerName(x).toLowerCase().indexOf(q.name.toLowerCase()) < 0) return false;
    // 品牌为多选拼接字符串（如「巴拉、森马」），按包含匹配
    if (q.brand && (x.brand || '').split('、').indexOf(q.brand) < 0) return false;
    if (q.platform && (x.platforms || []).indexOf(q.platform) < 0) return false;
    if (q.status && x.status !== q.status) return false;
    return true;
  });
}

function doSearch() {
  var q = {
    name: document.getElementById('sName').value.trim(),
    brand: document.getElementById('sBrand').value,
    platform: document.getElementById('sPlatform').value,
    status: document.getElementById('sStatus').value
  };
  lastQuery = q;
  renderView(applyFilter(allData, q));
  showSearchTags();
}
function resetSearch() {
  document.getElementById('sName').value = '';
  document.getElementById('sBrand').value = '';
  document.getElementById('sPlatform').value = '';
  document.getElementById('sStatus').value = '';
  lastQuery = { name: '', brand: '', platform: '', status: '' };
  renderView(allData);
  showSearchTags();
}
function showSearchTags() {
  var map = { sName: '客户名称', sBrand: '品牌', sPlatform: '入驻平台', sStatus: '状态' };
  var tags = [];
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (el && el.value) {
      var value = id === 'sStatus' ? Store.statusLabel(el.value) : el.value;
      tags.push({ name: map[id], value: value, id: id });
    }
  });
  var container = document.getElementById('searchTags');
  if (!container) return;
  if (tags.length === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }
  var html = '';
  tags.forEach(function(t) {
    html += '<span class="search-active-tag">' + esc(t.name) + '：' + esc(t.value) + '<span class="tag-remove" onclick="clearSearchTag(\'' + t.id + '\')">&times;</span></span>';
  });
  container.style.display = '';
  container.innerHTML = html;
}
function clearSearchTag(id) {
  document.getElementById(id).value = '';
  doSearch();
}

// ===== 移动端卡片 =====
var MOBILE_PAGE_SIZE = 10;
var mobileShownCount = MOBILE_PAGE_SIZE;
var currentFiltered = allData.slice();

function isMobileView() {
  return window.matchMedia('(max-width: 1023px)').matches;
}

function renderCards(data) {
  var list = document.getElementById('cardList');
  var slice = data.slice(0, mobileShownCount);
  var html = '';
  if (slice.length === 0) {
    html = '<div class="recruit-card"><div class="recruit-card-body">暂无已提交的入驻申请</div></div>';
  } else {
    slice.forEach(function(row) {
      html += '<div class="recruit-card">';
      html += '<div class="recruit-card-head"><span class="name">' + esc(customerName(row) || '-') + '</span>' + st(row.status) + '</div>';
      html += '<div class="recruit-card-body">';
      html += '<div>品牌：' + esc(row.brand || '-') + '</div>';
      html += '<div>入驻模式：' + esc(modeLabel(row)) + '</div>';
      html += '<div>入驻平台：' + esc(platText(row)) + '</div>';
      html += '<div>对接商务：' + esc(row.bdContact || '-') + '</div>';
      html += '<div>创建人：' + esc(creatorOf(row)) + '</div>';
      html += '<div>当前节点：' + stageCell(row) + '</div>';
      html += '<div>更新时间：' + esc(row.updatedAt || '-') + '</div>';
      html += '</div>';
      html += '<div class="recruit-card-foot"><span class="time">' + esc(row.createdAt || '') + '</span>';
      html += '<a class="btn btn-primary" style="height:48px;line-height:48px;padding:0 16px;" href="detail.html?id=' + encodeURIComponent(row.id) + '&mode=view">查看详情</a>';
      html += '</div></div>';
    });
  }
  list.innerHTML = html;
  var bar = document.getElementById('loadMoreBar');
  bar.style.display = data.length > mobileShownCount ? '' : 'none';
}

function renderView(data) {
  currentFiltered = data;
  if (isMobileView()) {
    renderCards(data);
  } else {
    renderTable(data);
  }
}

function loadMore() {
  mobileShownCount += MOBILE_PAGE_SIZE;
  renderCards(currentFiltered);
}

function toggleFilterSheet() {
  var overlay = document.getElementById('filterSheetOverlay');
  overlay.style.display = overlay.style.display === 'none' ? 'flex' : 'none';
}

function doMobileSearch() {
  var q = {
    name: document.getElementById('mSName').value.trim(),
    brand: document.getElementById('mSBrand').value,
    platform: document.getElementById('mSPlatform').value,
    status: document.getElementById('mSStatus').value
  };
  lastQuery = q;
  mobileShownCount = MOBILE_PAGE_SIZE;
  renderView(applyFilter(allData, q));
  toggleFilterSheet();
}

function resetMobileSearch() {
  document.getElementById('mSName').value = '';
  document.getElementById('mSBrand').value = '';
  document.getElementById('mSPlatform').value = '';
  document.getElementById('mSStatus').value = '';
  lastQuery = { name: '', brand: '', platform: '', status: '' };
  mobileShownCount = MOBILE_PAGE_SIZE;
  renderView(allData);
}

window.addEventListener('resize', function() { renderView(currentFiltered); });

renderView(allData);
// 手工流转入驻节点已收敛至详情页（detail.html）操作，列表页仅展示节点徽章
</script>
<!-- 设备效果预览切换器：电脑 / 手机 -->
<script>
(function() {
  if (self !== top) return;
  function inject(doc) {
    if (!doc || !doc.body) return;
    var bar = doc.createElement('div');
    bar.id = 'deviceSwitcher';
    bar.innerHTML = '<button type="button" id="dsBtnPc" class="ds-active">💻 电脑</button><button type="button" id="dsBtnPhone">📱 手机预览</button>';
    doc.body.appendChild(bar);
    var st = doc.createElement('style');
    st.textContent = '#deviceSwitcher{position:fixed;top:16px;right:16px;z-index:99999;display:flex;gap:2px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:4px;box-shadow:0 6px 20px rgba(15,23,42,.18)}' +
      '#deviceSwitcher button{border:none;background:transparent;padding:7px 14px;border-radius:18px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;line-height:1.4;font-family:inherit}' +
      '#deviceSwitcher button.ds-active{background:#5b6cf5;color:#fff}';
    doc.body.appendChild(st);
    var btnPc = doc.getElementById('dsBtnPc');
    var btnPhone = doc.getElementById('dsBtnPhone');
    function enterPhone() {
      if (doc.getElementById('devicePhone')) return;
      var wrap = doc.createElement('div');
      wrap.id = 'devicePhone';
      wrap.innerHTML = '<div class="dp-frame"><div class="dp-notch"></div><iframe id="dpFrame" title="手机效果预览"></iframe></div>' +
        '<div class="dp-hint">📱 手机效果预览（390px 视口）· 预览内操作同样生效 · 点右上角「电脑」返回</div>';
      var st2 = doc.createElement('style');
      st2.id = 'dpStyle';
      st2.textContent = 'html.dp-phone,html.dp-phone body{height:100%;margin:0}' +
        'html.dp-phone body{background:#0f172a !important;display:flex !important;align-items:center;justify-content:center !important;overflow:hidden !important}' +
        'html.dp-phone > body > *:not(#devicePhone):not(#deviceSwitcher){display:none !important}' +
        '#devicePhone{display:flex;flex-direction:column;align-items:center;gap:14px}' +
        '#devicePhone .dp-frame{width:390px;height:min(800px,88vh);background:#fff;border:10px solid #1e293b;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;position:relative}' +
        '#devicePhone .dp-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:24px;background:#1e293b;border-radius:0 0 16px 16px;z-index:3}' +
        '#devicePhone #dpFrame{width:100%;height:100%;border:none;display:block;background:#fff}' +
        '#devicePhone .dp-hint{color:#94a3b8;font-size:12px;text-align:center}';
      doc.body.appendChild(st2);
      doc.body.appendChild(wrap);
      doc.documentElement.classList.add('dp-phone');
      doc.getElementById('dpFrame').src = location.href;
      btnPc.classList.remove('ds-active');
      btnPhone.classList.add('ds-active');
    }
    function exitPhone() {
      var w = doc.getElementById('devicePhone');
      if (w) w.parentNode.removeChild(w);
      var s = doc.getElementById('dpStyle');
      if (s) s.parentNode.removeChild(s);
      doc.documentElement.classList.remove('dp-phone');
      btnPc.classList.add('ds-active');
      btnPhone.classList.remove('ds-active');
    }
    btnPhone.addEventListener('click', enterPhone);
    btnPc.addEventListener('click', exitPhone);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { inject(document); });
  } else {
    inject(document);
  }
})();
</script>
</body>
</html>
