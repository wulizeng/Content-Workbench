<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同步详情</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .detail-wrap { width:100%; margin:0 auto; padding:16px 20px 24px; box-sizing:border-box; }
    .detail-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .detail-header .page-title { margin-bottom:0; font-size:16px; }
    .sync-id-chip {
      font-family:"SF Mono","Menlo",monospace; font-size:12px; font-weight:600;
      color:var(--primary); background:var(--primary-50); border:1px solid #dce0f8;
      padding:2px 10px; border-radius:6px;
    }
    .section {
      background:var(--bg-white); border-radius:10px;
      box-shadow:0 1px 3px rgba(15,23,42,0.06); border:1px solid var(--border);
      margin-bottom:12px; overflow:hidden;
    }
    .section:last-child { margin-bottom:0; }
    .section-head {
      display:flex; align-items:center; gap:8px;
      padding:10px 16px; border-bottom:1px solid var(--border); background:#f8fafc;
    }
    .section-head h3 { margin:0; font-size:13px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:7px; }
    .section-head .sec-badge { font-size:12px; color:var(--text-tertiary); font-weight:400; }
    .section-body { padding:12px 16px; }
    .info-grid { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px 24px; }
    .info-item { display:inline-flex; align-items:center; gap:0; min-width:0; }
    .info-label { font-size:13px; color:var(--text-tertiary); white-space:nowrap; }
    .info-value { font-size:13px; font-weight:600; color:var(--ink); word-break:break-all; }

    /* ===== 同步明细表格 ===== */
    .pkg-table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
    .pkg-table thead th {
      background:#f8fafc; padding:8px 12px; text-align:left;
      font-weight:600; font-size:12px; color:var(--text-secondary);
      border-bottom:1px solid var(--border); white-space:nowrap;
    }
    .pkg-table tbody td {
      padding:8px 12px; border-bottom:1px solid var(--border-light); font-size:13px;
      color:var(--text-primary);
    }
    .pkg-table tbody tr:last-child td { border-bottom:none; }
    .pkg-table tbody tr:hover td { background:#f8fafc; }
    .store-id { font-family:"SF Mono","Menlo",monospace; font-size:12px; color:var(--text-tertiary); }

    /* ===== 状态标签 ===== */
    .status-tag { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:10px; font-size:12px; font-weight:500; }
    .status-tag.pending { background:#fef3c7; color:#d97706; }
    .status-tag.running { background:#dbeafe; color:#2563eb; }
    .status-tag.done { background:#d1fae5; color:#059669; }
    .status-tag.partial { background:#ffedd5; color:#ea580c; }
    .status-tag.fail { background:#fee2e2; color:#dc2626; }

    /* ===== 操作日志时间轴 ===== */
    .timeline { position:relative; padding-left:24px; }
    .timeline::before { content:''; position:absolute; left:7px; top:4px; bottom:4px; width:2px; background:var(--border); }
    .tl-item { position:relative; padding-bottom:14px; }
    .tl-item:last-child { padding-bottom:0; }
    .tl-dot {
      position:absolute; left:-24px; top:2px; width:16px; height:16px; border-radius:50%;
      background:#fff; border:3px solid var(--primary); box-sizing:border-box;
    }
    .tl-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .tl-action { font-size:13px; font-weight:700; color:var(--ink); }
    .tl-time { font-size:11px; color:var(--text-tertiary); font-family:"SF Mono","Menlo",monospace; }
    .tl-detail { font-size:12px; color:var(--text-secondary); margin-top:2px; }

    .empty-box { text-align:center; padding:60px 0; color:var(--text-tertiary); font-size:13px; }

    /* ===== Toast 提示 ===== */
    .toast-container { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
    .toast { padding:10px 18px; border-radius:8px; font-size:13px; font-weight:500; box-shadow:0 4px 12px rgba(0,0,0,.12); animation:toastIn .25s ease; }
    .toast-info { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }
    .toast-success { background:#ecfdf5; color:#059669; border:1px solid #a7f3d0; }
    .toast-warning { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }
    .toast-error { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
    .toast-hide { animation:toastOut .2s ease forwards; }
    @keyframes toastIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-8px); } }
  </style>
</head>
<body>
  <div class="detail-wrap">
    <div id="toastContainer" class="toast-container"></div>
    <div class="detail-header">
      <div class="page-title">同步详情 <span class="sync-id-chip" id="syncIdChip"></span></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="confirmExecute()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px;">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          确认执行
        </button>
        <button class="btn" onclick="goBack()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px;">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          关闭
        </button>
      </div>
    </div>

    <div id="contentArea">
      <!-- 基本信息 -->
      <div class="section">
        <div class="section-head"><h3>📋 基本信息</h3><span class="sec-badge">同步主表信息</span></div>
        <div class="section-body">
          <div class="info-grid" id="infoGrid"></div>
        </div>
      </div>

      <!-- 同步明细（权限变更） -->
      <div class="section">
        <div class="section-head"><h3>📦 权限变更明细</h3><span class="sec-badge" id="detailCountBadge"></span></div>
        <div class="section-body" style="padding:0;">
          <div style="overflow-x:auto;">
            <table class="pkg-table">
              <thead>
                <tr>
                  <th style="width:50px;">序号</th>
                  <th style="width:100px;">源岗位</th>
                  <th style="width:160px;">源岗位权限ID</th>
                  <th style="width:120px;">目标店铺编码</th>
                  <th style="width:120px;">目标店铺名称</th>
                  <th style="width:100px;">目标岗位</th>
                  <th style="width:160px;">目标岗位权限ID</th>
                  <th style="width:170px;">修改后目标岗位权限ID</th>
                  <th style="width:80px;">状态</th>
                  <th style="width:180px;">失败原因</th>
                </tr>
              </thead>
              <tbody id="detailBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 操作日志 -->
      <div class="section">
        <div class="section-head"><h3>🕐 操作日志</h3><span class="sec-badge">同步全生命周期</span></div>
        <div class="section-body">
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
    </div>
  </div>

<script>
var STORAGE_KEY = 'position_sync_records';

function getUrlParam(name) {
  var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
  var r = window.location.search.substr(1).match(reg);
  if (r) return decodeURIComponent(r[2]);
  return '';
}
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'info');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() { t.classList.add('toast-hide'); }, 2500);
  setTimeout(function() { t.remove(); }, 3000);
}

// ===== Mock 岗位权限数据（用于对比展示） =====
var mockPerms = {
  'P001': { '营销工具': ['达人专属营销','搭配购','满减','拼团','多件优惠'], '推广工具': ['商品推广','直播间推广','短视频推广'], '商品管理': ['商品管理','价格管理','库存管理','商品上架','商品下架'], '订单管理': ['订单查看','订单处理','发货管理','退款管理'], '数据分析': ['销售数据','流量数据','转化数据','数据看板'], '客服管理': ['客服接待','客服管理','快捷回复'] },
  'P005': { '营销工具': ['达人专属营销','搭配购','满减','拼团'], '推广工具': ['商品推广','搜索推广','信息流广告'], '商品管理': ['商品管理','价格管理','库存管理','商品上架','商品下架','商品编辑','商品审核','类目管理'], '订单管理': ['订单查看','订单处理','发货管理','退款管理','售后管理','订单导出'], '数据分析': ['销售数据','流量数据','转化数据','数据看板'], '客服管理': ['客服接待','客服管理','快捷回复'] },
  'P010': { '营销工具': ['达人专属营销','搭配购','满减','拼团','多件优惠','赠品活动'], '推广工具': ['商品推广','短视频推广','搜索推广'], '商品管理': ['商品管理','价格管理','库存管理','商品上架','商品下架','商品编辑','商品审核'], '订单管理': ['订单查看','订单处理','发货管理','退款管理','售后管理','订单导出','订单统计'], '数据分析': ['销售数据','流量数据','转化数据','数据看板'], '客服管理': ['客服接待','客服管理','快捷回复'] }
};

// ===== Mock 同步记录 =====
function getMockRecord(id) {
  var mocks = [
    {
      id: 'SY20260810001', platform: '抖音',
      sourceStore: '旗舰店A', sourceStoreId: 'S001', sourceShopId: 'dy_100231',
      sourcePosition: '运营主管', sourcePositionId: 'P001',
      targetStore: '奥莱店D', targetStoreId: 'S004', targetShopId: 'dy_101012',
      targetPosition: '运营主管', targetPositionId: 'P010',
      addCount: 3, removeCount: 1,
      status: '全部成功', operator: '系统管理员', createTime: '2026-08-10 11:20:00',
      logs: [
        { time: '2026-08-10 11:20:00', action: '创建同步任务', detail: '源：旗舰店A · 运营主管 → 目标：奥莱店D · 运营主管' },
        { time: '2026-08-10 11:20:01', action: '开始执行同步', detail: '正在同步岗位权限配置' },
        { time: '2026-08-10 11:20:02', action: '同步完成', detail: '新增 3 项权限，移除 1 项权限' },
        { time: '2026-08-10 11:20:03', action: '后台更新完成', detail: '目标岗位权限配置已更新' }
      ]
    },
    {
      id: 'SY20260811001', platform: '抖音',
      sourceStore: '海外旗舰店E', sourceStoreId: 'S005', sourceShopId: 'dy_101345',
      sourcePosition: '全栈运营', sourcePositionId: 'P011',
      targetStore: '专营店B', targetStoreId: 'S002', targetShopId: 'dy_100456',
      targetPosition: '店长', targetPositionId: 'P005',
      addCount: 8, removeCount: 2,
      status: '全部成功', operator: '张运营', createTime: '2026-08-11 14:30:00',
      logs: [
        { time: '2026-08-11 14:30:00', action: '创建同步任务', detail: '源：海外旗舰店E · 全栈运营 → 目标：专营店B · 店长' },
        { time: '2026-08-11 14:30:01', action: '开始执行同步', detail: '正在同步岗位权限配置' },
        { time: '2026-08-11 14:30:03', action: '同步完成', detail: '新增 8 项权限，移除 2 项权限' },
        { time: '2026-08-11 14:30:04', action: '后台更新完成', detail: '目标岗位权限配置已更新' }
      ]
    },
    {
      id: 'SY20260812001', platform: '快手',
      sourceStore: '旗舰店F', sourceStoreId: 'S006', sourceShopId: 'ks_200001',
      sourcePosition: '运营主管', sourcePositionId: 'P012',
      targetStore: '工厂店G', targetStoreId: 'S007', targetShopId: 'ks_200002',
      targetPosition: '仓库管理员', targetPositionId: 'P014',
      addCount: 15, removeCount: 0,
      status: '全部成功', operator: '系统管理员', createTime: '2026-08-12 09:00:00',
      logs: [
        { time: '2026-08-12 09:00:00', action: '创建同步任务', detail: '源：旗舰店F · 运营主管 → 目标：工厂店G · 仓库管理员' },
        { time: '2026-08-12 09:00:01', action: '开始执行同步', detail: '正在同步岗位权限配置' },
        { time: '2026-08-12 09:00:02', action: '同步完成', detail: '新增 15 项权限，移除 0 项权限' },
        { time: '2026-08-12 09:00:03', action: '后台更新完成', detail: '目标岗位权限配置已更新' }
      ]
    }
  ];
  for (var i = 0; i < mocks.length; i++) {
    if (mocks[i].id === id) return mocks[i];
  }
  // 从 localStorage 查找
  var records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  for (var j = 0; j < records.length; j++) {
    if (records[j].id === id) return records[j];
  }
  return null;
}

// ===== 渲染基本信息 =====
function renderInfo(record) {
  if (!record) return;
  document.getElementById('syncIdChip').textContent = record.id;
  var statusHtml = renderStatus(record.status);
  var fields = [
    { label: '同步编号', value: record.id, mono: true },
    { label: '平台', value: record.platform || '抖音' },
    { label: '源店铺', value: (record.sourceShopId || record.sourceStoreId) + ' ' + record.sourceStore },
    { label: '源岗位', value: record.sourcePosition },
    { label: '目标店铺', value: (record.targetShopId || record.targetStoreId) + ' ' + record.targetStore },
    { label: '目标岗位', value: record.targetPosition },
    { label: '执行状态', html: statusHtml },
    { label: '创建人', value: record.operator },
    { label: '新增权限', html: '<span style="color:#16a34a;font-weight:600;">' + record.addCount + ' 项</span>' },
    { label: '移除权限', html: '<span style="color:#dc2626;font-weight:600;">' + record.removeCount + ' 项</span>' },
    { label: '创建时间', value: record.createTime }
  ];
  var html = '';
  fields.forEach(function(f) {
    html += '<div class="info-item">';
    html += '<span class="info-label">' + f.label + '：</span>';
    if (f.html) {
      html += '<span class="info-value">' + f.html + '</span>';
    } else {
      var val = esc(f.value || '');
      if (f.mono) val = '<span style="font-family:\'SF Mono\',Menlo,monospace;font-size:12px;color:var(--primary);">' + val + '</span>';
      html += '<span class="info-value">' + val + '</span>';
    }
    html += '</div>';
  });
  document.getElementById('infoGrid').innerHTML = html;
}

// ===== 渲染状态标签 =====
function renderStatus(status) {
  var cls = '';
  switch(status) {
    case '全部成功': cls = 'done'; break;
    case '部分成功': cls = 'partial'; break;
    case '全部失败': cls = 'fail'; break;
    case '执行中': cls = 'running'; break;
    case '待执行': cls = 'pending'; break;
    default: cls = 'pending';
  }
  return '<span class="status-tag ' + cls + '">' + esc(status) + '</span>';
}

// ===== 渲染权限变更明细 =====
function renderDetail(record) {
  if (!record) return;
  var tbody = document.getElementById('detailBody');
  var srcPerms = mockPerms[record.sourcePositionId] || {};
  var tgtPerms = mockPerms[record.targetPositionId] || {};
  // 构建权限ID映射：权限名 → 权限ID
  var srcPermIdMap = {}, tgtPermIdMap = {};
  Object.keys(srcPerms).forEach(function(cat) {
    srcPerms[cat].forEach(function(p, i) {
      srcPermIdMap[p] = record.sourcePositionId + '-' + cat.charAt(0) + String(i + 1).padStart(2, '0');
    });
  });
  Object.keys(tgtPerms).forEach(function(cat) {
    tgtPerms[cat].forEach(function(p, i) {
      tgtPermIdMap[p] = record.targetPositionId + '-' + cat.charAt(0) + String(i + 1).padStart(2, '0');
    });
  });
  // 合并所有权限项，逐项对比
  var allPermNames = {};
  Object.keys(srcPerms).forEach(function(cat) { srcPerms[cat].forEach(function(p) { allPermNames[p] = true; }); });
  Object.keys(tgtPerms).forEach(function(cat) { tgtPerms[cat].forEach(function(p) { allPermNames[p] = true; }); });
  var permList = Object.keys(allPermNames);
  document.getElementById('detailCountBadge').textContent = '共 ' + permList.length + ' 项权限';
  var html = '';
  var seq = 0;
  permList.forEach(function(permName) {
    seq++;
    var inSrc = srcPermIdMap[permName] ? true : false;
    var inTgt = tgtPermIdMap[permName] ? true : false;
    var srcId = inSrc ? srcPermIdMap[permName] : '';
    var tgtId = inTgt ? tgtPermIdMap[permName] : '';
    html += '<tr>';
    html += '<td>' + seq + '</td>';
    html += '<td style="font-weight:600;">' + esc(record.sourcePosition) + '</td>';
    html += '<td style="font-family:\'SF Mono\',Menlo,monospace;font-size:12px;">' + (srcId ? esc(srcId) : '<span style="color:var(--text-tertiary);">—</span>') + '</td>';
    html += '<td><span class="store-id">' + esc(record.targetShopId || record.targetStoreId) + '</span></td>';
    html += '<td>' + esc(record.targetStore) + '</td>';
    html += '<td style="font-weight:600;">' + esc(record.targetPosition) + '</td>';
    // 修改后目标岗位权限ID：同步后以源岗位权限为准
    var modifiedTgtId = inSrc ? srcId : '';
    html += '<td style="font-family:\'SF Mono\',Menlo,monospace;font-size:12px;">' + (tgtId ? esc(tgtId) : '<span style="color:var(--text-tertiary);">—</span>') + '</td>';
    html += '<td style="font-family:\'SF Mono\',Menlo,monospace;font-size:12px;">' + (modifiedTgtId ? esc(modifiedTgtId) : '<span style="color:var(--text-tertiary);">—</span>') + '</td>';
    // 状态：根据权限存在情况模拟执行状态
    var rowStatus;
    if (!inSrc && !inTgt) rowStatus = '待执行';
    else if (inSrc && !inTgt) rowStatus = '执行中';
    else if (inSrc && inTgt) rowStatus = '成功';
    else rowStatus = '失败';
    var stCls = { '待执行':'pending', '执行中':'running', '成功':'done', '失败':'fail' }[rowStatus] || 'pending';
    html += '<td><span class="status-tag ' + stCls + '">' + esc(rowStatus) + '</span></td>';
    var failReason = (rowStatus === '失败') ? '目标岗位权限ID不存在，同步终止' : '';
    html += '<td style="font-size:12px;color:#dc2626;">' + (failReason ? esc(failReason) : '<span style="color:var(--text-tertiary);">—</span>') + '</td>';
    html += '</tr>';
  });
  if (permList.length === 0) {
    html = '<tr><td colspan="10" class="empty-box">暂无权限变更数据</td></tr>';
  }
  tbody.innerHTML = html;
}

// ===== 渲染操作日志 =====
function renderLogs(record) {
  if (!record || !record.logs) return;
  var el = document.getElementById('timeline');
  var html = '';
  record.logs.forEach(function(log, i) {
    var dotCls = 'create';
    if (i === 1) dotCls = 'start';
    else if (i === record.logs.length - 1) dotCls = 'success';
    html += '<div class="tl-item">';
    html += '<div class="tl-dot ' + dotCls + '"></div>';
    html += '<div class="tl-head">';
    html += '<span class="tl-action">' + esc(log.action) + '</span>';
    html += '<span class="tl-time">' + esc(log.time) + '</span>';
    html += '</div>';
    if (log.detail) {
      html += '<div class="tl-detail">' + esc(log.detail) + '</div>';
    }
    html += '</div>';
  });
  el.innerHTML = html;
}

// ===== 确认执行 =====
function confirmExecute() {
  var id = getUrlParam('id');
  var record = getMockRecord(id);
  if (!record) { showToast('未找到同步记录', 'error'); return; }
  if (record.status === '全部成功') {
    showToast('该同步任务已全部执行成功，无需重复执行', 'warning');
    return;
  }
  // 更新状态为执行中
  record.status = '执行中';
  var now = new Date().toLocaleString('zh-CN', {hour12: false}).replace(/\//g, '-');
  record.logs.push({ time: now, action: '重新执行同步', detail: '正在重新同步岗位权限配置' });
  // 保存更新
  var records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  for (var i = 0; i < records.length; i++) {
    if (records[i].id === id) { records[i] = record; break; }
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  showToast('已提交执行，正在同步权限配置...', 'info');
  // 模拟执行完成
  setTimeout(function() {
    record.status = '全部成功';
    record.logs.push({ time: new Date().toLocaleString('zh-CN', {hour12: false}).replace(/\//g, '-'), action: '同步完成', detail: '权限配置已全部同步完成' });
    var recs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    for (var j = 0; j < recs.length; j++) {
      if (recs[j].id === id) { recs[j] = record; break; }
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recs));
    renderInfo(record);
    renderDetail(record);
    renderLogs(record);
    showToast('权限同步执行完成！', 'success');
  }, 2000);
}

// ===== 返回 =====
function goBack() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'openTab',
      page: 'pages/store-engine/position-clone-list.html',
      title: '店铺岗位管理'
    }, '*');
  }
}

// ===== 初始化 =====
function init() {
  var id = getUrlParam('id');
  if (!id) {
    document.getElementById('contentArea').innerHTML = '<div class="empty-box">未找到同步记录</div>';
    return;
  }
  var record = getMockRecord(id);
  if (!record) {
    document.getElementById('contentArea').innerHTML = '<div class="empty-box">未找到同步记录（ID: ' + esc(id) + '）</div>';
    return;
  }
  renderInfo(record);
  renderDetail(record);
  renderLogs(record);
}

init();
</script>
