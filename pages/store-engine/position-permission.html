<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台岗位权限</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
  .data-table thead th,
  .data-table tbody td {
    text-align: center;
    white-space: nowrap;
  }
  .data-table .col-actions {
    text-align: center;
  }

  /* ===== 展开行权限树 ===== */
  .expand-row { display: none; }
  .expand-row.show { display: table-row; }
  .expand-row td { padding: 16px 20px !important; background: #f8fafc; }
  .expand-content {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    padding: 16px 20px;
  }
  .expand-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .expand-title svg { flex-shrink: 0; }

  /* 权限分类行 */
  .perm-category {
    display: flex;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
  }
  .perm-category:last-child { border-bottom: none; }
  .perm-category-name {
    width: 100px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .perm-category-name input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer;
  }
  .perm-items {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
  }
  .perm-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .perm-item input[type="checkbox"] {
    width: 14px; height: 14px; accent-color: var(--primary); cursor: pointer;
  }

  /* 展开按钮 */
  .expand-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    transition: all .15s;
    color: var(--text-secondary);
  }
  .expand-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  .expand-btn svg { transition: transform .2s; }
  .expand-btn.open svg { transform: rotate(90deg); }

  /* 权限摘要 */
  .perm-summary {
    font-size: 12px;
    color: var(--primary);
    background: var(--primary-light);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,.45); z-index:9999;
    display:flex; align-items:center; justify-content:center;
    animation:modalFadeIn .25s ease;
  }
  @keyframes modalFadeIn { from{opacity:0} to{opacity:1} }
  .modal {
    background:#fff; border-radius:12px; width:640px; max-width:92vw;
    max-height:90vh; box-shadow:0 24px 60px rgba(0,0,0,.2);
    display:flex; flex-direction:column; animation:modalSlideIn .3s ease;
  }
  @keyframes modalSlideIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal-head {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px 10px; border-bottom:1px solid #e4e9f1;
  }
  .modal-head h3 { margin:0; font-size:15px; font-weight:700; color:#0f172a; }
  .modal-close {
    width:28px; height:28px; border:none; background:transparent;
    border-radius:6px; cursor:pointer; display:grid; place-items:center;
    color:#647084; font-size:18px; transition:background .15s;
  }
  .modal-close:hover { background:#f0f2f5; }
  .modal-body { padding:12px 18px; overflow-y:auto; flex:1; min-height:0; }
  .modal-foot {
    display:flex; justify-content:flex-end; gap:10px;
    padding:10px 18px 14px; border-top:1px solid #e4e9f1;
  }
  .modal-foot .btn { min-width:80px; }

  /* ===== 表单 ===== */
  .form-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px 16px;
  }
  .form-item { display:flex; flex-direction:row; align-items:center; gap:8px; }
  .form-item label { font-size:12px; font-weight:600; color:var(--text-secondary); white-space:nowrap; flex-shrink:0; width:80px; text-align:right; }
  .form-item input, .form-item select, .form-item textarea {
    width:100%; box-sizing:border-box; flex:1; min-width:0;
    padding:6px 10px; border:1px solid var(--border); border-radius:6px;
    font:inherit; font-size:13px; outline:none; background:var(--bg-secondary,#f8fafc);
    transition:border-color .18s;
  }
  .form-item input:focus, .form-item select:focus, .form-item textarea:focus {
    border-color:var(--primary); background:#fff;
  }
  .form-item textarea { resize:vertical; min-height:60px; }
  .form-item.full { grid-column: 1 / -1; }

  /* ===== 查看弹窗只读字段 ===== */
  .view-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:8px 16px;
  }
  .view-item { display:flex; align-items:center; gap:6px; }
  .view-item .view-label {
    font-size:12px; font-weight:600; color:var(--text-muted); white-space:nowrap; width:72px; text-align:right; flex-shrink:0;
  }
  .view-item .view-value {
    font-size:13px; color:var(--text); flex:1; min-width:0;
  }
  .view-item.full { grid-column: 1 / -1; }
  .view-item .view-value.desc {
    line-height:1.6; white-space:normal;
  }

  /* ===== 查看弹窗权限只读 ===== */
  .view-perm-section {
    margin-top:14px; padding-top:12px; border-top:1px solid var(--border-light);
  }
  .view-perm-title {
    font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px;
    display:flex; align-items:center; gap:6px;
  }
  .view-perm-row {
    display:flex; align-items:flex-start; padding:8px 0;
    border-bottom:1px solid var(--border-light);
  }
  .view-perm-row:last-child { border-bottom:none; }
  .view-perm-cat {
    width:80px; flex-shrink:0; font-size:13px; font-weight:600; color:var(--text);
  }
  .view-perm-tags {
    flex:1; display:flex; flex-wrap:wrap; gap:5px;
  }
  .view-perm-tag {
    font-size:11px; padding:2px 8px; border-radius:10px;
    background:var(--primary-light); color:var(--primary); white-space:nowrap;
  }
  .view-perm-empty {
    font-size:12px; color:var(--text-muted); font-style:italic;
  }
  </style>
</head>

      </div>
      <div class="modal-body">

            <input type="text" id="editPositionName" placeholder="请输入岗位名称">

            <label>状态：</label>

      </div>
      <div class="modal-foot">

    </div>
  </div>

  <!-- ===== 查看弹窗 ===== -->

      </div>

    </div>
  </div>

</div>

// ===== 渲染表格 =====
function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="12" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">点击「+ 新增岗位」创建记录</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      var permCount = 0;
      if (row.permissions) {
        Object.keys(row.permissions).forEach(function(k) { permCount += row.permissions[k].length; });
      }
      html += '<tr class="' + (row._checked ? 'row-selected' : '') + '">';
      html += '<td><input type="checkbox" class="row-check" value="' + row.id + '" ' + (row._checked ? 'checked' : '') + ' onclick="toggleRow(this,' + row.id + ')"></td>';
      html += '<td>' + (index + 1) + '</td>';
      html += '<td>' + escapeHtml(row.platformName) + '</td>';
      html += '<td>' + escapeHtml(row.positionName) + '</td>';
      html += '<td title="' + escapeHtml(row.positionDesc) + '">' + escapeHtml(row.positionDesc) + '</td>';
      html += '<td>' + getStatusTag(row.status) + '</td>';
      html += '<td>' + escapeHtml(row.creator) + '</td>';
      html += '<td>' + escapeHtml(row.createTime) + '</td>';
      html += '<td>' + escapeHtml(row.updater) + '</td>';
      html += '<td>' + escapeHtml(row.updateTime) + '</td>';
      html += '<td><span class="perm-summary">' + permCount + ' 项权限</span></td>';
      html += '<td class="col-actions">';
      html += '<button class="expand-btn" onclick="toggleExpand(this,' + row.id + ')" title="展开权限明细"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>';
      html += '<a class="link-action" href="javascript:void(0)" onclick="doEdit(' + row.id + ')">编辑</a>';
      html += '<a class="link-action" href="javascript:void(0)" onclick="doView(' + row.id + ')">查看</a>';
      html += '<a class="link-action" href="javascript:void(0)" onclick="doDelete(' + row.id + ')">删除</a>';
      html += '</td>';
      html += '</tr>';
      // 展开行：权限明细
      html += '<tr class="expand-row" id="expandRow_' + row.id + '"><td colspan="12">';
      html += buildPermissionTree(row);
      html += '</td></tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
  document.getElementById('checkAll').checked = false;
}

// ===== 构建权限树 HTML =====
function buildPermissionTree(row) {
  var html = '<div class="expand-content">';
  html += '<div class="expand-title"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> 权限明细配置</div>';
  permissionCategories.forEach(function(cat) {
    var checkedItems = (row.permissions && row.permissions[cat.name]) || [];
    var allChecked = checkedItems.length === cat.children.length;
    var html2 = '<div class="perm-category">';
    html2 += '<div class="perm-category-name">';
    html2 += '<input type="checkbox" ' + (allChecked ? 'checked' : '') + ' onchange="toggleCategory(this,\'' + cat.name + '\',' + row.id + ')">';
    html2 += '<span>' + cat.name + '</span>';
    html2 += '</div>';
    html2 += '<div class="perm-items">';
    cat.children.forEach(function(item) {
      var isChecked = checkedItems.indexOf(item) > -1;
      html2 += '<label class="perm-item">';
      html2 += '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' data-category="' + cat.name + '" data-item="' + item + '" onchange="onPermChange(' + row.id + ')">';
      html2 += '<span>' + item + '</span>';
      html2 += '</label>';
    });
    html2 += '</div>';
    html2 += '</div>';
    html += html2;
  });
  html += '<div style="text-align:right;margin-top:12px;">';
  html += '<button class="btn btn-primary" onclick="savePermissions(' + row.id + ')">保存权限</button>';
  html += '<button class="btn" onclick="cancelPermissions(' + row.id + ')" style="margin-left:8px;">取消</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

// ===== 展开/收起权限明细 =====
function toggleExpand(btn, id) {
  var row = document.getElementById('expandRow_' + id);
  if (!row) return;
  var isOpen = row.classList.contains('show');
  // 先关闭所有展开行
  document.querySelectorAll('.expand-row.show').forEach(function(r) { r.classList.remove('show'); });
  document.querySelectorAll('.expand-btn.open').forEach(function(b) { b.classList.remove('open'); });
  if (!isOpen) {
    row.classList.add('show');
    btn.classList.add('open');
  }
}

// ===== 分类全选/取消 =====
function toggleCategory(el, catName, rowId) {
  var checked = el.checked;
  var checkboxes = document.querySelectorAll('#expandRow_' + rowId + ' input[data-category="' + catName + '"]');
  checkboxes.forEach(function(cb) { cb.checked = checked; });
}

// ===== 单个权限变更时联动分类勾选框 =====
function onPermChange(rowId) {
  permissionCategories.forEach(function(cat) {
    var allCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-category="' + cat.name + '"]');
    var checkedCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-category="' + cat.name + '"]:checked');
    var categoryCb = allCbs[0] ? allCbs[0].closest('.perm-category').querySelector('.perm-category-name input[type="checkbox"]') : null;
    if (categoryCb) {
      categoryCb.checked = allCbs.length > 0 && allCbs.length === checkedCbs.length;
    }
  });
}

// ===== 保存权限 =====
function savePermissions(id) {
  var row = null;
  for (var i = 0; i < mockData.length; i++) { if (mockData[i].id === id) { row = mockData[i]; break; } }
  if (!row) return;
  row.permissions = {};
  permissionCategories.forEach(function(cat) {
    var cbs = document.querySelectorAll('#expandRow_' + id + ' input[data-category="' + cat.name + '"]:checked');
    var items = [];
    cbs.forEach(function(cb) { items.push(cb.getAttribute('data-item')); });
    row.permissions[cat.name] = items;
  });
  row.updateTime = new Date().toLocaleString('zh-CN', {hour12: false}).replace(/\//g, '-');
  showToast('权限保存成功', 'success');
  renderTable(mockData);
}

// ===== 取消权限编辑 =====
function cancelPermissions(id) {
  var row = document.getElementById('expandRow_' + id);
  if (row) row.classList.remove('show');
  document.querySelectorAll('.expand-btn.open').forEach(function(b) { b.classList.remove('open'); });
}

// ===== 全选/取消全选 =====
function toggleAll(el) {
  var checks = document.querySelectorAll('.row-check');
  checks.forEach(function(c) {
    c.checked = el.checked;
    var tr = c.closest('tr');
    if (tr) tr.classList.toggle('row-selected', el.checked);
  });
}
function toggleRow(el, id) {
  var tr = el.closest('tr');
  if (tr) tr.classList.toggle('row-selected', el.checked);
  updateCheckAll();
}
function updateCheckAll() {
  var all = document.querySelectorAll('.row-check');
  var checked = document.querySelectorAll('.row-check:checked');
  document.getElementById('checkAll').checked = all.length > 0 && all.length === checked.length;
}

// ===== 状态标签 =====
function getStatusTag(status) {
  var cls = '';
  switch(status) {
    case '启用': cls = 'submitted'; break;
    case '未启用': cls = 'initial'; break;
    case '删除': cls = 'cancelled'; break;
    default: cls = 'initial';
  }
  return '<span class="status-tag ' + cls + '">' + escapeHtml(status) + '</span>';
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 搜索 =====
function doSearch() {
  var platform = document.getElementById('searchPlatform').value;
  var position = document.getElementById('searchPosition').value.trim();
  var status = document.getElementById('searchStatus').value;
  var filtered = mockData.filter(function(row) {
    if (platform && row.platformName !== platform) return false;
    if (position && row.positionName.indexOf(position) === -1) return false;
    if (status && row.status !== status) return false;
    return true;
  });
  renderTable(filtered);
  showSearchTags();
}

function resetSearch() {
  document.getElementById('searchPlatform').value = '';
  document.getElementById('searchPosition').value = '';
  document.getElementById('searchStatus').value = '';
  renderTable(mockData);
  hideSearchTags();
}

function showSearchTags() {
  var tags = [];
  var platform = document.getElementById('searchPlatform').value;
  var position = document.getElementById('searchPosition').value.trim();
  var status = document.getElementById('searchStatus').value;
  if (platform) tags.push({label:'平台名称: '+platform, field:'searchPlatform'});
  if (position) tags.push({label:'岗位名称: '+position, field:'searchPosition'});
  if (status) tags.push({label:'状态: '+status, field:'searchStatus'});
  var container = document.getElementById('searchTags');
  if (tags.length === 0) { container.style.display = 'none'; return; }
  container.style.display = '';
  container.innerHTML = tags.map(function(t) {
    return '<span class="active-tag" onclick="clearTag(\''+t.field+'\')">'+t.label+' ×</span>';
  }).join('');
}
function hideSearchTags() { document.getElementById('searchTags').style.display = 'none'; }
function clearTag(field) {
  var el = document.getElementById(field);
  if (el.tagName === 'SELECT') el.value = ''; else el.value = '';
  doSearch();
}

// ===== 编辑弹窗 =====
var editingId = null;

function doEdit(id) {
  var row = null;
  for (var i = 0; i < mockData.length; i++) { if (mockData[i].id === id) { row = mockData[i]; break; } }
  if (!row) return;
  editingId = id;
  document.getElementById('editModalTitle').textContent = '编辑岗位';
  document.getElementById('editPlatform').value = row.platformName;
  document.getElementById('editPositionName').value = row.positionName;
  document.getElementById('editPositionDesc').value = row.positionDesc;
  document.getElementById('editStatus').value = row.status;
  document.getElementById('editCreator').value = row.creator;
  // 渲染权限复选框
  renderEditPermissions(row);
  document.getElementById('editModal').style.display = '';
}

function renderEditPermissions(row) {
  var container = document.getElementById('editPermContainer');
  var html = '';
  permissionCategories.forEach(function(cat) {
    var checkedItems = (row.permissions && row.permissions[cat.name]) || [];
    var allChecked = checkedItems.length === cat.children.length;
    html += '<div class="perm-category">';
    html += '<div class="perm-category-name">';
    html += '<input type="checkbox" ' + (allChecked ? 'checked' : '') + ' onchange="toggleEditCategory(this,\'' + cat.name + '\')">';
    html += '<span>' + cat.name + '</span>';
    html += '</div>';
    html += '<div class="perm-items">';
    cat.children.forEach(function(item) {
      var isChecked = checkedItems.indexOf(item) > -1;
      html += '<label class="perm-item">';
      html += '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' data-edit-category="' + cat.name + '" data-edit-item="' + item + '" onchange="onEditPermChange()">';
      html += '<span>' + item + '</span>';
      html += '</label>';
    });
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function toggleEditCategory(el, catName) {
  var checked = el.checked;
  var checkboxes = document.querySelectorAll('#editPermContainer input[data-edit-category="' + catName + '"]');
  checkboxes.forEach(function(cb) { cb.checked = checked; });
}

function onEditPermChange() {
  permissionCategories.forEach(function(cat) {
    var allCbs = document.querySelectorAll('#editPermContainer input[data-edit-category="' + cat.name + '"]');
    var checkedCbs = document.querySelectorAll('#editPermContainer input[data-edit-category="' + cat.name + '"]:checked');
    var categoryCb = allCbs[0] ? allCbs[0].closest('.perm-category').querySelector('.perm-category-name input[type="checkbox"]') : null;
    if (categoryCb) {
      categoryCb.checked = allCbs.length > 0 && allCbs.length === checkedCbs.length;
    }
  });
}

function saveEdit() {
  var row = null;
  for (var i = 0; i < mockData.length; i++) { if (mockData[i].id === editingId) { row = mockData[i]; break; } }
  if (!row) return;
  var positionName = document.getElementById('editPositionName').value.trim();
  if (!positionName) { showToast('请输入岗位名称', 'warning'); return; }
  row.platformName = document.getElementById('editPlatform').value;
  row.positionName = positionName;
  row.positionDesc = document.getElementById('editPositionDesc').value.trim();
  row.status = document.getElementById('editStatus').value;
  // 收集权限
  row.permissions = {};
  permissionCategories.forEach(function(cat) {
    var cbs = document.querySelectorAll('#editPermContainer input[data-edit-category="' + cat.name + '"]:checked');
    var items = [];
    cbs.forEach(function(cb) { items.push(cb.getAttribute('data-edit-item')); });
    row.permissions[cat.name] = items;
  });
  row.updateTime = new Date().toLocaleString('zh-CN', {hour12: false}).replace(/\//g, '-');
  row.updater = currentUser || '系统管理员';
  closeEditModal();
  renderTable(mockData);
  showToast('保存成功', 'success');
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
  editingId = null;
}

// ===== 查看弹窗 =====
function doView(id) {
  var row = null;
  for (var i = 0; i < mockData.length; i++) { if (mockData[i].id === id) { row = mockData[i]; break; } }
  if (!row) return;
  // 基本信息
  var infoHtml = '';
  infoHtml += '<div class="view-item"><span class="view-label">平台名称：</span><span class="view-value">' + escapeHtml(row.platformName) + '</span></div>';
  infoHtml += '<div class="view-item"><span class="view-label">岗位名称：</span><span class="view-value">' + escapeHtml(row.positionName) + '</span></div>';
  infoHtml += '<div class="view-item"><span class="view-label">状态：</span><span class="view-value">' + getStatusTag(row.status) + '</span></div>';
  infoHtml += '<div class="view-item"><span class="view-label">创建人：</span><span class="view-value">' + escapeHtml(row.creator) + '</span></div>';
  infoHtml += '<div class="view-item"><span class="view-label">创建时间：</span><span class="view-value">' + escapeHtml(row.createTime) + '</span></div>';
  infoHtml += '<div class="view-item"><span class="view-label">更新人：</span><span class="view-value">' + escapeHtml(row.updater) + '</span></div>';
  infoHtml += '<div class="view-item full"><span class="view-label">岗位描述：</span><span class="view-value desc">' + escapeHtml(row.positionDesc) + '</span></div>';
  infoHtml += '<div class="view-item"><span class="view-label">更新时间：</span><span class="view-value">' + escapeHtml(row.updateTime) + '</span></div>';
  document.getElementById('viewInfoGrid').innerHTML = infoHtml;
  // 权限明细
  var permHtml = '<div class="view-perm-title"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> 权限明细</div>';
  permissionCategories.forEach(function(cat) {
    var checkedItems = (row.permissions && row.permissions[cat.name]) || [];
    permHtml += '<div class="view-perm-row">';
    permHtml += '<div class="view-perm-cat">' + cat.name + '</div>';
    permHtml += '<div class="view-perm-tags">';
    if (checkedItems.length === 0) {
      permHtml += '<span class="view-perm-empty">暂无权限</span>';
    } else {
      checkedItems.forEach(function(item) {
        permHtml += '<span class="view-perm-tag">' + escapeHtml(item) + '</span>';
      });
    }
    permHtml += '</div>';
    permHtml += '</div>';
  });
  document.getElementById('viewPermSection').innerHTML = permHtml;
  document.getElementById('viewModal').style.display = '';
}

function closeViewModal() {
  document.getElementById('viewModal').style.display = 'none';
}

// ===== 操作按钮 =====
var currentUser = '系统管理员';
function goAdd() { showToast('新增岗位功能开发中', 'info'); }
function doDelete(id) {
  if (confirm('确定要删除该岗位吗？')) {
    var idx = -1;
    for (var i = 0; i < mockData.length; i++) { if (mockData[i].id === id) { idx = i; break; } }
    if (idx > -1) { mockData.splice(idx, 1); renderTable(mockData); showToast('删除成功', 'success'); }
  }
}

// ===== Toast =====
function showToast(msg, type) {
  var container = document.getElementById('toastContainer');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'info');
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(function() { toast.classList.add('toast-hide'); }, 2500);
  setTimeout(function() { toast.remove(); }, 3000);
}

// 初始化渲染
renderTable(mockData);
</script>
</body>
</html>
