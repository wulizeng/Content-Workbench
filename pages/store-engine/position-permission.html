<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台岗位权限</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
  .data-table thead th,
  .data-table tbody td {
    text-align: center;
    white-space: nowrap;
  }
  .data-table .col-actions {
    text-align: center;
  }

  /* ===== 展开行权限树 ===== */
  .expand-row { display: none; }
  .expand-row.show { display: table-row; }
  .expand-row td { padding: 16px 20px !important; background: #f8fafc; }
  .expand-content {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    padding: 16px 20px;
  }
  .expand-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .expand-title svg { flex-shrink: 0; }

  /* 一级分类行 — 带左侧色条 + 浅底 */
  .perm-l1 {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin-top: 12px;
    background: linear-gradient(135deg, #f0f4ff 0%, #f8f9fc 100%);
    border-left: 3px solid var(--primary);
    border-radius: 0 6px 6px 0;
  }
  .perm-l1:first-of-type { margin-top: 4px; }
  .perm-l1-name {
    font-size: 14px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 6px;
    letter-spacing: 0.5px;
  }
  .perm-l1-name input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer;
  }
  .perm-l1-badge {
    font-size: 11px; color: var(--primary); background: var(--primary-light);
    padding: 1px 8px; border-radius: 10px; margin-left: 4px; font-weight: 500;
  }

  /* 二级分类行 — 竖线引导 + 缩进 */
  .perm-l2 {
    display: flex; align-items: flex-start;
    padding: 10px 0 10px 40px;
    margin-left: 14px;
    border-left: 2px solid #dce1ea;
    position: relative;
  }
  .perm-l2::before {
    content: ''; position: absolute; left: -2px; top: 18px;
    width: 12px; height: 0; border-top: 2px solid #dce1ea;
  }
  .perm-l2:last-child { border-left-color: transparent; }
  .perm-l2:last-child::before { display: none; }
  .perm-l2-name {
    width: 105px; flex-shrink: 0;
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 600; color: var(--text);
    background: #edf0f7; padding: 4px 10px; border-radius: 5px;
    border: 1px solid #dfe3ec;
  }
  .perm-l2-name input[type="checkbox"] {
    width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer;
  }
  .perm-items {
    flex: 1; display: flex; flex-wrap: wrap; gap: 4px 10px;
    padding: 4px 8px;
    background: #f8f9fc;
    border: 1px solid #eef0f5;
    border-radius: 6px;
    min-height: 32px;
  }
  .perm-item {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--text-secondary); white-space: nowrap;
    padding: 3px 8px; border-radius: 4px;
    background: #fff; border: 1px solid #e8eaef;
    transition: all .15s;
  }
  .perm-item:hover { background: #f0f4ff; border-color: var(--primary); color: var(--primary); }
  .perm-item input[type="checkbox"] {
    width: 13px; height: 13px; accent-color: var(--primary); cursor: pointer;
  }

  /* 展开按钮 */
  .expand-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    transition: all .15s;
    color: var(--text-secondary);
  }
  .expand-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  .expand-btn svg { transition: transform .2s; }
  .expand-btn.open svg { transform: rotate(90deg); }

  /* 权限摘要 */
  .perm-summary {
    font-size: 12px;
    color: var(--primary);
    background: var(--primary-light);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  </style>
</head>

// ===== 渲染表格 =====
function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="12" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">点击「+ 新增岗位」创建记录</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      var permCount = 0;
      if (row.permissions) {
        Object.keys(row.permissions).forEach(function(k) { permCount += row.permissions[k].length; });
      }
      html += '<tr class="' + (row._checked ? 'row-selected' : '') + '">';
      html += '<td><input type="checkbox" class="row-check" value="' + row.id + '" ' + (row._checked ? 'checked' : '') + ' onclick="toggleRow(this,' + row.id + ')"></td>';
      html += '<td>' + (index + 1) + '</td>';
      html += '<td>' + escapeHtml(row.platformName) + '</td>';
      html += '<td>' + escapeHtml(row.positionName) + '</td>';
      html += '<td title="' + escapeHtml(row.positionDesc) + '">' + escapeHtml(row.positionDesc) + '</td>';
      html += '<td>' + getStatusTag(row.status) + '</td>';
      html += '<td>' + escapeHtml(row.creator) + '</td>';
      html += '<td>' + escapeHtml(row.createTime) + '</td>';
      html += '<td>' + escapeHtml(row.updater) + '</td>';
      html += '<td>' + escapeHtml(row.updateTime) + '</td>';
      html += '<td><span class="perm-summary">' + permCount + ' 项权限</span></td>';
      html += '<td class="col-actions">';
      html += '<button class="expand-btn" onclick="toggleExpand(this,' + row.id + ')" title="展开权限明细"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>';
      html += '<a class="link-action" href="javascript:void(0)" onclick="doEdit(' + row.id + ')">编辑</a>';
      html += '<a class="link-action" href="javascript:void(0)" onclick="doView(' + row.id + ')">查看</a>';
      html += '<a class="link-action" href="javascript:void(0)" onclick="doDelete(' + row.id + ')">删除</a>';
      html += '</td>';
      html += '</tr>';
      // 展开行：权限明细
      html += '<tr class="expand-row" id="expandRow_' + row.id + '"><td colspan="12">';
      html += buildPermissionTree(row);
      html += '</td></tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
  document.getElementById('checkAll').checked = false;
}

// ===== 构建权限树 HTML（三级结构） =====
function buildPermissionTree(row) {
  var html = '<div class="expand-content">';
  html += '<div class="expand-title"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> 权限明细配置</div>';
  permissionCategories.forEach(function(l1) {
    // 一级分类
    var l1Total = 0, l1Checked = 0;
    l1.children.forEach(function(l2) { l1Total += l2.children.length; });
    l1.children.forEach(function(l2) {
      var items = (row.permissions && row.permissions[l2.name]) || [];
      l1Checked += items.length;
    });
    var l1AllChecked = l1Total > 0 && l1Checked === l1Total;
    html += '<div class="perm-l1">';
    html += '<div class="perm-l1-name">';
    html += '<input type="checkbox" data-l1-name="' + l1.name + '" ' + (l1AllChecked ? 'checked' : '') + ' onchange="toggleL1(this,\'' + l1.name + '\',' + row.id + ')">';
    html += '<span>' + l1.name + '</span>';
    html += '</div>';
    html += '<span class="perm-l1-badge">' + l1Checked + '/' + l1Total + '</span>';
    html += '</div>';
    // 二级分类 + 三级权限项
    l1.children.forEach(function(l2) {
      var checkedItems = (row.permissions && row.permissions[l2.name]) || [];
      var l2AllChecked = checkedItems.length === l2.children.length;
      html += '<div class="perm-l2">';
      html += '<div class="perm-l2-name">';
      html += '<input type="checkbox" data-l2-name="' + l2.name + '" data-l1-name="' + l1.name + '" ' + (l2AllChecked ? 'checked' : '') + ' onchange="toggleL2(this,\'' + l2.name + '\',' + row.id + ')">';
      html += '<span>' + l2.name + '</span>';
      html += '</div>';
      html += '<div class="perm-items">';
      l2.children.forEach(function(item) {
        var isChecked = checkedItems.indexOf(item) > -1;
        html += '<label class="perm-item">';
        html += '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' data-l2="' + l2.name + '" data-l1="' + l1.name + '" data-item="' + item + '" onchange="onPermChange(' + row.id + ')">';
        html += '<span>' + item + '</span>';
        html += '</label>';
      });
      html += '</div></div>';
    });
  });
  html += '<div style="text-align:right;margin-top:12px;">';
  html += '<button class="btn btn-primary" onclick="savePermissions(' + row.id + ')">保存权限</button>';
  html += '<button class="btn" onclick="cancelPermissions(' + row.id + ')" style="margin-left:8px;">取消</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

// ===== 展开/收起权限明细 =====
function toggleExpand(btn, id) {
  var row = document.getElementById('expandRow_' + id);
  if (!row) return;
  var isOpen = row.classList.contains('show');
  document.querySelectorAll('.expand-row.show').forEach(function(r) { r.classList.remove('show'); });
  document.querySelectorAll('.expand-btn.open').forEach(function(b) { b.classList.remove('open'); });
  if (!isOpen) {
    row.classList.add('show');
    btn.classList.add('open');
    syncRowIndeterminate(id);
  }
}

// ===== 同步某行所有父级复选框的 indeterminate 状态 =====
function syncRowIndeterminate(rowId) {
  permissionCategories.forEach(function(l1) {
    // 同步二级 indeterminate
    l1.children.forEach(function(l2) {
      var allCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]');
      var checkedCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]:checked');
      var l2Cb = document.querySelector('#expandRow_' + rowId + ' input[data-l2-name="' + l2.name + '"]');
      if (l2Cb) {
        var n = allCbs.length, c = checkedCbs.length;
        l2Cb.checked = c > 0;
        l2Cb.indeterminate = c > 0 && c < n;
      }
    });
    // 同步一级 indeterminate
    var l1Cb = document.querySelector('#expandRow_' + rowId + ' input[data-l1-name="' + l1.name + '"]');
    if (l1Cb) {
      var total = 0, checked = 0;
      l1.children.forEach(function(l2) {
        var a = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]');
        var ck = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]:checked');
        total += a.length; checked += ck.length;
      });
      l1Cb.checked = checked > 0;
      l1Cb.indeterminate = checked > 0 && checked < total;
    }
  });
}

// ===== 一级分类全选/取消：勾选→全选所有二三级，取消→清空所有二三级 =====
function toggleL1(el, l1Name, rowId) {
  // indeterminate 状态下浏览器会设 checked=true，此时应视为“全选”
  var checked = el.checked;
  el.indeterminate = false;
  var l1 = permissionCategories.find(function(c) { return c.name === l1Name; });
  if (!l1) return;
  l1.children.forEach(function(l2) {
    var itemCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]');
    itemCbs.forEach(function(cb) { cb.checked = checked; });
    var l2Cb = document.querySelector('#expandRow_' + rowId + ' input[data-l2-name="' + l2.name + '"]');
    if (l2Cb) { l2Cb.checked = checked; l2Cb.indeterminate = false; }
  });
}

// ===== 二级分类全选/取消：勾选→全选所有三级项，取消→清空所有三级项 =====
function toggleL2(el, l2Name, rowId) {
  var checked = el.checked;
  el.indeterminate = false;
  var itemCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2Name + '"]');
  itemCbs.forEach(function(cb) { cb.checked = checked; });
  syncL1FromItems(rowId);
}

// ===== 三级权限项变更时：自动联动二级和一级三态 =====
function onPermChange(rowId) {
  // 联动二级三态
  permissionCategories.forEach(function(l1) {
    l1.children.forEach(function(l2) {
      var allCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]');
      var checkedCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]:checked');
      var l2Cb = document.querySelector('#expandRow_' + rowId + ' input[data-l2-name="' + l2.name + '"]');
      if (l2Cb) {
        var n = allCbs.length, c = checkedCbs.length;
        l2Cb.checked = c > 0;
        l2Cb.indeterminate = c > 0 && c < n;
      }
    });
  });
  // 联动一级三态
  syncL1FromItems(rowId);
}

// ===== 从三级项同步一级复选框三态：全选=✓，部分=–，无=空 =====
function syncL1FromItems(rowId) {
  permissionCategories.forEach(function(l1) {
    var l1Cb = document.querySelector('#expandRow_' + rowId + ' input[data-l1-name="' + l1.name + '"]');
    if (!l1Cb) return;
    var total = 0, checked = 0;
    l1.children.forEach(function(l2) {
      var allCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]');
      var checkedCbs = document.querySelectorAll('#expandRow_' + rowId + ' input[data-l2="' + l2.name + '"]:checked');
      total += allCbs.length;
      checked += checkedCbs.length;
    });
    l1Cb.checked = checked > 0;
    l1Cb.indeterminate = checked > 0 && checked < total;
  });
}

// ===== 保存权限（三级结构） =====
function savePermissions(id) {
  var row = null;
  for (var i = 0; i < mockData.length; i++) { if (mockData[i].id === id) { row = mockData[i]; break; } }
  if (!row) return;
  row.permissions = {};
  permissionCategories.forEach(function(l1) {
    l1.children.forEach(function(l2) {
      var cbs = document.querySelectorAll('#expandRow_' + id + ' input[data-l2="' + l2.name + '"]:checked');
      var items = [];
      cbs.forEach(function(cb) { items.push(cb.getAttribute('data-item')); });
      row.permissions[l2.name] = items;
    });
  });
  row.updateTime = new Date().toLocaleString('zh-CN', {hour12: false}).replace(/\//g, '-');
  localStorage.setItem(STORAGE_KEY, JSON.stringify(mockData));
  showToast('权限保存成功', 'success');
  renderTable(mockData);
}

// ===== 取消权限编辑 =====
function cancelPermissions(id) {
  var row = document.getElementById('expandRow_' + id);
  if (row) row.classList.remove('show');
  document.querySelectorAll('.expand-btn.open').forEach(function(b) { b.classList.remove('open'); });
}

// ===== 全选/取消全选 =====
function toggleAll(el) {
  var checks = document.querySelectorAll('.row-check');
  checks.forEach(function(c) {
    c.checked = el.checked;
    var tr = c.closest('tr');
    if (tr) tr.classList.toggle('row-selected', el.checked);
  });
}
function toggleRow(el, id) {
  var tr = el.closest('tr');
  if (tr) tr.classList.toggle('row-selected', el.checked);
  updateCheckAll();
}
function updateCheckAll() {
  var all = document.querySelectorAll('.row-check');
  var checked = document.querySelectorAll('.row-check:checked');
  document.getElementById('checkAll').checked = all.length > 0 && all.length === checked.length;
}

// ===== 状态标签 =====
function getStatusTag(status) {
  var cls = '';
  switch(status) {
    case '启用': cls = 'submitted'; break;
    case '未启用': cls = 'initial'; break;
    case '删除': cls = 'cancelled'; break;
    default: cls = 'initial';
  }
  return '<span class="status-tag ' + cls + '">' + escapeHtml(status) + '</span>';
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 搜索 =====
function doSearch() {
  var platform = document.getElementById('searchPlatform').value;
  var position = document.getElementById('searchPosition').value.trim();
  var status = document.getElementById('searchStatus').value;
  var filtered = mockData.filter(function(row) {
    if (platform && row.platformName !== platform) return false;
    if (position && row.positionName.indexOf(position) === -1) return false;
    if (status && row.status !== status) return false;
    return true;
  });
  renderTable(filtered);
  showSearchTags();
}

function resetSearch() {
  document.getElementById('searchPlatform').value = '';
  document.getElementById('searchPosition').value = '';
  document.getElementById('searchStatus').value = '';
  renderTable(mockData);
  hideSearchTags();
}

function showSearchTags() {
  var tags = [];
  var platform = document.getElementById('searchPlatform').value;
  var position = document.getElementById('searchPosition').value.trim();
  var status = document.getElementById('searchStatus').value;
  if (platform) tags.push({label:'平台名称: '+platform, field:'searchPlatform'});
  if (position) tags.push({label:'岗位名称: '+position, field:'searchPosition'});
  if (status) tags.push({label:'状态: '+status, field:'searchStatus'});
  var container = document.getElementById('searchTags');
  if (tags.length === 0) { container.style.display = 'none'; return; }
  container.style.display = '';
  container.innerHTML = tags.map(function(t) {
    return '<span class="active-tag" onclick="clearTag(\''+t.field+'\')">'+t.label+' ×</span>';
  }).join('');
}
function hideSearchTags() { document.getElementById('searchTags').style.display = 'none'; }
function clearTag(field) {
  var el = document.getElementById(field);
  if (el.tagName === 'SELECT') el.value = ''; else el.value = '';
  doSearch();
}

// ===== 操作按钮 =====
var STORAGE_KEY = 'position_permission_data';
var currentUser = '系统管理员';

// 初始化时将 mockData 同步到 localStorage（首次或旧数据迁移）
(function syncToStorage() {
  var stored = localStorage.getItem(STORAGE_KEY);
  if (!stored) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(mockData));
  } else {
    var parsed = JSON.parse(stored);
    // 检测旧数据结构（权限 key 为一级分类名），自动迁移
    var hasOldKeys = parsed.length > 0 && parsed[0].permissions && parsed[0].permissions['流量'] !== undefined;
    if (hasOldKeys) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(mockData));
      mockData = JSON.parse(JSON.stringify(mockData));
    } else {
      mockData = parsed;
    }
  }
})();

function goAdd() { showToast('新增岗位功能开发中', 'info'); }

function doEdit(id) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'openTab',
      page: 'pages/store-engine/position-permission-edit.html?id=' + id,
      title: '编辑岗位'
    }, '*');
  }
}

function doView(id) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'openTab',
      page: 'pages/store-engine/position-permission-view.html?id=' + id,
      title: '岗位详情'
    }, '*');
  }
}

function doDelete(id) {
  if (confirm('确定要删除该岗位吗？')) {
    var idx = -1;
    for (var i = 0; i < mockData.length; i++) { if (mockData[i].id === id) { idx = i; break; } }
    if (idx > -1) {
      mockData.splice(idx, 1);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(mockData));
      renderTable(mockData);
      showToast('删除成功', 'success');
    }
  }
}

// ===== Toast =====
function showToast(msg, type) {
  var container = document.getElementById('toastContainer');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + (type || 'info');
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(function() { toast.classList.add('toast-hide'); }, 2500);
  setTimeout(function() { toast.remove(); }, 3000);
}

// 初始化渲染
renderTable(mockData);
</script>
