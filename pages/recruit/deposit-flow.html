<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保证金流水 - 列表</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* 桌面端：操作列图标+文字链接 */
    .link-action-icon { display: inline-flex; align-items: center; gap: 4px; }
    .link-action-icon svg { flex-shrink: 0; }
    /* 主表字段较多：单元格统一不换行，横向滚动查看 */
    #dataTable th, #dataTable td { white-space: nowrap; }
    /* 操作列固定在右侧，表头与数据列同步吸附以保持对齐 */
    #dataTable thead th:last-child,
    #dataTable td.col-actions { position: sticky; right: 0; z-index: 2; }
    #dataTable td.col-actions {
      background: #fff;
      box-shadow: inset 1px 0 0 var(--border-light);
    }
    #dataTable tbody tr:hover td.col-actions { background: var(--primary-50); }
    /* 状态标签 */
    .type-tag {
      display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 10px;
      background: #f1f5f9; color: var(--text-secondary); font-size: 12px; font-weight: 600;
      line-height: 1.6; white-space: nowrap;
    }
    /* 移动端（<1024px）：卡片流替代宽表格 */
    .card-list { display: none; }
    @media (max-width: 1023px) {
      .table-area .table-scroll, .table-area .pagination { display: none; }
      .card-list { display: block; }
      .deposit-card {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 12px;
      }
      .deposit-card-head {
        display: flex; justify-content: space-between; align-items: center;
        gap: 10px; margin-bottom: 10px;
      }
      .deposit-card-head .name { font-size: 15px; font-weight: 700; color: var(--text); }
      .deposit-card-body { font-size: 13px; color: var(--text-secondary); line-height: 1.9; }
      .deposit-card-foot {
        display: flex; justify-content: flex-end;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light);
      }
    }
  </style>
</head>
<body>
<div class="page-container">

  <!-- Toast 轻提示容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="../../js/auth.js"></script>
  <script>
    // 权限检查
    if (!Auth.requireAuth()) {
      // 已在 requireAuth 中跳转到登录页
    }

    var currentUser = Auth.getCurrentUser();

    if (window.parent) {
      window.parent.postMessage({type:'breadcrumb', text:'分销枢纽 <span>/</span> 保证金流水'}, '*');
    }
  </script>

  <div class="page-title">保证金流水列表</div>

  <div class="search-area">
    <div class="search-row">
      <div class="search-item">
        <label>打款记录编号：</label>
        <input type="text" id="sPaymentNo" placeholder="请输入打款记录编号">
      </div>
      <div class="search-item">
        <label>业务单号：</label>
        <input type="text" id="sBusinessNo" placeholder="请输入业务单号">
      </div>
      <div class="search-item">
        <label>缴纳主体：</label>
        <input type="text" id="sPayerEntity" placeholder="请输入缴纳主体">
      </div>
      <div class="search-item">
        <label>保证金类型：</label>
        <select id="sDepositType">
          <option value="">全部</option>
          <option value="入驻保证金">入驻保证金</option>
          <option value="履约保证金">履约保证金</option>
          <option value="质量保证金">质量保证金</option>
        </select>
      </div>
      <div class="search-item">
        <label>状态：</label>
        <select id="sStatus">
          <option value="">全部</option>
          <option value="未提交">未提交</option>
          <option value="已提交">已提交</option>
        </select>
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>
    <div class="search-active-tags" id="searchTags" style="display:none;"></div>
  </div>

  <div class="card-list" id="cardList"></div>

  <div class="table-area">
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" id="checkAll" onclick="toggleCheckAll(this)"></th>
            <th>序号</th>
            <th>打款记录编号</th>
            <th>业务单号</th>
            <th>缴纳主体</th>
            <th>保证金类型</th>
            <th>打款金额</th>
            <th>打款方式</th>
            <th>打款时间</th>
            <th>交易流水号</th>
            <th>状态</th>
            <th>审核人</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info">共 <strong id="totalCount">0</strong> 条</span>
      <span class="page-btn disabled">&laquo;</span>
      <span class="page-btn active">1</span>
      <span class="page-btn">&raquo;</span>
    </div>
  </div>

</div>

<script>
var STORAGE_KEY = 'recruit_deposit_flow';

var defaultData = [
  {
    id: 1,
    payment_no: 'PAY-20260726-001',
    business_no: 'BIZ-20260726-001',
    payer_entity: '杭州星辰供应链管理有限公司',
    deposit_type: '入驻保证金',
    payment_amount: 50000.00,
    payment_method: '银行转账',
    payment_time: '2026-07-26 10:12:00',
    transaction_no: 'TXN20260726101200001',
    status: '已提交',
    reviewer: '李四',
    creator: '运营-李婷',
    created_at: '2026-07-26 10:12:00'
  },
  {
    id: 2,
    payment_no: 'PAY-20260727-002',
    business_no: 'BIZ-20260727-002',
    payer_entity: '广州锦华日用品有限公司',
    deposit_type: '履约保证金',
    payment_amount: 30000.00,
    payment_method: '银行转账',
    payment_time: '2026-07-27 14:05:00',
    transaction_no: 'TXN20260727140500002',
    status: '未提交',
    reviewer: '',
    creator: '运营-王强',
    created_at: '2026-07-27 14:05:00'
  },
  {
    id: 3,
    payment_no: 'PAY-20260728-003',
    business_no: 'BIZ-20260728-003',
    payer_entity: '林晓鹿',
    deposit_type: '入驻保证金',
    payment_amount: 10000.00,
    payment_method: '支付宝',
    payment_time: '2026-07-28 09:30:00',
    transaction_no: 'TXN20260728093000003',
    status: '已提交',
    reviewer: '赵六',
    creator: '运营-李婷',
    created_at: '2026-07-28 09:30:00'
  },
  {
    id: 4,
    payment_no: 'PAY-20260729-004',
    business_no: 'BIZ-20260729-004',
    payer_entity: 'SUNRISE TRADING CO., LIMITED',
    deposit_type: '质量保证金',
    payment_amount: 100000.00,
    payment_method: '国际汇款',
    payment_time: '2026-07-29 16:48:00',
    transaction_no: 'TXN20260729164800004',
    status: '未提交',
    reviewer: '',
    creator: '运营-陈静',
    created_at: '2026-07-29 16:48:00'
  }
];

var mockData = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || defaultData;
if (!localStorage.getItem(STORAGE_KEY)) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(mockData));
}

// 无值字段统一显示为空
function esc(s) {
  if (s === null || s === undefined || s === '') return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatAmount(n) {
  if (n === null || n === undefined || n === '') return '';
  return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderTable(data) {
  var tbody = document.getElementById('tableBody');
  var html = '';
  if (data.length === 0) {
    html = '<tr><td colspan="13" class="empty-state"><span class="empty-icon">&#128203;</span><div class="empty-text">暂无数据</div><div class="empty-hint">暂无符合条件的保证金流水</div></td></tr>';
  } else {
    data.forEach(function(row, index) {
      html += '<tr>';
      html += '<td><input type="checkbox" class="row-check" data-id="' + row.id + '"></td>';
      html += '<td>' + (index + 1) + '</td>';
      html += '<td>' + esc(row.payment_no) + '</td>';
      html += '<td>' + esc(row.business_no) + '</td>';
      html += '<td>' + esc(row.payer_entity) + '</td>';
      html += '<td>' + (row.deposit_type ? '<span class="type-tag">' + esc(row.deposit_type) + '</span>' : '') + '</td>';
      html += '<td>' + formatAmount(row.payment_amount) + '</td>';
      html += '<td>' + esc(row.payment_method) + '</td>';
      html += '<td>' + esc(row.payment_time) + '</td>';
      html += '<td>' + esc(row.transaction_no) + '</td>';
      html += '<td>' + statusTag(row.status) + '</td>';
      html += '<td>' + esc(row.reviewer) + '</td>';
      html += '<td class="col-actions">';
      if (row.status !== '已提交') {
        html += '<a class="link-action link-action-icon" title="编辑" href="deposit-flow-edit.html?id=' + row.id + '"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>编辑</a> ';
      }
      html += '<a class="link-action link-action-icon" title="查看详情" href="deposit-flow-detail.html?id=' + row.id + '"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>查看</a>';
      html += '</td></tr>';
    });
  }
  tbody.innerHTML = html;
  document.getElementById('totalCount').textContent = data.length;
}

function statusTag(s) {
  if (!s) return '';
  var m = { '未提交': 'initial', '已提交': 'approved' };
  return '<span class="status-tag ' + (m[s] || '') + '">' + esc(s) + '</span>';
}

function toggleCheckAll(el) {
  document.querySelectorAll('.row-check').forEach(function(cb) { cb.checked = el.checked; });
}

function renderCards(data) {
  var list = document.getElementById('cardList');
  var html = '';
  if (data.length === 0) {
    html = '<div class="deposit-card"><div class="deposit-card-body">暂无符合条件的保证金流水</div></div>';
  } else {
    data.forEach(function(row) {
      html += '<div class="deposit-card">';
      html += '<div class="deposit-card-head"><span class="name">' + esc(row.payment_no) + '</span>' +
        statusTag(row.status) + '</div>';
      html += '<div class="deposit-card-body">';
      html += '<div>缴纳主体：' + esc(row.payer_entity) + '</div>';
      html += '<div>保证金类型：' + esc(row.deposit_type) + '</div>';
      html += '<div>打款金额：' + formatAmount(row.payment_amount) + ' 元</div>';
      html += '</div>';
      html += '<div class="deposit-card-foot"><a class="btn btn-primary" style="height:48px;line-height:48px;padding:0 16px;" href="deposit-flow-detail.html?id=' + row.id + '">查看详情</a></div>';
      html += '</div>';
    });
  }
  list.innerHTML = html;
}

var currentFiltered = mockData.slice();

function isMobileView() {
  return window.matchMedia('(max-width: 1023px)').matches;
}

function renderView(data) {
  currentFiltered = data;
  if (isMobileView()) renderCards(data);
  else renderTable(data);
}

function filterData() {
  var paymentNo = document.getElementById('sPaymentNo').value.trim();
  var businessNo = document.getElementById('sBusinessNo').value.trim();
  var payerEntity = document.getElementById('sPayerEntity').value.trim();
  var depositType = document.getElementById('sDepositType').value;
  var status = document.getElementById('sStatus').value;
  return mockData.filter(function(x) {
    if (paymentNo && (x.payment_no || '').indexOf(paymentNo) < 0) return false;
    if (businessNo && (x.business_no || '').indexOf(businessNo) < 0) return false;
    if (payerEntity && (x.payer_entity || '').indexOf(payerEntity) < 0) return false;
    if (depositType && x.deposit_type !== depositType) return false;
    if (status && x.status !== status) return false;
    return true;
  });
}

function doSearch() {
  renderView(filterData());
  showSearchTags();
}

function resetSearch() {
  ['sPaymentNo', 'sBusinessNo', 'sPayerEntity', 'sDepositType', 'sStatus'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  renderView(mockData);
  showSearchTags();
}

function showSearchTags() {
  var map = {
    sPaymentNo: '打款记录编号', sBusinessNo: '业务单号',
    sPayerEntity: '缴纳主体', sDepositType: '保证金类型', sStatus: '状态'
  };
  var tags = [];
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (el && el.value) tags.push({ name: map[id], value: el.value, id: id });
  });
  var container = document.getElementById('searchTags');
  if (!container) return;
  if (tags.length === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }
  var html = '';
  tags.forEach(function(t) {
    html += '<span class="search-active-tag">' + t.name + '：' + esc(t.value) + '<span class="tag-remove" onclick="clearSearchTag(\'' + t.id + '\')">&times;</span></span>';
  });
  container.style.display = '';
  container.innerHTML = html;
}

function clearSearchTag(id) {
  document.getElementById(id).value = '';
  doSearch();
}

// Toast 轻提示
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}

window.addEventListener('resize', function() { renderView(currentFiltered); });

renderView(mockData);
</script>
</body>
</html>
