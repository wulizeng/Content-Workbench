<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>达人入驻登记 - 我的申请</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body { background: #f5f7fb; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mine-shell { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
    .mine-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    }
    .mine-header .title { font-size: 20px; font-weight: 700; color: var(--text); }
    .mine-header .phone-tag {
      font-size: 12px; color: var(--text-tertiary); background: #fff; padding: 5px 12px;
      border-radius: 20px; border: 1px solid var(--border);
    }
    .logout-link { font-size: 12px; color: var(--primary); cursor: pointer; margin-left: 10px; }

    .new-apply-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 16px; border-radius: 14px; border: 1.5px dashed var(--primary);
      background: var(--primary-light); color: var(--primary); font-size: 14px; font-weight: 600;
      cursor: pointer; margin-bottom: 20px; transition: all .18s;
    }
    .new-apply-btn:hover { background: #e3e6ff; }

    .app-card {
      background: #fff; border-radius: 14px; border: 1px solid var(--border);
      padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
    }
    .app-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .app-card-time { font-size: 12px; color: var(--text-tertiary); }
    .app-card-accounts { font-size: 13px; color: var(--text); line-height: 1.8; margin-bottom: 10px; }
    .app-card-accounts .plat-chip {
      display: inline-flex; padding: 2px 9px; border-radius: 10px; background: #f1f5f9;
      color: var(--text-secondary); font-size: 12px; margin-right: 6px; margin-bottom: 4px;
    }
    .app-card-reject {
      background: #fef2f2; border-radius: 8px; padding: 10px 12px; font-size: 12px;
      color: #dc2626; margin-bottom: 10px; line-height: 1.6;
    }
    .app-card-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .empty-wrap {
      text-align: center; padding: 60px 0; color: var(--text-tertiary);
    }
    .empty-wrap svg { color: #cbd5e1; margin-bottom: 12px; }
    .empty-wrap .t { font-size: 14px; margin-bottom: 18px; }
  </style>
</head>
<body>
<div class="mine-shell">

  <div class="mine-header">
    <div class="title" id="mineTitle">我的申请</div>
    <div>
      <span class="phone-tag" id="phoneTag">-</span>
      <span class="logout-link" onclick="doLogout()">退出</span>
    </div>
  </div>

  <div class="new-apply-btn" onclick="goApply('add')">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新建申请
  </div>

  <div id="appList"></div>

</div>

<div id="toastContainer" class="toast-container"></div>

<script>
var phone = localStorage.getItem('recruit_current_phone');
if (!phone) { location.href = 'login.html'; }

document.getElementById('phoneTag').textContent = phone;

var talents = JSON.parse(localStorage.getItem('recruit_talents') || '{}');
var talentName = (talents[phone] || {}).name;
if (talentName) { document.getElementById('mineTitle').textContent = talentName + ' 的申请'; }

function loadApps() {
  var all = JSON.parse(localStorage.getItem('recruit_applications') || '[]');
  return all.filter(function(a) { return a.phone === phone || a.talentPhone === phone; });
}

function render() {
  var apps = loadApps();
  var container = document.getElementById('appList');
  if (apps.length === 0) {
    container.innerHTML = '<div class="empty-wrap">' +
      '<svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
      '<div class="t">还没有提交过入驻申请</div>' +
      '</div>';
    return;
  }
  var html = '';
  apps.forEach(function(a) {
    var accountsHtml = (a.platform_accounts || []).map(function(p) {
      return '<span class="plat-chip">' + esc(p.platform) + ' ' + esc(p.account_name) + '</span>';
    }).join('');
    var rejectHtml = '';
    if (a.status === '已驳回' && a.reject_logs && a.reject_logs.length > 0) {
      var lastReason = a.reject_logs[a.reject_logs.length - 1].reason;
      rejectHtml = '<div class="app-card-reject">驳回原因：' + esc(lastReason) + '</div>';
    }
    var actionsHtml = '';
    if (a.status === '已驳回') {
      actionsHtml = '<button class="btn btn-primary" style="padding:6px 16px;font-size:12px;" onclick="goApply(\'edit\',' + a.id + ')">修改重提</button>';
    } else {
      actionsHtml = '<button class="btn" style="padding:6px 16px;font-size:12px;" disabled>' + (a.status === '已审核' ? '已完成' : '审核中，请联系BD处理') + '</button>';
    }
    html += '<div class="app-card">' +
      '<div class="app-card-top"><span class="app-card-time">提交于 ' + esc(a.created_at) + '</span>' + st(a.status) + '</div>' +
      '<div class="app-card-accounts">' + (accountsHtml || '暂无平台账号') + '</div>' +
      rejectHtml +
      '<div class="app-card-actions">' + actionsHtml + '</div>' +
      '</div>';
  });
  container.innerHTML = html;
}

function goApply(mode, id) {
  if (mode === 'edit') { location.href = 'apply.html?mode=edit&id=' + id; }
  else { location.href = 'apply.html?mode=add'; }
}

function doLogout() {
  localStorage.removeItem('recruit_current_phone');
  location.href = 'login.html';
}

function st(s) {
  var m = { '已提交':'submitted', '审核中':'reviewing', '已审核':'approved', '已驳回':'rejected' };
  return '<span class="status-tag '+(m[s]||'')+'">'+s+'</span>';
}
function esc(s) { if(!s) return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }
  }, 2500);
}

render();
</script>
</body>
</html>
